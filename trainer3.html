<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Juggernaut Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap');
:root{
  --bg:#f2f2f3;--text:#1d1f20;--muted:#5d5d60;--faint:#98989b;
  --line:color-mix(in srgb,#1d1f20 16%,transparent);--line-soft:color-mix(in srgb,#1d1f20 8%,transparent);
  --accent:#5980a6;--accent-strong:#416180;--accent-deep:#1d2d3d;--accent-tint:#eef6ff;--accent-tint-2:#d6ebff;
  --accent-hover:#597ea3;--accent-press:#416180;--on-accent:#f2f2f3;--danger:#a3412f;
  --mark:color-mix(in srgb,#1d1f20 55%,transparent);
  --font-h:"Barlow Condensed",system-ui,sans-serif;--font-b:"Barlow",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#18191b;--text:#ececee;--muted:#a6a6aa;--faint:#7a7a7d;
  --line:color-mix(in srgb,#ececee 18%,transparent);--line-soft:color-mix(in srgb,#ececee 9%,transparent);
  --accent:#749dc4;--accent-strong:#94bce3;--accent-deep:#d6ebff;--accent-tint:#1d2d3d;--accent-tint-2:#2c455d;
  --accent-hover:#94bce3;--accent-press:#b5d9fd;--on-accent:#101418;--danger:#e0806b;
  --mark:color-mix(in srgb,#ececee 50%,transparent);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-b);font-size:15px;background:var(--bg);color:var(--text);line-height:1.45}
::selection{background:var(--accent-tint-2)}
a{color:var(--accent-strong)}a:hover{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header,#app,footer{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:20px;padding-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--font-h);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
header .sub{margin:0;color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;padding:8px 16px calc(var(--nav-h) + 120px)}
h2,h3{font-family:var(--font-h);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:20px;margin:4px 0 10px}
h3{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* buttons + fields */
button{font-family:inherit;font-size:14px;padding:9px 14px;min-height:40px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);cursor:pointer}
button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
button:active{background:color-mix(in srgb,var(--text) 14%,transparent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{background:var(--accent-hover)}button.primary:active{background:var(--accent-press)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:12px;min-height:32px}
input[type=number],input[type=text],select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:0;padding:7px 9px;min-height:40px;font-size:15px;font-family:inherit}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:color-mix(in srgb,var(--text) 45%,transparent)}
input:focus-visible,select:focus-visible{border-color:var(--accent);outline-offset:0}
select option{background:var(--bg);color:var(--text)}
input[type=number]{width:84px}
label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
/* cards: hairline frames with registration marks */
.card{position:relative;border:1px solid var(--line);padding:16px;margin:0 0 22px;background:transparent}
.card>.corner{position:absolute;width:11px;height:11px;color:var(--mark);pointer-events:none}
.card>.corner::before,.card>.corner::after{content:"";position:absolute;background:currentColor}
.card>.corner::before{left:5px;top:0;width:1px;height:100%}
.card>.corner::after{top:5px;left:0;width:100%;height:1px}
.corner.tl{top:-6px;left:-6px}.corner.tr{top:-6px;right:-6px}.corner.bl{bottom:-6px;left:-6px}.corner.br{bottom:-6px;right:-6px}
.card.highlight{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.hint.sm{font-size:12px;margin:2px 0}
.amap-hint{border-left:2px solid var(--accent);padding-left:10px}
.kindtag{display:inline-flex;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-family:var(--font-b)}
.kindtag.main{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.kindtag.support{border-color:var(--accent);color:var(--accent-strong)}
.tag{color:var(--accent-strong);font-size:11px;font-weight:600;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.table th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom-color:var(--line)}
.table tbody tr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
tr.amap td{background:var(--accent-tint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row.wrap{gap:10px 14px}.row.spread{justify-content:space-between}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{flex:1;min-width:190px}
.daytab{font-size:14px}
.daytab.active{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.banner{border:1px solid var(--accent);background:var(--accent-tint);color:var(--accent-deep);padding:10px 12px;font-size:13px;margin:0 0 18px}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-deep);color:var(--bg);padding:10px 18px;font-size:14px;opacity:0;transition:all .25s ease;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px;border:0;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.04em}
.tab:hover{background:transparent;color:var(--text)}
.tab.active{color:var(--accent-strong);font-weight:600}
/* today */
.sess-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sess-title{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.weekticks{display:grid;gap:3px;margin:14px 0 0;align-items:center}
.weekticks i{height:3px;background:var(--line)}
.weekticks i.past{background:var(--accent)}
.weekticks i.now{background:var(--accent-strong);height:6px}
.phase-note{margin:12px 0 0;font-size:14px}
.slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.slot-name{font-family:var(--font-h);font-weight:600;font-size:23px;line-height:1.05;text-transform:uppercase;margin:8px 0 2px}
.slot.main .slot-name{font-size:40px;line-height:.95}
.slot-meta{font-size:13px;color:var(--muted)}
.vidlink{display:inline-flex;align-items:center;gap:5px;flex:none;min-height:36px;padding:0 10px;border:1px solid var(--line);color:var(--accent-strong);text-decoration:none;font-size:13px;vertical-align:middle}
.vidlink:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.table .vidlink{min-height:24px;padding:0 6px;font-size:11px}
details.info{margin-top:8px;font-size:13px;color:var(--muted)}
details.info summary{cursor:pointer;color:var(--accent-strong);font-size:12px;letter-spacing:.04em}
details.info div{margin-top:4px}
.lasttime{font-size:13px;color:var(--accent-strong);margin:10px 0 0}
.warm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-strong);border:1px solid var(--accent);padding:2px 8px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:14px}
.setcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:6px 2px}
.setcell .c-kg{font-family:var(--font-h);font-weight:600;font-size:21px;line-height:1.1}
.setcell .c-reps{font-size:12px;color:var(--muted)}
.setcell.amrap{border-style:dashed;border-color:var(--accent)}
.setcell.done{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.setcell.done:hover{background:var(--accent-hover)}
.setcell.done .c-reps{color:var(--on-accent)}
.setcell.done.short{background:var(--accent-tint-2);color:var(--accent-deep)}
.setcell.done.short .c-reps{color:var(--accent-deep)}
.setcell.open{outline:2px solid var(--accent-strong);outline-offset:1px}
.set-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.bump-note{font-size:13px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border-radius:6px;padding:6px 10px;margin:8px 0 0}
.bump-note[hidden]{display:none}
.editor{margin-top:12px;padding:12px;border:1px solid var(--accent);background:var(--accent-tint)}
.editor[hidden]{display:none}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ed-title{font-weight:600;font-size:14px}
.ed-target{font-size:12px;color:var(--muted)}
.ed-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed-field.wide{grid-column:1 / -1}
.ed-field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);background:var(--bg)}
.stepper button{border:0;padding:0;min-height:46px;font-size:20px;line-height:1}
.stepper input[type=number]{width:100%;min-height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;font-family:var(--font-h);font-weight:600;font-size:22px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{font-size:15px;font-weight:500}
.ed-hint{font-size:12px;color:var(--accent-deep);min-height:16px;margin:10px 0}
.ed-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.ed-actions button{min-height:46px}
.prog-head{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 4px}
.tm-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tm-name{font-size:13px;color:var(--muted)}
.tm-val{font-family:var(--font-h);font-weight:600;font-size:36px;line-height:1}
.tm-val small{font-family:var(--font-b);font-weight:400;font-size:13px;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;height:84px;margin-top:14px}
.bars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.bar{background:var(--accent);border:1px solid var(--accent)}
.bar.future{background:transparent;border-style:dashed}
.bar.na{height:2px;background:var(--line);border:0}
.bar-label{font-size:11px;color:var(--muted);text-align:center}
.bar-label b{color:var(--text);font-weight:600}
.tm-next{font-size:12px;color:var(--muted);margin:10px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line)}
.seg button{border:0;border-left:1px solid var(--line);min-height:44px;font-size:13px;padding:4px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.preview-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.preview-row .stepper{width:170px}
.preview-row .stepper span{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--font-h);font-weight:600;font-size:24px}
.tm-flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tm-flow .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tm-flow .v{font-family:var(--font-h);font-weight:600;font-size:30px;line-height:1.1}
.tm-flow .v.new{color:var(--accent-strong)}
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:4;display:grid;grid-template-columns:auto 1fr 1.7fr;gap:8px;padding:10px;margin:0 0 16px;background:var(--bg);border:1px solid var(--line)}
.actionbar button{min-height:48px}
body.editing .actionbar{display:none}
.backup-dot{position:absolute;top:8px;left:calc(50% + 8px);width:7px;height:7px;background:var(--accent);border-radius:50%}
.tab{position:relative}
.swap-panel{border:1px dashed var(--accent);background:var(--accent-tint);padding:12px;margin:12px 0 0}
.swap-panel label{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.swap-panel select,.swap-panel input{width:100%;max-width:100%;text-transform:none;letter-spacing:0}
.swap-add{display:grid;gap:8px;margin-top:8px}
.swap-add[hidden]{display:none}
.swap-panel .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.swap-panel .row button{min-height:44px}
.skip-panel .hint{margin:0 0 8px}
.skip-reasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.skip-reasons button{min-height:44px}
.card.slot.skipped{opacity:.7}
.nc-table th,.nc-table td{padding-left:4px;padding-right:4px}
.nc-res{display:flex;align-items:center;gap:4px}
.nc-res input{min-width:0;padding-left:6px;padding-right:6px}
.nc-res .nc-kg{width:5em}.nc-res .nc-reps{width:3.2em}
.nc-table .nc-tm{width:4.6em;padding-left:6px;padding-right:6px}
.tw-fields{margin-top:12px}
.tw-fields input{width:100%;font-size:20px}
.skip-note{font-size:13px;font-weight:600;margin:8px 0}
details.info .row{margin-top:10px}
.logged-note{margin:0 0 12px}
.libtable thead{display:none}
.libtable,.libtable tbody,.libtable tr{display:block}
.libtable tr{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.libtable td{display:block;border:0;padding:2px 0}
.libtable td.lib-step,.libtable td.lib-type{display:inline-block;vertical-align:top;width:calc(50% - 6px)}
.libtable td.lib-step{margin-right:8px}
.libtable input,.libtable select{width:100%}
.lib-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:2px}
</style>

<footer>Main lifts run the wave tables off your training max; the Realization AMRAP sets the next one. Everything else is yours to set. Data stays in this browser — export from Setup to back it up.<p style="margin-top:10px"><a href="./trainer.html" style="color:inherit">v2 trainer (the first block) →</a></p></footer>

<script>
/*
 * Juggernaut trainer v2 — engine.
 *
 * One idea instead of three: every prescribed piece of work is a SLOT.
 *   { movement, load, sets, reps, rir }   (+ repsTop for a rep range)
 *
 * A slot's load is typed, which is what lets a chin-up, a machine row and a
 * barbell squat all live in the same structure:
 *   { kind:'wave' }                      main lift — sets/reps/% from the wave table
 *   { kind:'pctTM', lift, pct }          a percentage of some tracked lift's TM
 *   { kind:'weight', kg }                a plain load
 *   { kind:'bodyweight', added }         bodyweight plus whatever is on the belt
 *   { kind:'open' }                      you decide in the gym
 *
 * Only wave slots take an AMRAP and drive the training max. Everything else is
 * prescription plus logging. The wave tables and the progression formula are
 * the method and are locked by tests/methodology-lock.test.mjs.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.JG2 = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PHASES = ['Accumulation', 'Intensification', 'Realization', 'Deload'];

  // The method. Percentages of the training max, reps, and where the AMRAP sits.
  var WAVES = {
    '10s': {
      Accumulation: [[0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10, 'A']],
      Intensification: [[0.55, 5], [0.625, 5], [0.675, 10], [0.675, 10], [0.675, 10, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 1], [0.75, 10, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '8s': {
      Accumulation: [[0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8, 'A']],
      Intensification: [[0.6, 3], [0.675, 3], [0.725, 8], [0.725, 8], [0.725, 8, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 8, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '5s': {
      Accumulation: [[0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5, 'A']],
      Intensification: [[0.65, 2], [0.725, 2], [0.775, 5], [0.775, 5], [0.775, 5], [0.775, 5, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 5, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '3s': {
      Accumulation: [[0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3, 'A']],
      Intensification: [[0.7, 1], [0.775, 1], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 1], [0.9, 3, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    }
  };

  // Excel MROUND semantics: halves away from zero. Kept so v1 and v2 agree.
  function mround(value, step) {
    if (!step || step <= 0) { return value; }
    var q = Math.abs(value) / step;
    var r = Math.floor(q + 0.5) * step * (value < 0 ? -1 : 1);
    return Math.round(r * 1000) / 1000;
  }

  function phaseFor(week) { return PHASES[(week - 1) % 4]; }
  function waveSlotFor(week) { return Math.floor((week - 1) / 4); }
  function waveFor(week, waveSlots) { return waveSlots[waveSlotFor(week) % waveSlots.length]; }
  function standardReps(wave) { return parseInt(wave, 10); }

  function tracked(name, lifts) {
    for (var i = 0; i < lifts.length; i++) { if (lifts[i].name === name) { return lifts[i]; } }
    return null;
  }

  /* ---------------- load resolution ---------------- */

  // Returns kg, or null when the app can't know it (open loads, missing TM).
  function resolveLoad(load, movement, ctx) {
    if (!load) { return null; }
    var lift;
    switch (load.kind) {
      case 'wave':
        lift = tracked(movement, ctx.lifts);
        return lift ? lift.tm : null;                     // caller applies the %
      case 'pctTM':
        lift = tracked(load.lift || movement, ctx.lifts);
        return lift ? mround(lift.tm * load.pct, ctx.rounding) : null;
      case 'weight':
        return load.kg === null || load.kg === undefined ? null : load.kg;
      case 'bodyweight':
        // Bodyweight is not a plate load — don't round it to the plate step.
        return ctx.bodyweight ? Math.round((ctx.bodyweight + (load.added || 0)) * 10) / 10 : null;
      default:
        return null;                                       // 'open'
    }
  }

    if (!load) { return ''; }
    if (load.kind === 'pctTM') { return Math.round(load.pct * 1000) / 10 + '% ' + (load.lift || movement); }

      var a = load.added || 0;
      return a ? 'bodyweight + ' + a : 'bodyweight';
    }
    if (load.kind === 'open') { return 'your call'; }
    return '';

  /* ---------------- prescription ---------------- */

  // Volume scaling per phase, applied to everything except the main lift —
  // the wave table already varies the main work.
  function phaseScale(phase, rules) {
    var r = (rules || {})[phase];
    return r && r.scale ? r.scale : 1;
  }

  // Scaling is per phase only. A per-wave bonus was tried and removed: the main
  // lift's rep volume falls across the waves but its SET count rises (15 a week
  // in the 10s, 21 in the 3s), so weekly totals already climb into the 3s wave
  // without help. See the note in CLAUDE.md before adding one back.
  function scaleSets(sets, phase, rules) {

  // and progresses by double progression: reps climb at a fixed weight until
  // every set reaches the top, then the weight goes up and reps drop back.
  // A top at or below the bottom is no range at all — fixed reps.
  function repTop(slot) {

  }

  // Expand one slot into the sets you actually perform.
  function prescribe(slot, week, ctx) {

      var table = (WAVES[wave] || {})[phase] || [];
      var tm = resolveLoad(slot.load, slot.movement, ctx);

      out.standard = standardReps(wave);
      out.sets = table.map(function (row, i) {
        return {

          pct: row[0],
          reps: row[1],
          amrap: row[2] === 'A',
          kg: tm === null ? null : mround(tm * row[0], ctx.rounding)
        };
      });
      if (out.sets.length) {
        out.warmups = warmups(out.sets[0].kg, phase, { rounding: ctx.rounding });
      }
      return out;
    }

    var n = scaleSets(slot.sets || 1, phase, ctx.phaseRules);
    var kg = resolveLoad(slot.load, slot.movement, ctx);
    var reps = slot.reps;
    var top = repTop(slot);

    // accessories do: that week's AMRAP sets the next training max.
    if (slot.kind === 'support' && phase === 'Realization' && slot.load && slot.load.kind === 'pctTM') {
      kg = resolveLoad({ kind: 'pctTM', lift: slot.load.lift, pct: 0.6 }, slot.movement, ctx);
    }
    for (var i = 0; i < n; i++) {
      out.sets.push({ n: i + 1, reps: reps, top: top, kg: kg, amrap: false });
    }
    out.label = loadLabel(slot.load, slot.movement, ctx);
    return out;
  }

  /* ---------------- the day ---------------- */

  function slotsFor(programme, week, dayIndex) {
    var day = programme.days[dayIndex];
    var slots = day.slots.map(function (s) { return JSON.parse(JSON.stringify(s)); });
    var ov = (programme.weekOverrides || {})[week];
    var dayOv = ov && ov[day.name];
    if (dayOv && dayOv.slots) {
      Object.keys(dayOv.slots).forEach(function (id) {
        for (var i = 0; i < slots.length; i++) {
          if (slots[i].id === id) {
            var patch = dayOv.slots[id];
            Object.keys(patch).forEach(function (k) { slots[i][k] = patch[k]; });
          }
        }
      });
    }
    return slots;
  }

  function prescribeDay(programme, week, dayIndex, ctx) {
    var c = {
      lifts: ctx.lifts, rounding: ctx.rounding, bodyweight: ctx.bodyweight,
      waveSlots: ctx.waveSlots || programme.waveSlots, phaseRules: programme.phaseRules

    return slotsFor(programme, week, dayIndex).map(function (s) {
      var p = prescribe(s, week, c);
      p.id = s.id;
      p.slot = s;
      return p;
    });
  }

  /* ---------------- progression ---------------- */

  // "[(Reps Performed - Standard) x Increment per rep] + Working Max = New Working Max",
  // with the book's cap: only 10 reps beyond the standard count. Very high rep
  // sets are common early on and would otherwise inflate the max past what the
  // lift has earned.
  var REP_CAP_OVER_STANDARD = 10;
  function nextTM(oldTM, amrapReps, standard, incPerRep) {
    if (amrapReps === null || amrapReps === undefined || amrapReps === '') { return null; }
    var over = Math.min(amrapReps - standard, REP_CAP_OVER_STANDARD);
    return Math.round((oldTM + over * incPerRep) * 100) / 100;
  }

  function estimate1RM(kg, reps) {
    if (!kg || !reps || reps < 1) { return 0; }
    return Math.round(kg * (1 + reps / 30) * 10) / 10;
  }

  // Which lifts take an AMRAP anywhere in the programme — the TM Tracker's rows.
  function progressingLifts(programme) {
    var seen = [];
    for (var w = 1; w <= programme.weeks; w++) {
      for (var d = 0; d < programme.days.length; d++) {
        slotsFor(programme, w, d).forEach(function (s) {
          if (s.load && s.load.kind === 'wave' && seen.indexOf(s.movement) === -1) { seen.push(s.movement); }
        });
      }
    }
    return seen;
  }

  /* ---------------- volume ---------------- */

  function weeklyVolume(programme, week, ctx) {
    var totals = {};
    for (var d = 0; d < programme.days.length; d++) {
      prescribeDay(programme, week, d, ctx).forEach(function (p) {
        var m = programme.movements.filter(function (x) { return x.name === p.movement; })[0];
        var group = m ? m.group : 'Other';
        totals[group] = (totals[group] || 0) + p.sets.length;
      });
    }
    return totals;
  }

  return {
    PHASES: PHASES, WAVES: WAVES,
    mround: mround, phaseFor: phaseFor, waveFor: waveFor, waveSlotFor: waveSlotFor,
    standardReps: standardReps, tracked: tracked,
    resolveLoad: resolveLoad, loadLabel: loadLabel,
    prescribe: prescribe, prescribeDay: prescribeDay, slotsFor: slotsFor,
    nextTM: nextTM, REP_CAP_OVER_STANDARD: REP_CAP_OVER_STANDARD, estimate1RM: estimate1RM, progressingLifts: progressingLifts,
    weeklyVolume: weeklyVolume, scaleSets: scaleSets, repTop: repTop, repsLabel: repsLabel
  };
});

<script>

  function defaultState() {

      equipOverrides: {},

      movementIncrements: {},

      cycle: 1,

  var skipOpen = null;

      });

      s.settings.bodyweight = old.inputs.bodyweight || s.settings.bodyweight;

  var RESERVE_HINT = {
    Accumulation: 'RIR 2-3',
    Intensification: 'RIR 1-2',
    Realization: 'RIR 0 — AMRAP'
  };
  // Short form for the in-row tag — the sets table is narrow on a phone and
  // .sets .target is nowrap, so the full sentence above belongs in the header
  // hint, not squeezed into this column.
  var RESERVE_TAG = {
    Accumulation: 'RIR 2-3',
    Intensification: 'RIR 1-2',
    Realization: 'AMRAP'
  };

  // Target RIR for the last main set, as a number the stepper can start from.
  var MAIN_RIR = { Accumulation: 2, Intensification: 1, Realization: 0 };

  function sessionHeader(week, day) {
    var wave = E.waveFor(week, P0.waveSlots), phase = E.phaseFor(week);
    var d = programme().days[day];
    var mains = mainSlots(week, day);
    var ticks = '';
    for (var w = 1; w <= P0.weeks; w++) { ticks += '<i class="' + (w < week ? 'past' : w === week ? 'now' : '') + '"></i>'; }
    var note = {
      Accumulation: 'Last main set: push past the prescribed reps, but stop at RIR 2–3. Not a true AMRAP.',
      Intensification: 'Last main set: push past the prescribed reps, but stop at RIR 1–2.',
      Realization: 'Last main set is an AMRAP against a standard of ' + E.standardReps(wave) + ', RIR 0. Those reps set your next training max — log them here and Progress picks them up.',
      Deload: 'Main work as written, everything else cut right back. Leave fresh.'
    }[phase];
    return '<div class="card sess">' +
      '<div class="sess-kicker">' + ((state.cycle || 1) > 1 ? 'Cycle ' + state.cycle + ' · ' : '') + 'Week ' + week + ' of ' + P0.weeks + ' · ' + esc(d.name) + '</div>' +
      '<div class="sess-title">' + esc(mains.length ? mains.map(function (m) { return m.movement; }).join(' + ') : d.name) + ' day</div>' +
      '<div class="tags"><span class="pill accent">' + wave + ' wave</span><span class="pill">' + phase + '</span></div>' +
      '<div class="weekticks" style="grid-template-columns:repeat(' + P0.weeks + ',1fr)" aria-hidden="true">' + ticks + '</div>' +
      (note ? '<p class="phase-note">' + note + '</p>' : '') +
      '</div>';
  }

  // Verified, specific videos for the main lifts only — same author as the
  // book (Chad Wesley Smith / Juggernaut Training Systems), so the technique
  // shown matches the method this app runs. Everything else links to a
  // YouTube search instead of a hand-picked video: a specific video ID goes
  // dead or private with no warning, a search query never does, and there
  // are too many accessories to keep re-verifying individual links by hand.
  var CURATED_VIDEOS = {
    'Squat': 'https://www.youtube.com/watch?v=X_wwJhaN0vU',
    'Bench Press': 'https://www.youtube.com/watch?v=LpLmYf9z1ZA',
    'Deadlift': 'https://www.youtube.com/watch?v=rukd80YXUaE'
  };
  function videoLinkFor(movementName) {
    return CURATED_VIDEOS[movementName] ||
      ('https://www.youtube.com/results?search_query=' + encodeURIComponent(movementName + ' exercise form'));
  }
  function videoLink(movementName) {
    return '<a class="vidlink" href="' + esc(videoLinkFor(movementName)) + '" target="_blank" rel="noopener" title="Watch a form demo">' + icon(ICONS.play, 13) + 'Form</a>';
  }

  function renderSlot(p, week, day, idx) {
    var log = logFor(week, day);
    var entry = log.slots[p.id] || {};
    var logged = entry.sets || [];
    var prev = lastTime(p.movement, week, day);
    var info = movementInfo(p.movement);
    var isMain = p.slot.load.kind === 'wave';
    var phase = E.phaseFor(week);

    var prevLine = '';
    if (prev) {
      var txt = (prev.entry.sets || []).filter(function (s) { return s && s.reps; })
        .map(function (s) { return (s.kg === null || s.kg === undefined ? '?' : s.kg) + '×' + (s.reps === null || s.reps === undefined ? '?' : s.reps); }).join('  ');
      var rirs = (prev.entry.sets || []).filter(function (s) { return s && s.reps && s.rir !== null && s.rir !== undefined; })
        .map(function (s) { return s.rir; });
      prevLine = '<div class="lasttime">Last time (' + (prev.cycle ? 'cycle ' + prev.cycle + ', ' : '') + 'wk ' + prev.week + '): ' + esc(txt) + (rirs.length ? ' · RIR ' + esc(rirs.join('/')) : '') + '</div>';
    }
    var warm = p.warmups.length
      ? '<div class="warm">Warm-up ' + p.warmups.map(function (w) { return '<span class="chip">' + fmt(w.kg) + ' × ' + w.reps + '</span>'; }).join('') + '</div>'
      : '';

    // Weight steps by the plate rounding for TM-driven loads, otherwise by the
    // movement's own equipment jump.
    var kgStep = (isMain || p.slot.load.kind === 'pctTM') ? state.settings.rounding : (incrementFor(p.movement) || state.settings.rounding);
    function field(label, input, step, wide) {
      return '<div class="ed-field' + (wide ? ' wide' : '') + '"><span>' + label + '</span><div class="stepper">' +
        '<button type="button" data-action="step" data-d="-' + step + '" aria-label="Less ' + label + '">−</button>' + input +
        '<button type="button" data-action="step" data-d="' + step + '" aria-label="More ' + label + '">+</button></div></div>';
    }

    // RIR is asked for only where something uses it: a fixed-rep slot, which
    // progresses on a beaten RIR. A rep range progresses on reps alone and the
    // main lift on its AMRAP reps, so there the target RIR stays in the set
    // header as where to stop, and the box is gone. A RIR logged before this
    // rides along in a hidden input so re-saving an old session keeps it.
    var askRir = !isMain && !p.repsTop;
    var cells = '', editors = '', amrapSet = null;
    p.sets.forEach(function (s, i) {
      var lg = logged[i] || {};
      // Each set's weight starts from the set before it, once that one is logged:
      // a first-time exercise has nothing prefilled, and a weight changed on set 1
      // should not have to be typed again on sets 2 and 3. Main-lift sets are the
      // exception — a ramp prescribes a different weight per set.
      var carried = null;
      if (V3_LOGGING && !isMain && i > 0) {
        var before = logged[i - 1];
        if (before && before.reps && before.kg !== null && before.kg !== undefined) { carried = before.kg; }
      }
      var kgVal = lg.kg !== null && lg.kg !== undefined ? lg.kg
        : carried !== null ? carried
        : (s.kg === null ? fmtBox(suggestedKgFor(p.movement, week, day, i)) : s.kg);
      var repVal = lg.reps !== null && lg.reps !== undefined ? lg.reps : '';
      var rirVal = lg.rir !== null && lg.rir !== undefined ? lg.rir : '';
      var tRir = isMain ? (s.amrap && MAIN_RIR[phase] !== undefined ? MAIN_RIR[phase] : '') : (p.rir === undefined ? '' : p.rir);
      if (s.amrap) { amrapSet = s; }
      var repsTxt = E.repsLabel(s.reps, s.top);
      var target = 'Target ' + repsTxt + (s.amrap ? '+' : '') +
        (s.amrap && isMain ? ' · ' + (RESERVE_TAG[phase] || 'AMRAP') : (tRir !== '' ? ' @ RIR ' + tRir : '')) +
        (isMain ? ' · ' + Math.round(s.pct * 1000) / 10 + '% TM' : '');
      cells += '<button type="button" class="setcell' + (s.amrap ? ' amrap' : '') + '" data-action="cell" data-i="' + i + '" aria-label="Set ' + s.n + '">' +
        '<span class="c-kg"></span><span class="c-reps"></span></button>';
      editors += '<div class="editor" data-i="' + i + '" data-treps="' + s.reps + '" data-ttop="' + (s.top || '') + '" data-trir="' + tRir + '" data-amrap="' + (s.amrap ? 1 : 0) + '" hidden>' +
        '<div class="ed-head"><span class="ed-title">Set ' + s.n + '</span><span class="ed-target">' + esc(target) + '</span></div>' +
        '<div class="ed-fields">' +
        field('Reps', '<input type="number" inputmode="numeric" step="1" min="0" class="in-reps" data-i="' + i + '" value="' + repVal + '" placeholder="' + repsTxt + '">', 1) +
        (askRir
          ? field('RIR', '<input type="number" inputmode="numeric" step="1" min="0" class="in-rir" data-i="' + i + '" value="' + rirVal + '" placeholder="' + tRir + '">', 1)
          : '<input type="hidden" class="in-rir" data-i="' + i + '" value="' + rirVal + '">') +
        field(U(), '<input type="number" inputmode="decimal" step="0.5" min="0" class="in-kg" data-i="' + i + '" value="' + kgVal + '">', kgStep, askRir) +
        '</div><div class="ed-hint"></div>' +
        '<div class="ed-actions"><button type="button" data-action="clear-set">Clear</button><button type="button" class="primary" data-action="log-set">Log set</button></div>' +
        '</div>';
    });

    var meta = isMain
      ? p.wave + ' wave · TM ' + fmt((E.tracked(p.movement, state.lifts) || {}).tm) + ' ' + U()
      : [p.label ? esc(p.label) : '', p.sets.length + ' × ' + (p.sets[0] ? E.repsLabel(p.sets[0].reps, p.sets[0].top) : ''), p.rir !== undefined ? 'RIR ' + p.rir : ''].filter(Boolean).join(' · ');
    var head = '<div class="slot-head"><div><span class="kindtag ' + p.kind + '">' + p.kind + '</span>' +
      '<div class="slot-name">' + esc(p.movement) + '</div><div class="slot-meta">' + meta + '</div></div>' +
      videoLink(p.movement) + '</div>';
    // A skipped exercise folds down to its reason. Sets done before the skip
    // stay logged; it can never earn a progression (earnedBump).
    if (entry.skipped && !isMain) {
      var doneSets = logged.filter(function (x) { return x && x.reps; }).length;
      return '<div class="card slot skipped" data-slot="' + esc(p.id) + '" data-movement="' + esc(p.movement) + '" data-skipped="1">' + head +
        '<p class="skip-note">Skipped · ' + esc(entry.skipped.reason) + (entry.skipped.note ? ' — ' + esc(entry.skipped.note) : '') +
        (doneSets ? ' · ' + doneSets + ' of ' + p.sets.length + ' sets done' : '') + '</p>' +
        '<div class="row"><button type="button" class="small" data-action="unskip" data-slot="' + esc(p.id) + '">Undo skip</button></div></div>';
    }
    var swapping = swapOpen === p.id && !isMain;
    var skipping = skipOpen === p.id && !isMain;
    var infoHtml = ((info && info.kit) || p.note || !isMain)
      ? '<details class="info"' + (swapping || skipping ? ' open' : '') + '><summary>More</summary>' +
        (info && info.kit ? '<div>' + esc(info.kit) + (info.note ? ' — ' + esc(info.note) : '') + '</div>' : '') +
        (p.note ? '<div>' + esc(p.note) + '</div>' : '') +
        // The main lift has neither: its wave and AMRAP belong to the lift, and
        // skipping it is a decision about the session, not one exercise.
        (!isMain ? '<div class="row"><button type="button" class="small swap-btn" data-action="swap-open" data-slot="' + esc(p.id) + '">Swap exercise</button>' +
          '<button type="button" class="small skip-btn" data-action="skip-open" data-slot="' + esc(p.id) + '">Skip exercise</button></div>' : '') +
        '</details>' + (swapping ? swapPanel(p) : '') + (skipping ? skipPanel(p) : '')
      : '';
    var setNote = isMain && amrapSet ? 'Tap a set to log it. Last set: ' + amrapSet.reps + '+ · ' + (RESERVE_HINT[phase] || '') : '';

    return '<div class="card slot' + (isMain ? ' main' : '') + '" data-slot="' + esc(p.id) + '" data-movement="' + esc(p.movement) + '">' +
      head + infoHtml + prevLine + warm +
      '<div class="setgrid">' + cells + '</div>' +
      '<p class="bump-note"' + (bumpNoteText(entry) ? '' : ' hidden') + '>' + esc(bumpNoteText(entry)) + '</p>' +
      (setNote ? '<p class="set-note">' + setNote + '</p>' : '') +
      editors +
      '</div>';
  }

  // Paints a set cell from its editor's inputs. The inputs stay the source of
  // truth — readSession() reads them exactly as it always has.
  function refreshCell(card, i) {
    var ed = card.querySelector('.editor[data-i="' + i + '"]');
    var cell = card.querySelector('.setcell[data-i="' + i + '"]');
    if (!ed || !cell) { return; }
    var reps = num(ed.querySelector('.in-reps').value), rir = num(ed.querySelector('.in-rir').value), kg = num(ed.querySelector('.in-kg').value);
    var tReps = num(ed.dataset.treps), tTop = num(ed.dataset.ttop), tRir = num(ed.dataset.trir), amrap = ed.dataset.amrap === '1';
    var done = reps !== null;
    var short = done && ((tReps !== null && reps < tReps) || (rir !== null && tRir !== null && rir < tRir));
    cell.classList.toggle('done', done);
    cell.classList.toggle('short', short);
    cell.querySelector('.c-kg').textContent = kg === null ? '–' : fmt(kg);
    cell.querySelector('.c-reps').textContent = done ? reps + (rir !== null ? ' @ ' + rir : '') : '× ' + E.repsLabel(tReps, tTop) + (amrap ? '+' : '');
    var hints = [];
    if (done && tReps !== null && reps < tReps) { hints.push((tReps - reps) + ' short of target'); }
    if (done && amrap && tReps !== null && reps > tReps) { hints.push((reps - tReps) + ' over the standard'); }
    if (done && tTop !== null && reps >= tTop) { hints.push('top of the range — stop here'); }
    if (rir !== null && tRir !== null && rir < tRir) { hints.push('harder than planned'); }
    ed.querySelector('.ed-hint').textContent = hints.join(' · ');
  }

  // Every logged set re-checks progression, so the weight goes up for next
  // session the moment the last set reaches the top — no Save needed — and a
  // set corrected back down takes it away again (undoBump).
  function persistSession() {
    readSession();
    progressAccessories(state.cursor.week, state.cursor.day);
    save();
    paintBumpNotes();
  }

  function bumpNoteText(entry) {
    var b = entry && entry.bump;
    if (!b) { return ''; }
    var up = b.kind === 'pctTM' || b.kind === 'open' ? '+' + fmt(b.inc) + ' ' + U()
      : b.kind === 'bodyweight' ? fmt(b.to) + ' added' : fmt(b.to) + ' ' + U();
    return 'Top of the range on every set — next session ' + up;
  }
  function paintBumpNotes() {
    var log = state.logs[logKey(state.cursor.week, state.cursor.day)];
    document.querySelectorAll('#app .card.slot').forEach(function (card) {
      var el = card.querySelector('.bump-note');
      if (!el) { return; }
      var txt = bumpNoteText(log && log.slots[card.dataset.slot]);
      el.textContent = txt; el.hidden = !txt;
    });
  }

  // v3: while a set's editor is open the Back / Save / Finish bar is hidden. It
  // floats just above the tab bar, so it can sit right over an editor's Log set
  // button, and a stray tap on Save or Finish mid-entry re-renders the page or
  // ends the session. Every logged set saves itself, so nothing is lost by it
  // being away; it comes back as soon as the editor closes.
  function syncEditing() {
    if (!V3_LOGGING) { return; }
    document.body.classList.toggle('editing', !!document.querySelector('#app .editor:not([hidden])'));
  }

  function setAction(btn, a) {
    setActionInner(btn, a);
    syncEditing();
  }

  function setActionInner(btn, a) {
    var card = btn.closest('.card.slot');
    if (!card) { return; }
    if (a === 'cell') {
      var ci = btn.dataset.i;
      var target = card.querySelector('.editor[data-i="' + ci + '"]');
      var opening = target.hidden;
      document.querySelectorAll('#app .editor').forEach(function (e) { e.hidden = true; });
      document.querySelectorAll('#app .setcell.open').forEach(function (c) { c.classList.remove('open'); });
      if (opening) { target.hidden = false; btn.classList.add('open'); }
      return;
    }
    var ed = btn.closest('.editor');
    var i = ed.dataset.i;
    var reps = ed.querySelector('.in-reps'), rir = ed.querySelector('.in-rir');
    if (a === 'step') {
      var input = btn.parentNode.querySelector('input');
      var cur = num(input.value);
      if (cur === null) {
        // An empty box steps from the target, so "−" on a missed set means one short.
        if (input === reps) { cur = num(ed.dataset.treps) || 0; }
        else if (input === rir) { cur = num(ed.dataset.trir) === null ? 2 : num(ed.dataset.trir); }
        else { cur = 0; }
      }
      input.value = Math.max(0, Math.round((cur + Number(btn.dataset.d)) * 100) / 100);
      if (input.classList.contains('in-kg')) { input.dataset.touched = '1'; }
      refreshCell(card, i); persistSession();
      return;
    }
    var cell = card.querySelector('.setcell[data-i="' + i + '"]');
    if (a === 'log-set') {
      if (reps.value === '') {
        // The AMRAP set exists to record what you actually got, and on a
        // Realization week that number becomes the next training max, so
        // nothing is assumed for it. Any other set can be "did the plan" —
        // for a rep range that is the bottom, the least the plan asked for,
        // so an untyped set can never be what earns a weight increase.
        if (ed.dataset.amrap === '1') {
          ed.querySelector('.ed-hint').textContent = 'Enter the reps you got — nothing is assumed for this set.';
          return;
        }
        reps.value = ed.dataset.treps;
      }
      // RIR is never filled in: it is a measurement, not a plan. Progression
      // needs the real number, and a made-up one would also silence the
      // "no RIR logged" warning.
    } else if (a === 'clear-set') {
      reps.value = ''; rir.value = '';
    }
    refreshCell(card, i);
    ed.hidden = true; cell.classList.remove('open');
    persistSession();
    if (a === 'log-set') {
      var next = card.querySelector('.setcell:not(.done)');
      // The set that opens next starts from this set's weight — unless you have
      // already typed a weight for it, or it is a main-lift ramp.
      if (next && V3_LOGGING && !card.classList.contains('main')) {
        var ni = next.dataset.i;
        var nextKg = card.querySelector('.in-kg[data-i="' + ni + '"]');
        var thisKg = card.querySelector('.in-kg[data-i="' + i + '"]');
        if (nextKg && thisKg && thisKg.value !== '' && !nextKg.dataset.touched) {
          nextKg.value = thisKg.value;
          refreshCell(card, ni);
        }
      }
      if (next) { setAction(next, 'cell'); }
    }
  }

  function skipPanel(p) {
    return '<div class="swap-panel skip-panel"><div class="hint sm">Why skip it? Any sets you have already logged are kept.</div>' +
      '<input type="text" class="skip-note-in" maxlength="80" placeholder="Note (optional)">' +
      '<div class="skip-reasons">' + SKIP_REASONS.map(function (r) {
        return '<button type="button" class="small" data-action="skip-reason" data-slot="' + esc(p.id) + '" data-reason="' + esc(r) + '">' + esc(r) + '</button>';
      }).join('') + '<button type="button" class="small" data-action="skip-cancel">Cancel</button></div></div>';
  }

  function swapPanel(p) {
    var group = (movementInfo(p.movement) || {}).group;
    // Lifts that take an AMRAP own a training max and a wave, so they are not
    // something an accessory slot can become.
    var mains = E.progressingLifts(programme());
    var options = movementsIn(group).filter(function (m) { return m.name !== p.movement && mains.indexOf(m.name) === -1; });
    return '<div class="swap-panel"><label>Swap for <select class="swap-select">' +
      options.map(function (m) {
        return '<option value="' + esc(m.name) + '">' + esc(m.name) + ' · ' + esc(equipName(m.equip)) + '</option>';
      }).join('') +
      '<option value="__add__">+ Add your own…</option></select></label>' +
      '<div class="swap-add" hidden><input type="text" class="swap-name" placeholder="Exercise name"> ' +
      '<select class="swap-equip"><option value="">Equipment…</option>' +
      P0.equipment.map(function (eq) { return '<option value="' + eq + '">' + esc(equipName(eq)) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="row"><button type="button" class="small primary" data-action="swap-today" data-slot="' + esc(p.id) + '">Just today</button>' +
      '<button type="button" class="small" data-action="swap-forward" data-slot="' + esc(p.id) + '">From now on</button>' +
      '<button type="button" class="small" data-action="swap-cancel">Cancel</button></div>' +
      '<div class="hint sm">The load resets to "your call" — the new exercise brings its own history.</div></div>';
  }

  function fmtBox(n) { return n === null || n === undefined ? '' : n; }

  // Display names for every equipment class, used wherever one is picked or shown.
  var EQUIP_NAMES = {
    barbell: 'Barbell', dumbbell: 'Dumbbell', machine: 'Machine', cable: 'Cable',
    belt: 'Bodyweight + belt', kettlebell: 'Kettlebell', band: 'Band',
    bodyweight: 'Bodyweight', cardio: 'Cardio machine'
  };
  function equipName(id) { return EQUIP_NAMES[id] || id; }

  var EQUIP_LABELS = [
    { id: 'barbell', label: 'Barbell', note: 'Smallest pair of plates — 1.25 kg each side' },
    { id: 'dumbbell', label: 'Dumbbells', note: 'The gap between one dumbbell and the next' },
    { id: 'machine', label: 'Machines', note: 'Selectorised stacks, leg press, hack squat' },
    { id: 'cable', label: 'Cables', note: 'Often the same stack increment as the machines' },
    { id: 'belt', label: 'Bodyweight + belt', note: 'Chin-ups, dips — the plate you hang on' },
    { id: 'kettlebell', label: 'Kettlebells', note: 'The gap between one kettlebell and the next' }
  ];

  // Open loads have no prescribed number, so the box would otherwise start
  // blank every session. Suggest last time's weight for that set instead —
  // it's still just a prefill: a set only logs once reps are entered, so
  // this can't record a set you didn't do. If last time earned a progression
  // bump (see progressAccessories), the suggestion carries that bump forward
  // without rewriting what you actually logged.
  function suggestedKgFor(movement, week, day, i) {
    var prev = lastTime(movement, week, day);
    if (!prev) { return null; }
    var prevSets = prev.entry.sets || [];
    var bump = prev.entry.suggestBump || 0;
    var exact = prevSets[i];
    if (exact && exact.kg !== null && exact.kg !== undefined) { return exact.kg + bump; }
    for (var j = prevSets.length - 1; j >= 0; j--) {
      if (prevSets[j] && prevSets[j].kg !== null && prevSets[j].kg !== undefined) { return prevSets[j].kg + bump; }
    }
    return null;
  }

  function viewToday() {
    if (state.testWeek) { return viewTest(); }
    if (!started()) { return welcomeView(); }
    var week = state.cursor.week, day = state.cursor.day;
    var prescribed = E.prescribeDay(programme(), week, day, ctx());
    var done = state.logs[logKey(week, day)] && state.logs[logKey(week, day)].date;
    var endNote = week < P0.weeks ? ''
      : ONBOARDING
        ? '<div class="card"><p class="hint" style="margin:0">Last week of cycle ' + (state.cycle || 1) + '. When the deload is done, start the next cycle from Setup.</p>' +
          '<div class="row"><button type="button" class="small" data-action="tab" data-tab="setup">Go to Setup</button></div></div>'
        // v2 does not roll over: the next block is its own app, which reads a backup.
        : '<div class="card"><p class="hint" style="margin:0">Last week of this block. When the deload is done, export your data from Setup (Export JSON). ' +
          'The next block is <a href="./trainer3.html">the v3 app</a>, which can read that file and set your starting maxes.</p></div>';
    return sessionHeader(week, day) + endNote +
      prescribed.map(function (p, i) { return renderSlot(p, week, day, i); }).join('') +
      (done ? '<p class="hint">Logged ' + esc(done) + '</p>' : '') +
      '<div class="actionbar">' +
      '<button type="button" data-action="skip-back" aria-label="Previous session">‹ Back</button>' +
      '<button type="button" data-action="save-session">Save</button>' +
      '<button type="button" class="primary" data-action="finish-session">Finish · next ›</button>' +
      '</div>';
  }

  /* ---------------- block editing ---------------- */

  function daysLogged(week) {
    var n = 0;
    for (var d = 0; d < state.programme.days.length; d++) {
      var l = state.logs[logKey(week, d)];
      if (l && l.date) { n++; }
    }
    return n;
  }

  // Shared by the Block browser and the Setup "start here" picker so both
  // list weeks the same way: wave and phase alongside the number, plus how
  // much of the week is already logged.
  function weekOptionsHtml(selectedWeek) {
    var total = state.programme.days.length;
    var opts = '';
    for (var w = 1; w <= P0.weeks; w++) {
      var dl = daysLogged(w);
      var mark = dl === total ? ' ✓' : dl > 0 ? ' · ' + dl + '/' + total : '';
      opts += '<option value="' + w + '"' + (w === selectedWeek ? ' selected' : '') + '>Week ' + w + ' — ' +
        E.waveFor(w, P0.waveSlots) + ' · ' + E.phaseFor(w) + mark + '</option>';
    }
    return opts;
  }

  function viewBlock() {
    var week = state.ui.blockWeek, day = state.ui.blockDay;
    var pr = programme();
    var opts = weekOptionsHtml(week);
    var slots = E.slotsFor(pr, week, day);
    var trackedNames = state.lifts.map(function (l) { return l.name; });
    var progressing = E.progressingLifts(pr);

    var rows = slots.map(function (s) {
      var isMain = s.load.kind === 'wave';
      var pool = isMain ? progressing : movementsIn((movementInfo(s.movement) || {}).group || pr.groups[0]).map(function (m) { return m.name; });
      var groupSel = isMain ? '' :
        '<label>Group <select class="s-group">' + pr.groups.map(function (g) {
          var cur = (movementInfo(s.movement) || {}).group;
          return '<option value="' + g + '"' + (g === cur ? ' selected' : '') + '>' + pretty(g) + '</option>';
        }).join('') + '</select></label>';
      var movSel = '<label>Movement <select class="s-move">' +
        pool.map(function (n) { return '<option value="' + esc(n) + '"' + (n === s.movement ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
        (isMain ? '' : '<option value="__add__">+ Add your own…</option>') + '</select></label>';

      var loadCtl = '';
      if (!isMain) {
        loadCtl = '<label>Load <select class="s-loadkind">' +
          ['pctTM', 'weight', 'bodyweight', 'open'].map(function (k) {
            var lbl = { pctTM: '% of a TM', weight: 'fixed weight', bodyweight: 'bodyweight', open: 'your call' }[k];
            return '<option value="' + k + '"' + (k === s.load.kind ? ' selected' : '') + '>' + lbl + '</option>';
          }).join('') + '</select></label>';
        if (s.load.kind === 'pctTM') {
          loadCtl += '<label>of <select class="s-loadlift">' + trackedNames.map(function (n) {
            return '<option value="' + esc(n) + '"' + (n === (s.load.lift || s.movement) ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('') + '</select></label>' +
            '<label>% <input type="number" step="0.5" class="s-pct" value="' + (Math.round(s.load.pct * 1000) / 10) + '"></label>' +
            '<span class="hint">Rises one step when it earns a progression — the percentage moves, never the training max.</span>';
        } else if (s.load.kind === 'weight') {
          loadCtl += '<label>' + U() + ' <input type="number" step="0.5" class="s-kg" value="' + (s.load.kg === null || s.load.kg === undefined ? '' : s.load.kg) + '"></label>';
        } else if (s.load.kind === 'bodyweight') {
          loadCtl += '<label>+ <input type="number" step="0.5" class="s-added" value="' + (s.load.added || 0) + '"></label>';
        } else if (s.load.kind === 'open') {
          loadCtl += '<span class="hint">No fixed number — you\'ll still enter what you actually lifted on the Today tab, same as every other slot. This just means the plan doesn\'t prescribe one for you.</span>';
        }
        loadCtl += '<label>Sets <input type="number" min="1" step="1" class="s-sets" value="' + s.sets + '"></label>' +
          '<label>Reps <input type="number" min="1" step="1" class="s-reps" value="' + s.reps + '"></label>' +
          '<label>to <input type="number" min="1" step="1" class="s-reps-top" value="' + (E.repTop(s) || '') + '" placeholder="–"></label>' +
          '<label>RIR <input type="number" min="0" step="1" class="s-rir" value="' + (s.rir === undefined ? '' : s.rir) + '"></label>' +
          // The equipment class decides the progression step for this exercise.
          '<label>Equipment <select class="s-equip" data-movement="' + esc(s.movement) + '">' +
          P0.equipment.map(function (eq) {
            var cur = (movementInfo(s.movement) || {}).equip;
            return '<option value="' + eq + '"' + (eq === cur ? ' selected' : '') + '>' + esc(equipName(eq)) + '</option>';
          }).join('') + '</select></label>' +
          '<span class="hint">' + (E.repTop(s)
            ? 'Range: keep the weight and add reps. Once every set reaches ' + E.repTop(s) + ', the weight goes up next session and you drop back to ' + s.reps + '. RIR ' + (s.rir === undefined ? '?' : s.rir) + ' is where to stop, not a test.'
            : 'Fixed reps: the weight goes up when every set hits ' + s.reps + ' with a higher RIR than asked. Fill in "to" for a range.') + '</span>';
      } else {
        loadCtl = '<span class="hint">Sets, reps and percentages come from the ' + E.waveFor(week, P0.waveSlots) + ' wave table.</span>';
      }

      return '<div class="card slotedit" data-slot="' + esc(s.id) + '">' +
        '<div class="row spread"><b><span class="kindtag ' + s.kind + '">' + s.kind + '</span></b></div>' +
        '<div class="row wrap">' + groupSel + movSel + '</div>' +
        '<div class="row wrap">' + loadCtl + '</div></div>';
    }).join('');

    var vol = E.weeklyVolume(pr, week, ctx());
    return '<div class="card weekbar">' +
      '<select id="block-week">' + opts + '</select>' +
      pr.days.map(function (d, i) {
        var dlog = state.logs[logKey(week, i)];
        return '<button type="button" class="daytab' + (i === day ? ' active' : '') + '" data-action="block-day" data-day="' + i + '">' + esc(d.name) + (dlog && dlog.date ? ' ✓' : '') + '</button>';
      }).join('') + '</div>' +
      '<p class="hint">Edits apply to <b>this week only</b> unless you push them to the whole block. The main lift\'s sets and percentages always come from the wave table.</p>' +
      rows +
      '<div class="card"><div class="row">' +
      '<button type="button" class="primary" data-action="save-slots">Save this week</button>' +
      '<button type="button" data-action="push-all">Apply to all ' + P0.weeks + ' weeks</button>' +
      '<button type="button" data-action="jump-here">Train this session</button></div></div>' +
      '<div class="card"><h3>Week ' + week + ' sets by group</h3><p class="hint">' +
      Object.keys(vol).sort().map(function (g) { return pretty(g) + ' ' + vol[g]; }).join(' · ') +
      ' &nbsp;—&nbsp; <b>' + Object.keys(vol).reduce(function (t, g) { return t + vol[g]; }, 0) + ' sets</b></p></div>';
  }

  /* ---------------- setup ---------------- */

  function viewSetup() {
    var s = state.settings;
    // Protein is prescribed per kg of bodyweight; convert when the app is in lb
    // or the maths silently doubles the target.
    var bwKg = s.unit === 'lb' ? s.bodyweight * 0.45359237 : s.bodyweight;
    var protein = [Math.round(bwKg * 2), Math.round(bwKg * 2.2)];
    var atDefault = state.cursor.week === 1 && state.cursor.day === 0 &&
      Object.keys(state.logs).length === 0;
    var startCard = '<section class="card' + (state.migrated && atDefault ? ' highlight' : '') + '">' +
      '<h2>Start / jump to a week</h2>' +
      (state.migrated && atDefault ?
        '<p class="hint">Training maxes and nutrition carried over from the old app. Logs did not — pick the week you\'re actually on before your next session, so the wave table and volume match where you are.</p>' : '') +
      '<p class="hint">Currently set to <b>' + esc(programme().days[state.cursor.day].name) + ', Week ' + state.cursor.week + '</b> ' +
      '(' + E.waveFor(state.cursor.week, P0.waveSlots) + ' · ' + E.phaseFor(state.cursor.week) + ').</p>' +
      '<div class="row wrap">' +
      '<label>Week <select id="start-week">' + weekOptionsHtml(state.cursor.week) + '</select></label>' +
      '<label>Day <select id="start-day">' + programme().days.map(function (d, i) {
        return '<option value="' + i + '"' + (i === state.cursor.day ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('') + '</select></label>' +
      '<button type="button" class="primary" data-action="start-week">Start here</button>' +
      '</div></section>';
    // The start card (v3 only): until the block has started, during a test
    // week, and in the last week of a block.
    var showStart = ONBOARDING && (!started() || !!state.testWeek || state.cursor.week >= P0.weeks);
    return (showStart ? newCycleCard() : '') + (started() ? startCard : '') +
      '<section class="card"><h2>Training maxes</h2>' +
      '<p class="hint">Every lift here can be used as a percentage-based load. Only lifts used as a <b>main</b> lift take an AMRAP and progress automatically — see Progress.</p>' +
      '<table class="table"><thead><tr><th>Lift</th><th>TM (' + U() + ')</th><th>Per-rep increment</th><th></th></tr></thead><tbody>' +
      state.lifts.map(function (l, i) {
        var prog = E.progressingLifts(programme()).indexOf(l.name) !== -1;
        return '<tr><td>' + esc(l.name) + '</td>' +
          '<td><input type="number" step="0.5" min="0" class="in-tm" data-i="' + i + '" value="' + l.tm + '"></td>' +
          '<td><input type="number" step="0.25" min="0" class="in-inc" data-i="' + i + '" value="' + l.inc + '"></td>' +
          '<td class="hint">' + (prog ? 'progresses' : 'load only') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>Block</h2><div class="row wrap">' +
      '<label>Units <select id="in-unit">' + ['kg', 'lb'].map(function (u) {
        return '<option value="' + u + '"' + (u === s.unit ? ' selected' : '') + '>' + u + '</option>';
      }).join('') + '</select></label>' +
      '<label>Round to <input type="number" step="0.25" min="0.25" id="in-round" value="' + s.rounding + '"></label>' +
      '<label>Bodyweight <input type="number" step="0.1" id="in-bw" value="' + s.bodyweight + '"></label>' +
      '</div><p class="hint">Switching units relabels the numbers — nothing is converted. Enter your maxes, steps and bodyweight in the unit you train in.</p>' +
      '<p class="hint">Waves: ' + P0.waveSlots.map(function (w, i) {
        return w + ' (weeks ' + (i * 4 + 1) + '–' + (i * 4 + 4) + ')';
      }).join(' → ') + '</p>' +
      '<h2>Weight jumps</h2>' +
      '<p class="hint">The smallest step each kind of kit allows at <b>your</b> gym. This is what an accessory goes up by when you earn a progression — nothing to do with the rounding above, which is for the main lifts.</p>' +
      '<table class="table"><thead><tr><th>Equipment</th><th>Step (' + U() + ')</th><th></th></tr></thead><tbody>' +
      EQUIP_LABELS.map(function (e) {
        return '<tr><td>' + esc(e.label) + '</td>' +
          '<td><input type="number" step="0.01" min="0.01" class="in-step" data-equip="' + e.id + '" value="' + (s.increments[e.id] === undefined ? '' : s.increments[e.id]) + '"></td>' +
          '<td class="hint">' + esc(e.note) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>Nutrition</h2><div class="row wrap">' +
      '<label>Maintenance (kcal) <input type="number" step="10" id="in-maint" value="' + s.maintenance + '"></label>' +
      '<label>Surplus (kcal) <input type="number" step="10" id="in-surplus" value="' + s.surplus + '"></label>' +
      '</div><table class="table"><tbody>' +
      '<tr><td>Protein</td><td><b>' + protein[0] + ' – ' + protein[1] + ' g/day</b></td><td class="hint">2.0–2.2 g/kg</td></tr>' +
      '<tr><td>Target calories</td><td><b>' + (s.maintenance + s.surplus) + ' kcal</b></td><td class="hint">Re-estimate maintenance every 2–3 weeks from your weight trend</td></tr>' +
      '</tbody></table>' +
      '<button type="button" class="primary" id="save-setup" data-action="save-setup">Save</button></section>' +
      '<section class="card"><h2>Data</h2><div class="row">' +
      '<button type="button" data-action="export">Export JSON</button>' +
      '<button type="button" data-action="import">Import JSON</button>' +
      '<input type="file" id="import-file" accept=".json" hidden>' +
      '<button type="button" data-action="export-csv">Export log (CSV)</button>' +
      '<button type="button" class="danger" data-action="reset">Reset</button></div>' +
      '<p class="hint">Stored in this browser only. ' +
      (state.lastExportAt ? 'Last backup: ' + esc(state.lastExportAt) + '.' : 'Never backed up.') + '</p></section>';
  }

  /* ---------------- progress ---------------- */

  // The realization AMRAP already logged on Today, so Progress can prefill it
  // instead of asking for the same number twice. Looks up the AMRAP by its set
  // index in the prescription — the last *logged* set is not good enough,
  // because a session abandoned before the AMRAP would hand back a ramp single.
  // Does this lift take the Realization AMRAP of this wave? A lift is only the
  // main lift in some waves — in cycle 1, Overhead Press in weeks 1-4 and
  // Bench from week 5 —
  // and a tracker row for a wave where it is only a support lift can never be
  // filled in, because that wave has no AMRAP for it.
  function testedInWave(slot, name) {
    var week = slot * 4 + 3;
    for (var d = 0; d < state.programme.days.length; d++) {
      if (E.slotsFor(programme(), week, d).some(function (x) { return x.load && x.load.kind === 'wave' && x.movement === name; })) { return true; }
    }
    return false;
  }

  function loggedAmrapFor(slot, name) {
    var week = slot * 4 + 3;
    for (var d = 0; d < state.programme.days.length; d++) {
      var log = state.logs[logKey(week, d)];
      if (!log || !log.slots) { continue; }
      var pres = E.prescribeDay(programme(), week, d, ctx()).filter(function (p) { return isWaveSlot(p.slot) && p.movement === name; })[0];
      var entry = pres && log.slots[pres.id];
      if (!entry || entry.movement !== name) { continue; }
      var ai = -1;
      pres.sets.forEach(function (s, i) { if (s.amrap) { ai = i; } });
      var s = ai === -1 ? null : (entry.sets || [])[ai];
      if (s && s.reps !== null && s.reps !== undefined) { return s.reps; }
    }
    return null;
  }

  // A lift used as the main lift anywhere from this week on still gets an
  // AMRAP, and its TM must move only through that.
  function mainFrom(lift, fromWeek) {
    for (var w = fromWeek; w <= P0.weeks; w++) {
      for (var d = 0; d < state.programme.days.length; d++) {
        if (E.slotsFor(programme(), w, d).some(function (x) { return x.load && x.load.kind === 'wave' && x.movement === lift; })) { return true; }
      }
    }
    return false;
  }

  // %TM support slots whose own percentage has been raised by progression,
  // for lifts that will not be tested by an AMRAP again this block (Overhead
  // Press after week 4, Incline Bench always). Folding converts the raised
  // percentage back into a training max, so the next block starts from what
  // was actually lifted rather than a max set weeks earlier.
  function supportFolds() {
    var out = [];
    state.programme.days.forEach(function (day, d) {
      day.slots.forEach(function (base) {
        if (base.kind === 'main' || !base.load || base.load.kind !== 'pctTM') { return; }
        var lift = base.load.lift || base.movement;
        var last = E.slotsFor(programme(), P0.weeks, d).filter(function (x) { return x.id === base.id; })[0];
        if (!last || !last.load || last.load.kind !== 'pctTM' || (last.load.lift || last.movement) !== lift) { return; }
        if (!(last.load.pct > base.load.pct + 1e-9)) { return; }
        if (mainFrom(lift, state.cursor.week)) { return; }
        var L = E.tracked(lift, state.lifts);
        if (!L || !L.tm) { return; }
        out.push({
          day: d, id: base.id, lift: lift, basePct: base.load.pct, nowPct: last.load.pct, tm: L.tm,
          implied: E.mround(L.tm * last.load.pct / base.load.pct, state.settings.rounding)
        });
      });
    });
    return out;
  }

  // Raise the TM and put the slot's percentage back to its base for the
  // remaining weeks, so what gets prescribed stays the same weight.
  function foldSupport(ds) {
    var d = Number(ds.day), basePct = Number(ds.base), lift = ds.lift;
    state.lifts.forEach(function (l) { if (l.name === lift) { l.tm = Number(ds.tm); } });
    var dayName = state.programme.days[d].name;
    for (var w = state.cursor.week; w <= P0.weeks; w++) {
      var sl = E.slotsFor(programme(), w, d).filter(function (x) { return x.id === ds.id; })[0];
      if (sl && sl.load && sl.load.kind === 'pctTM' && (sl.load.lift || sl.movement) === lift && sl.load.pct !== basePct) {
        setOverride(w, dayName, ds.id, { load: { kind: 'pctTM', lift: lift, pct: basePct } });
      }
    }
  }

  /* ---------------- progress overview ---------------- */

  // TM after each wave, from what Apply recorded. trackerBase holds the TM the
  // wave was lifted at; the result is recomputed from it, so it never compounds.
  function waveResultsFor(name) {
    var lift = E.tracked(name, state.lifts);
    var out = [], start = null;
    P0.waveSlots.forEach(function (wave, slot) {
      var k = slot + '|' + name;
      // A wave the lift is never the main lift in has no result to wait for.
      if (!testedInWave(slot, name)) { out.push('na'); return; }
      var base = state.trackerBase[k];
      if (base === undefined) { out.push(null); return; }
      if (start === null) { start = base; }
      var reps = state.tracker[k];
      // Waves applied before the reps were remembered: the log still has them.
      if (reps === undefined) { var lr = loggedAmrapFor(slot, name); if (lr !== null) { reps = lr; } }
      var nt = E.nextTM(base, reps === undefined ? null : reps, E.standardReps(wave), lift.inc);
      out.push(nt === null ? null : nt);
    });
    return { waves: out, start: start === null ? lift.tm : start };
  }

  function isMainIn(name, week) {
    for (var d = 0; d < state.programme.days.length; d++) {
      if (mainSlots(week, d).some(function (m) { return m.movement === name; })) { return true; }
    }
    return false;
  }

  // The next realization week, from where you are, in which this lift is a
  // main lift and its result hasn't been applied yet.
  function nextRealizationFor(name) {
    var lift = E.tracked(name, state.lifts);
    for (var slot = 0; slot < P0.waveSlots.length; slot++) {
      var week = slot * 4 + 3;
      if (week < state.cursor.week || state.trackerBase[slot + '|' + name] !== undefined || !isMainIn(name, week)) { continue; }
      var wave = P0.waveSlots[slot];
      var rows = E.WAVES[wave].Realization;
      var top = rows[rows.length - 1];
      return { slot: slot, week: week, wave: wave, std: E.standardReps(wave), kg: E.mround(lift.tm * top[0], state.settings.rounding) };
    }
    return null;
  }

  function progressOverview() {
    var names = E.progressingLifts(programme()).filter(function (n) { return E.tracked(n, state.lifts); });
    if (!names.length) { return { climb: '', preview: '' }; }
    var u = U(), total = 0;
    var cards = names.map(function (name) {
      var lift = E.tracked(name, state.lifts);
      var r = waveResultsFor(name);
      var delta = Math.round((lift.tm - r.start) * 100) / 100;
      total += delta;
      var vals = r.waves.filter(function (v) { return typeof v === 'number'; }).concat([r.start, lift.tm]);
      var lo = Math.min.apply(null, vals) * 0.97, hi = Math.max.apply(null, vals) * 1.02;
      var hpx = function (v) { return Math.max(6, Math.round((v - lo) / (hi - lo || 1) * 60)) + 'px'; };
      var bars = P0.waveSlots.map(function (wave, i) {
        var v = r.waves[i];
        if (v === 'na') {
          return '<div><div class="bar na"></div><span class="bar-label" title="' + esc(name) + ' is not the main lift in this wave">' + wave + ' · –</span></div>';
        }
        return '<div><div class="bar' + (v === null ? ' future' : '') + '" style="height:' + hpx(v === null ? lift.tm : v) + '"></div>' +
          '<span class="bar-label">' + wave + (v === null ? '' : ' · <b>' + fmt(v) + '</b>') + '</span></div>';
      }).join('');
      var nx = nextRealizationFor(name);
      return '<div class="card">' +
        '<div class="tm-top"><div><div class="tm-name">' + esc(name) + '</div><div class="tm-val">' + fmt(lift.tm) + '<small>' + u + '</small></div></div>' +
        '<span class="pill' + (delta ? ' accent' : '') + '">' + (delta > 0 ? '+' : '') + fmt(delta) + ' ' + u + '</span></div>' +
        '<div class="bars" aria-hidden="true">' + bars + '</div>' +
        '<p class="tm-next">' + (nx ? 'Next AMRAP · week ' + nx.week + ' · ' + fmt(nx.kg) + ' ' + u + ' × ' + nx.std + '+' : 'No AMRAP left for this lift in the block') + '</p>' +
        '</div>';
    }).join('');

    var withNext = names.filter(function (n) { return nextRealizationFor(n); });
    var preview = '';
    if (withNext.length) {
      var sel = withNext.indexOf(state.ui.progLift) !== -1 ? state.ui.progLift : withNext[0];
      var lift = E.tracked(sel, state.lifts);
      var nx = nextRealizationFor(sel);
      var reps = state.ui.progReps === undefined || state.ui.progReps === null ? nx.std : state.ui.progReps;
      var nt = E.nextTM(lift.tm, reps, nx.std, lift.inc);
      var over = reps - nx.std, capped = Math.min(over, E.REP_CAP_OVER_STANDARD);
      var note = over > 0
        ? over + ' over the standard × ' + fmt(lift.inc) + ' = +' + fmt(capped * lift.inc) + ' ' + u + (over > E.REP_CAP_OVER_STANDARD ? ' (capped at ' + E.REP_CAP_OVER_STANDARD + ' reps over)' : '')
        : over === 0 ? 'Hit the standard: TM holds.' : (-over) + ' under the standard: TM drops ' + fmt(-capped * lift.inc) + ' ' + u + '.';
      preview = '<div class="card">' +
        (withNext.length > 1 ? '<div class="seg" role="group" aria-label="Lift">' + withNext.map(function (n) {
          return '<button type="button" class="' + (n === sel ? 'on' : '') + '" data-action="prog-lift" data-lift="' + esc(n) + '">' + esc(n.replace(' Press', '')) + '</button>';
        }).join('') + '</div>' : '') +
        '<div class="sess-kicker" style="margin-top:14px">Week ' + nx.week + ' · ' + nx.wave + ' realization</div>' +
        '<div class="slot-name" style="font-size:28px">What your AMRAP buys</div>' +
        '<p class="slot-meta">' + esc(sel) + ' · ' + fmt(nx.kg) + ' ' + u + ' × ' + nx.std + '+ · standard ' + nx.std + '</p>' +
        '<div class="preview-row"><span>Reps</span><div class="stepper">' +
        '<button type="button" data-action="prog-step" data-d="-1" aria-label="Fewer reps">−</button><span>' + reps + '</span>' +
        '<button type="button" data-action="prog-step" data-d="1" aria-label="More reps">+</button></div></div>' +
        '<div class="tm-flow"><div><div class="k">TM now</div><div class="v">' + fmt(lift.tm) + '</div></div>' +
        icon('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>', 20) +
        '<div style="text-align:right"><div class="k">Next TM</div><div class="v new">' + fmt(nt) + '</div></div></div>' +
        '<p class="hint">' + note + ' A preview only — log the real set on Today and apply it below.</p>' +
        '</div>';
    }

    return {
      climb: '<div class="sess-kicker">Training maxes</div>' +
        '<div class="prog-head">' + (total > 0 ? '+' : '') + fmt(Math.round(total * 100) / 100) + ' ' + u + ' this block</div>' +
        '<p class="hint" style="margin-bottom:22px">Solid bars are applied waves; dashed are waves still to come.</p>' + cards,
      preview: preview
    };
  }

  function viewProgress() {
    var pr = programme();
    var lifts = E.progressingLifts(pr);
    var rows = '';
    P0.waveSlots.forEach(function (wave, slot) {
      var std = E.standardReps(wave);
      lifts.forEach(function (name) {
        var lift = E.tracked(name, state.lifts);
        if (!lift || !testedInWave(slot, name)) { return; }
        var k = slot + '|' + name;
        var reps = state.tracker[k];
        var fromLog = false;
        if (reps === undefined) {
          var lr = loggedAmrapFor(slot, name);
          if (lr !== null) { reps = lr; fromLog = true; }
        }
        // Once applied, the recompute base is the TM the wave was lifted at,
        // not the current TM — otherwise a second Apply compounds.
        var base = state.trackerBase[k] === undefined ? lift.tm : state.trackerBase[k];
        var nt = E.nextTM(base, reps === undefined ? null : reps, std, lift.inc);
        var applied = nt !== null && state.trackerBase[k] !== undefined && lift.tm === nt;
        rows += '<tr><td>Wk ' + (slot * 4 + 1) + '–' + (slot * 4 + 4) + '</td><td>' + wave + '</td><td>' + esc(name) + '</td>' +
          '<td>' + fmt(base) + '</td><td>' + std + '</td>' +
          '<td><input type="number" min="0" step="1" class="tr-reps" data-k="' + esc(k) + '" value="' + (reps === undefined || reps === null ? '' : reps) + '">' +
          (fromLog ? '<div class="hint sm">from your week ' + (slot * 4 + 3) + ' log</div>' : '') + '</td>' +
          '<td>' + fmt(lift.inc) + '</td><td class="new-tm"><b>' + (nt === null ? '–' : fmt(nt)) + '</b></td>' +
          '<td class="apply-cell">' + (applied ? '<span class="hint">applied ✓</span>'
            : (nt === null ? '' : '<button type="button" class="small" data-action="apply-tm" data-lift="' + esc(name) + '" data-tm="' + nt + '" data-k="' + esc(k) + '" data-base="' + base + '" data-reps="' + reps + '">Apply</button>')) + '</td></tr>';
      });
    });

    // Estimated 1RM per main lift, best set per session. Every accumulation and
    // intensification week ends in an AMRAP; this is what those are for.
    // Deloads are submaximal by design and would only put a fake dip in the
    // trend, so they are skipped.
    var oneRm = {};
    Object.keys(state.logs).forEach(function (k) {
      var l = state.logs[k];
      var wk = Number(k.split('|')[0]), dy = Number(k.split('|')[1]);
      if (!l.slots || E.phaseFor(wk) === 'Deload') { return; }
      mainSlots(wk, dy).forEach(function (ms) {
        var entry = l.slots[ms.id];
        if (!entry || !entry.movement) { return; }
        var best = 0;
        (entry.sets || []).forEach(function (s) {
          if (s && s.kg && s.reps) {
            var e = E.estimate1RM(s.kg, s.reps);
            if (e > best) { best = e; }
          }
        });
        if (best) { (oneRm[entry.movement] = oneRm[entry.movement] || []).push({ wk: wk, e: best }); }
      });
    });
    var oneRmHtml = Object.keys(oneRm).sort().map(function (m) {
      var entries = oneRm[m].sort(function (a, b) { return a.wk - b.wk; }).slice(-6);
      var last = entries[entries.length - 1];
      return '<tr><td>' + esc(m) + '</td><td class="hint">' +
        entries.map(function (e) {
          return 'wk' + e.wk + ' ' + (e === last ? '<b>' + fmt(e.e) + '</b>' : fmt(e.e));
        }).join(' → ') + '</td></tr>';
    }).join('');

    // per-movement progression, newest first
    var hist = {};
    Object.keys(state.logs).forEach(function (k) {
      var l = state.logs[k];
      Object.keys(l.slots || {}).forEach(function (id) {
        var s = l.slots[id];
        if (!s || !s.movement) { return; }
        var sets = (s.sets || []).filter(function (x) { return x && x.reps; });
        if (!sets.length) { return; }
        (hist[s.movement] = hist[s.movement] || []).push({ k: k, week: Number(k.split('|')[0]), sets: sets });
      });
    });
    var histHtml = Object.keys(hist).sort().map(function (m) {
      var entries = hist[m].sort(function (a, b) { return b.week - a.week; }).slice(0, 4);
      return '<tr><td>' + esc(m) + '</td><td class="hint">' + entries.map(function (e) {
        return 'wk' + e.week + ': ' + e.sets.map(function (s) { return (s.kg === null || s.kg === undefined ? '?' : s.kg) + '×' + s.reps; }).join(', ');
      }).join(' &nbsp;|&nbsp; ') + '</td></tr>';
    }).join('');

    var full = '<section class="card"><h2>Training max</h2>' +
      '<p class="hint">New TM = old TM + (AMRAP reps − standard) × increment. A lift gets a row only in the waves where it is a main lift and takes a Realization AMRAP. Miss the standard and the TM drops, which is the method working.</p>' +
      '<div class="scroll"><table class="table"><thead><tr><th>Weeks</th><th>Wave</th><th>Lift</th><th>TM</th><th>Std</th><th>AMRAP</th><th>Inc</th><th>New TM</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table></div></section>' +
      (oneRmHtml ? '<section class="card"><h2>Estimated 1RM</h2>' +
        '<p class="hint">Best set per logged main-lift session (deloads excluded). Flat into a new wave means the TM is about right; falling means it is set too high.</p>' +
        '<div class="scroll"><table class="table"><thead><tr><th>Lift</th><th>Trend (' + U() + ')</th></tr></thead><tbody>' +
        oneRmHtml + '</tbody></table></div></section>' : '') +
      (function () {
        var folds = supportFolds();
        if (!folds.length) { return ''; }
        return '<section class="card"><h2>Support lifts</h2>' +
          '<p class="hint">These support slots have progressed past their base percentage, and the lift will not be tested by an AMRAP again this block. ' +
          'Carry it into the training max before the next block — what you lift stays the same, the max just catches up.</p>' +
          '<div class="scroll"><table class="table"><thead><tr><th>Lift</th><th>TM</th><th>Base</th><th>Now</th><th>New TM</th><th></th></tr></thead><tbody>' +
          folds.map(function (f) {
            return '<tr class="fold-row"><td>' + esc(f.lift) + '</td><td>' + fmt(f.tm) + '</td><td>' + fmt(f.basePct * 100) + '%</td>' +
              '<td>' + fmt(f.nowPct * 100) + '%</td><td class="fold-tm"><b>' + fmt(f.implied) + '</b></td>' +
