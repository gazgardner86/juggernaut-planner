              '<td><button type="button" class="small" data-action="fold-support" data-lift="' + esc(f.lift) + '" data-tm="' + f.implied +
              '" data-day="' + f.day + '" data-id="' + esc(f.id) + '" data-base="' + f.basePct + '">Apply</button></td></tr>';
          }).join('') + '</tbody></table></div></section>';
      })() +
      (function () {
        var tally = {};
        Object.keys(state.logs).forEach(function (k) {
          Object.keys(state.logs[k].slots || {}).forEach(function (id) {
            var e = state.logs[k].slots[id];
            if (!e || !e.skipped) { return; }
            var t = tally[e.movement] = tally[e.movement] || { n: 0, why: {} };
            t.n++; t.why[e.skipped.reason] = (t.why[e.skipped.reason] || 0) + 1;
          });
        });
        var names = Object.keys(tally).sort(function (x, y) { return tally[y].n - tally[x].n || (x < y ? -1 : 1); });
        if (!names.length) { return ''; }
        return '<section class="card skip-tally"><h2>Skipped exercises</h2>' +
          '<p class="hint">One skipped for time again and again is a candidate to cut or move earlier in the session. A pain skip that keeps coming back needs looking at, not working around.</p>' +
          '<div class="scroll"><table class="table"><thead><tr><th>Exercise</th><th>Times</th><th>Why</th></tr></thead><tbody>' +
          names.map(function (m) {
            return '<tr><td>' + esc(m) + '</td><td>' + tally[m].n + '</td><td class="hint">' +
              Object.keys(tally[m].why).map(function (r) { return esc(r) + ' ×' + tally[m].why[r]; }).join(', ') + '</td></tr>';
          }).join('') + '</tbody></table></div></section>';
      })() +
      '<section class="card"><h2>Movement history</h2>' +
      (histHtml ? '<div class="scroll"><table class="table"><thead><tr><th>Movement</th><th>Recent sessions</th></tr></thead><tbody>' + histHtml + '</tbody></table></div>'
        : '<p class="hint">Nothing logged yet.</p>') + '</section>';
    var cut = full.indexOf('</section>') + '</section>'.length;
    var ov = progressOverview();
    var view = state.ui.progView === 'amrap' ? 'amrap' : 'climb';
    var switcher = '<div class="seg" role="tablist" aria-label="Progress view" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:22px">' +
      '<button type="button" role="tab" aria-selected="' + (view === 'climb') + '" class="' + (view === 'climb' ? 'on' : '') + '" data-action="prog-view" data-view="climb">Climb</button>' +
      '<button type="button" role="tab" aria-selected="' + (view === 'amrap') + '" class="' + (view === 'amrap' ? 'on' : '') + '" data-action="prog-view" data-view="amrap">AMRAP &amp; ledger</button>' +
      '</div>';
    return view === 'climb' ? switcher + ov.climb + full.slice(cut) : switcher + ov.preview + full.slice(0, cut);
  }

  /* ---------------- library ---------------- */

  // What the Step box says about where a movement's number comes from.
  function incSourceLabel(name) {
    if ((state.movementIncrements || {})[name] > 0) { return 'set by you'; }
    var eq = equipIncrementFor(name);
    return eq === null ? 'no default step (' + equipName((movementInfo(name) || {}).equip) + ')' : 'from ' + ((movementInfo(name) || {}).equip || '');
  }

  function viewLibrary() {
    return '<section class="card"><h2>Exercise library</h2>' +
      '<p class="hint">Every exercise has an <b>equipment</b> type, and a version on different kit is its own exercise — a dumbbell fly and a machine fly step up by different amounts. ' +
      '<b>Step</b> is how much it goes up by when you earn a progression: leave it blank to follow the equipment default from Setup, or type a number to pin this one exercise to a step of its own. ' +
      'Band, bodyweight and cardio have no default step — give one a number here and it will progress.</p></section>' +
      '<section>' + P0.groups.map(function (g) {
        var items = movementsIn(g);
        if (!items.length) { return ''; }
        return '<div class="card"><h3>' + pretty(g) + '</h3>' +
          '<table class="table libtable"><thead><tr><th>Exercise</th><th>Step (' + U() + ')</th><th>Equipment</th></tr></thead><tbody>' +
          items.map(function (m) {
            var mine = (state.customMovements || []).some(function (c) { return c.name === m.name; });
            var own = (state.movementIncrements || {})[m.name];
            var eq = equipIncrementFor(m.name);
            return '<tr><td>' + esc(m.name) + ' ' + videoLink(m.name) + (mine ? ' <span class="tag">YOURS</span>' : '') +
              (m.note ? '<div class="hint sm">' + esc(m.note) + '</div>' : '') + '</td>' +
              '<td class="lib-step"><span class="lib-lbl">Step (' + U() + ')</span><input type="number" step="0.01" min="0.01" class="lib-inc" data-movement="' + esc(m.name) + '"' +
              ' value="' + (own === undefined || own === null ? '' : own) + '"' +
              ' placeholder="' + (eq === null ? '—' : eq) + '">' +
              '<div class="hint sm inc-src">' + esc(incSourceLabel(m.name)) + '</div></td>' +
              '<td class="lib-type"><span class="lib-lbl">Equipment</span><select class="lib-equip" data-movement="' + esc(m.name) + '">' +
              P0.equipment.map(function (eq) {
                return '<option value="' + eq + '"' + (eq === m.equip ? ' selected' : '') + '>' + esc(equipName(eq)) + '</option>';
              }).join('') + '</select><div class="hint sm">' + esc(m.kit) + '</div></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('') + '</section>';
  }

  /* ---------------- reading the DOM ---------------- */

  // A set counts as done when you enter REPS. The weight box is prefilled with
  // the prescription, so recording it on its own would log sets you never did —
  // which then shadows the prescription and pollutes the history.
  function readSession() {
    if (state.testWeek || !started()) { return; }   // the test week logs into cycleResults, not the cycle
    var week = state.cursor.week, day = state.cursor.day;
    var log = logFor(week, day);
    var anything = false;
    document.querySelectorAll('.card.slot').forEach(function (card) {
      // A skipped card has no inputs; its entry (reason, any sets done before
      // the skip) is already in the log and must not be rebuilt as empty.
      if (card.dataset.skipped) { return; }
      var id = card.dataset.slot;
      var sets = [];
      var reps = {}, kgs = {}, rirs = {};
      card.querySelectorAll('.in-reps').forEach(function (el) { reps[Number(el.dataset.i)] = num(el.value); });
      card.querySelectorAll('.in-kg').forEach(function (el) { kgs[Number(el.dataset.i)] = num(el.value); });
      card.querySelectorAll('.in-rir').forEach(function (el) { rirs[Number(el.dataset.i)] = num(el.value); });
      Object.keys(reps).forEach(function (k) {
        var i = Number(k);
        sets[i] = reps[i] === null ? null : { kg: kgs[i], reps: reps[i], rir: rirs[i] === undefined ? null : rirs[i] };
        if (sets[i]) { anything = true; }
      });
      if (sets.some(function (x) { return x; })) {
        // readSession() re-runs on every tab switch away from Today, even
        // after an explicit save — rebuilding the entry from the DOM must not
        // silently drop a progression bump a prior save already earned.
        var prevEntry = log.slots[id] || {};
        log.slots[id] = { movement: card.dataset.movement, sets: sets };
        if (prevEntry.suggestBump !== undefined) { log.slots[id].suggestBump = prevEntry.suggestBump; }
        if (prevEntry.bump) { log.slots[id].bump = prevEntry.bump; }
      } else {
        delete log.slots[id];
      }
    });
    if (anything && !log.date) { log.date = new Date().toISOString().slice(0, 10); }
    // Entries archived by a swap live under other keys and are not on screen,
    // so they must keep the session alive even when nothing else is logged.
    if (!anything && !Object.keys(log.slots).length) { delete state.logs[logKey(week, day)]; }
  }

  /* ---------------- starting the next cycle ---------------- */

  // The template the next cycle starts from, as a programme the engine can read.
  function nextProgramme() {
    var t = P0.nextCycle;
    return { id: P0.id, name: P0.name, weeks: P0.weeks, waveSlots: P0.waveSlots, days: t.days,
      movements: movements(), groups: P0.groups, weekOverrides: t.weekOverrides, phaseRules: P0.phaseRules };
  }

  // Suggested starting TMs. The book chooses a working max as 90% of a 1RM
  // from the last six weeks; the best estimate comes from this cycle's last
  // six logged weeks, sets of 10 reps or fewer only — Epley runs high past
  // that, and a 16-rep bench set is how cycle 1's bench max overshot. The
  // default is the lower of that and the current TM, because a max carried
  // through four waves of the formula tends to drift above 90% of the lift.
  function cycleProposals() {
    var lastWk = maxLoggedWeek();
    return E.progressingLifts(nextProgramme()).map(function (name) {
      var lift = E.tracked(name, state.lifts);
      var tm = lift ? lift.tm : null;
      var best = null;
      Object.keys(state.logs).forEach(function (k) {
        var wk = Number(k.split('|')[0]);
        if (wk <= lastWk - 6) { return; }
        Object.keys(state.logs[k].slots || {}).forEach(function (id) {
          var e = state.logs[k].slots[id];
          if (!e || nameKey(e.movement) !== nameKey(name)) { return; }
          (e.sets || []).forEach(function (x) {
            if (!x || !x.kg || !x.reps || x.reps > 10) { return; }
            var v = E.estimate1RM(x.kg, x.reps);
            if (!best || v > best.e) { best = { e: v, kg: x.kg, reps: x.reps, week: wk }; }
          });
        });
      });
      var fromBest = best ? Math.round(best.e * 0.9 * 2) / 2 : null;
      var start = fromBest === null ? tm : (tm === null ? fromBest : Math.min(tm, fromBest));
      // A result from a test, an upload or typed in is a deliberate heavy set,
      // so it sets the max outright: the book's 90% of a recent 1RM.
      var result = (state.cycleResults || {})[name];
      if (validResult(result)) { start = tmFromResult(result); }
      return { name: name, tm: tm, best: best, fromBest: fromBest, result: result || null, start: start };
    });
  }

  // A single is its own 1RM; Epley would add 3% to it. Past 10 reps the
  // estimate is too loose to set a max from.
  function resultE1RM(kg, reps) { return reps === 1 ? kg : E.estimate1RM(kg, reps); }
  function validResult(r) { return !!(r && r.kg > 0 && r.reps >= 1 && r.reps <= 10); }
  function tmFromResult(r) { return Math.round(resultE1RM(r.kg, r.reps) * 0.9 * 2) / 2; }

  /* ---------------- test week ---------------- */

  // The main lifts of the next cycle, grouped by the day they are trained:
  // Squat + Overhead Press, Bench, Deadlift. One heavy test per lift.
  function testDays() {
    return nextProgramme().days.map(function (d) {
      return d.slots.filter(isWaveSlot).map(function (sl) { return sl.movement; });
    }).filter(function (l) { return l.length; });
  }

  // What to aim at: a triple at ~91% of the best estimate going in (3 reps is
  // ~91% of a 1RM by Epley). A heavy triple estimates the max within a few
  // percent; a true single costs more recovery and risk for little more.
  function testPlan(name) {
    var pp = cycleProposals().filter(function (x) { return x.name === name; })[0] || {};
    var est = validResult(pp.result) && pp.result.source !== 'test week' ? resultE1RM(pp.result.kg, pp.result.reps)
      : pp.best ? pp.best.e : (pp.tm ? pp.tm / 0.9 : null);
    if (!est) { return { est: null, top: null, ramp: [] }; }
    est = Math.round(est * 10) / 10;
    var r = state.settings.rounding;
    var top = E.mround(est * 0.91, r);
    var ramp = [[0.4, 5], [0.6, 3], [0.75, 2], [0.85, 1], [0.93, 1]].map(function (x) { return { kg: E.mround(top * x[0], r), reps: x[1] }; })
      .filter(function (x, i, a) { return x.kg > 0 && x.kg < top && (i === 0 || x.kg !== a[i - 1].kg); });
    return { est: est, top: top, ramp: ramp };
  }

  function testOutText(r) {
    if (!r || !(r.kg > 0) || !(r.reps >= 1)) { return ''; }
    if (r.reps > 10) { return 'Over 10 reps — add weight; that is too many to estimate a max from.'; }
    return 'Estimated 1RM ' + fmt(resultE1RM(r.kg, r.reps)) + ' → starting TM ' + fmt(tmFromResult(r));
  }

  function viewTest() {
    var days = testDays();
    var d = Math.max(0, Math.min(state.testWeek.day || 0, days.length - 1));
    var lifts = days[d];
    var cards = lifts.map(function (name) {
      var plan = testPlan(name);
      var res = (state.cycleResults || {})[name];
      var mine = res && res.source === 'test week' ? res : null;
      return '<div class="card testlift" data-lift="' + esc(name) + '">' +
        '<div class="slot-head"><div><span class="kindtag main">test</span><div class="slot-name">' + esc(name) + '</div>' +
        '<div class="slot-meta">' + (plan.top ? 'Going in: estimated 1RM ' + fmt(plan.est) + ' · aim about ' + fmt(plan.top) + ' × 3' : 'No estimate yet — work up by feel') + '</div></div>' +
        videoLink(name) + '</div>' +
        (plan.ramp.length ? '<div class="warm">Warm-up ' + plan.ramp.map(function (w) { return '<span class="chip">' + fmt(w.kg) + ' × ' + w.reps + '</span>'; }).join('') + '</div>' : '') +
        '<div class="ed-fields tw-fields">' +
        '<div class="ed-field"><span>' + U() + '</span><input type="number" inputmode="decimal" step="0.5" min="0" class="tw-kg" value="' + (mine ? mine.kg : (plan.top || '')) + '"></div>' +
        '<div class="ed-field"><span>Reps</span><input type="number" inputmode="numeric" step="1" min="1" class="tw-reps" placeholder="3" value="' + (mine ? mine.reps : '') + '"></div>' +
        '</div><p class="bump-note tw-out"' + (testOutText(mine) ? '' : ' hidden') + '>' + esc(testOutText(mine)) + '</p></div>';
    }).join('');
    return '<div class="card sess"><div class="sess-kicker">Test week · Day ' + (d + 1) + ' of ' + days.length + '</div>' +
      '<div class="sess-title">' + esc(lifts.join(' + ')) + ' test</div>' +
      '<div class="tags"><span class="pill accent">' + (!started() && !state.imported ? 'Before your block' : 'Before cycle ' + ((state.cycle || 1) + 1)) + '</span></div>' +
      '<p class="phase-note">Work up to a heavy triple. End the set when the next rep would grind or your position changes — that rep is not worth it. 3–5 minutes between the last few sets, and no accessories this week. Log the heaviest set you got; its estimated 1RM sets the starting max at 90%.</p></div>' +
      cards +
      '<div class="actionbar">' +
      (d > 0 ? '<button type="button" data-action="tw-prev">‹ Back</button>' : '<button type="button" data-action="tw-cancel">Cancel test</button>') +
      (d < days.length - 1 ? '<button type="button" class="primary" data-action="tw-next">Next day ›</button>'
        : '<button type="button" class="primary" data-action="tw-done">Done · set maxes ›</button>') +
      '</div>';
  }

  function twInput(card) {
    var name = card.dataset.lift;
    var kg = num(card.querySelector('.tw-kg').value), reps = num(card.querySelector('.tw-reps').value);
    var cur = (state.cycleResults || {})[name];
    if (kg > 0 && reps >= 1) { state.cycleResults[name] = { kg: kg, reps: reps, source: 'test week' }; }
    else if (cur && cur.source === 'test week') { delete state.cycleResults[name]; }
    save();
    var out = card.querySelector('.tw-out'), txt = testOutText(state.cycleResults[name] && state.cycleResults[name].source === 'test week' ? state.cycleResults[name] : null);
    out.textContent = txt; out.hidden = !txt;
  }

  /* ---------------- results from a CSV ---------------- */

  function parseCsvLine(line) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else { q = false; } } else { cur += c; }
      } else if (c === '"') { q = true; } else if (c === ',') { out.push(cur); cur = ''; } else { cur += c; }
    }
    out.push(cur);
    return out;
  }

  // The best set of 10 reps or fewer per main lift from the last six weeks of
  // the newest cycle in an exported log — the app's own CSV, with or without
  // its Cycle and Note columns. null if it isn't that format.
  function bestFromCsv(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
    if (lines.length < 2) { return null; }
    var head = parseCsvLine(lines[0]).map(function (h) { return h.trim().toLowerCase(); });
    var at = function (n) { return head.indexOf(n); };
    var ci = at('cycle'), wi = at('week'), mi = at('movement'), si = at('set'), ri = at('reps');
    var ki = at('kg') === -1 ? at('lb') : at('kg');
    if (wi < 0 || mi < 0 || ri < 0 || ki < 0) { return null; }
    var rows = lines.slice(1).map(parseCsvLine).map(function (c) {
      return { cycle: ci < 0 ? 1 : (Number(c[ci]) || 1), week: Number(c[wi]), m: c[mi], set: si < 0 ? '' : c[si], kg: Number(c[ki]), reps: Number(c[ri]) };
    }).filter(function (r) { return r.set !== 'skipped' && r.kg > 0 && r.reps >= 1; });
    var lastCycle = Math.max.apply(null, rows.map(function (r) { return r.cycle; }).concat([0]));
    rows = rows.filter(function (r) { return r.cycle === lastCycle; });
    var lastWeek = Math.max.apply(null, rows.map(function (r) { return r.week; }).concat([0]));
    var out = {};
    E.progressingLifts(nextProgramme()).forEach(function (name) {
      var best = null;
      rows.forEach(function (r) {
        if (nameKey(r.m) !== nameKey(name) || r.reps > 10 || r.week <= lastWeek - 6) { return; }
        var e = resultE1RM(r.kg, r.reps);
        if (!best || e > best.e) { best = { e: e, kg: r.kg, reps: r.reps, week: r.week }; }
      });
      if (best) { out[name] = best; }
    });
    return out;
  }

  // Typed straight into the Start cycle card: patched in place, not
  // re-rendered, so the box keeps focus.
  function ncResultInput(el) {
    var row = el.closest('.nc-row'), name = row.dataset.lift;
    var kg = num(row.querySelector('.nc-kg').value), reps = num(row.querySelector('.nc-reps').value);
    if (kg > 0 && reps >= 1) { state.cycleResults[name] = { kg: kg, reps: reps, source: 'entered' }; }
    else { delete state.cycleResults[name]; }
    save();
    var pp = cycleProposals().filter(function (x) { return x.name === name; })[0];
    row.querySelector('.nc-tm').value = pp.start === null ? '' : pp.start;
    row.querySelector('.nc-src').textContent = resultSource(pp);
  }

  function resultSource(pp) {
    var r = pp.result;
    if (r && r.reps > 10) { return 'over 10 reps — too many to set a max from'; }
    if (validResult(r)) { return r.source + ' · e1RM ' + fmt(resultE1RM(r.kg, r.reps)); }
    return pp.best ? 'none yet · your log: ' + fmt(pp.best.kg) + ' × ' + pp.best.reps + ', wk ' + pp.best.week + ' → ' + fmt(pp.fromBest) : 'none yet · no recent set';
  }

  // The number a slot carried at the end of the cycle for this movement:
  // the plan (bumps included) or what was actually logged, whichever is
  // higher, so the new cycle starts from what is really being lifted.
  function carriedNumber(movement, kind) {
    var pr = programme(), c = ctx(), plan = null;
    for (var w = P0.weeks; w >= 1 && plan === null; w--) {
      for (var d = 0; d < pr.days.length && plan === null; d++) {
        E.slotsFor(pr, w, d).forEach(function (sl) {
          if (plan !== null || nameKey(sl.movement) !== nameKey(movement) || !sl.load) { return; }
          if (kind === 'bodyweight' && sl.load.kind === 'bodyweight') { plan = sl.load.added || 0; }
          if (kind === 'weight' && (sl.load.kind === 'weight' || sl.load.kind === 'pctTM')) { plan = E.resolveLoad(sl.load, sl.movement, c); }
        });
      }
    }
    if (kind !== 'weight') { return plan; }
    var prev = lastTime(movement, P0.weeks + 1, 0), logged = null;
    if (prev) {
      (prev.entry.sets || []).forEach(function (x) { if (x && x.reps && x.kg && (logged === null || x.kg > logged)) { logged = x.kg; } });
      if (logged !== null) { logged += prev.entry.suggestBump || 0; }
    }
    if (plan === null) { return logged; }
    return logged === null ? plan : Math.max(plan, logged);
  }

  // Close this cycle and start the next from week 1. The finished cycle is
  // archived whole; Last time, prefills and the CSV keep reading it.
  function startNextCycle(startTms) {
    var tpl = JSON.parse(JSON.stringify(P0.nextCycle));
    var oldPr = programme();
    tpl.days.forEach(function (day, d) {
      day.slots.forEach(function (sl, i) {
        if (isWaveSlot(sl)) { return; }
        // An exercise swapped in "from now on" was a standing decision, not a
        // one-week edit: it carries over, with its load kind, in that slot.
        // It counts as a swap only against the OLD block's own template, and
        // only where the new template left that slot alone — a slot the new
        // template changed on purpose keeps the new choice, and a slot id that
        // now means a different exercise must not inherit the old one's swap.
        if (sl.kind === 'accessory' && oldPr.days[d] && oldPr.days[d].name === day.name) {
          var was = E.slotsFor(oldPr, P0.weeks, d).filter(function (x) { return x.id === sl.id; })[0];
          var oldBase = oldPr.days[d].slots.filter(function (x) { return x.id === sl.id; })[0];
          if (was && oldBase && !isWaveSlot(was) && was.movement !== oldBase.movement && sl.movement === oldBase.movement) {
            sl.movement = was.movement;
            sl.load = JSON.parse(JSON.stringify(was.load));
          }
        }
        if (sl.load.kind === 'weight' || sl.load.kind === 'bodyweight') {
          var n = carriedNumber(sl.movement, sl.load.kind);
          if (n !== null && n !== undefined) {
            if (sl.load.kind === 'weight') { sl.load.kg = n; } else { sl.load.added = n; }
          }
        }
        day.slots[i] = sl;
      });
    });
    state.archive = (state.archive || []).concat([{
      cycle: state.cycle || 1, endedAt: new Date().toISOString().slice(0, 10),
      logs: state.logs, programme: state.programme, lifts: JSON.parse(JSON.stringify(state.lifts)),
      tracker: state.tracker, trackerBase: state.trackerBase,
      results: state.cycleResults || {}
    }]);
    state.cycleResults = {}; state.testWeek = null;
    Object.keys(startTms).forEach(function (name) {
      state.lifts.forEach(function (l) { if (l.name === name && startTms[name] > 0) { l.tm = startTms[name]; } });
    });
    state.programme = { days: tpl.days, weekOverrides: tpl.weekOverrides };
    state.logs = {}; state.tracker = {}; state.trackerBase = {};
    state.cursor = { week: 1, day: 0 };
    state.backupThrough = 0; state.backupDismissedThrough = 0;
    state.ui.blockWeek = 1; state.ui.blockDay = 0; state.ui.tab = 'today';
    state.cycle = (state.cycle || 1) + 1;
    state.started = true; state.imported = false;
  }

  // First start with nothing to bring across: apply the starting maxes and go.
  function beginBlock(startTms) {
    Object.keys(startTms).forEach(function (name) {
      state.lifts.forEach(function (l) { if (l.name === name && startTms[name] > 0) { l.tm = startTms[name]; } });
    });
    state.cycleResults = {}; state.testWeek = null;
    state.started = true; state.imported = false;
    state.cursor = { week: 1, day: 0 };
    state.ui.blockWeek = 1; state.ui.blockDay = 0; state.ui.tab = 'today';
  }

  /* ---------------- bringing data across from v2 ---------------- */

  // Is there v2 data in this browser? GitHub Pages serves both apps from one
  // origin, so in a normal browser tab it can be read directly. A home-screen
  // app on iOS keeps its own storage, so the backup file is the reliable route.
  function legacyAvailable() {
    if (!LEGACY_KEY) { return false; }
    try {
      var raw = localStorage.getItem(LEGACY_KEY);
      var p = raw && JSON.parse(raw);
      return !!(p && p.lifts && p.programme);
    } catch (e) { return false; }
  }

  // A v2 backup becomes the v3 state exactly as it stands — its programme, log
  // and lifts — with the start flag off. The start card then runs the same
  // rollover as ever: archive that block whole, set the starting maxes, build
  // the new template with the weights carried across. Nothing here touches the
  // earlier app's own storage.
  function importLegacy(parsed) {
    if (!parsed || !parsed.lifts || !parsed.programme || !parsed.logs) { throw new Error('not a trainer backup'); }
    var s = upgrade(parsed);
    // Exercises the new library dropped must keep working for their history.
    var known = {};
    (s.customMovements || []).concat(P0.movements).forEach(function (m) { known[nameKey(m.name)] = true; });
    var used = {};
    var noteName = function (n) { if (n) { used[nameKey(n)] = n; } };
    var scanLogs = function (logs) {
      Object.keys(logs || {}).forEach(function (k) {
        Object.keys(logs[k].slots || {}).forEach(function (id) { if (logs[k].slots[id]) { noteName(logs[k].slots[id].movement); } });
      });
    };
    scanLogs(s.logs);
    (s.archive || []).forEach(function (a) { scanLogs(a.logs); });
    ((s.programme || {}).days || []).forEach(function (d) { (d.slots || []).forEach(function (sl) { noteName(sl.movement); }); });
    Object.keys((s.programme || {}).weekOverrides || {}).forEach(function (w) {
      Object.keys(s.programme.weekOverrides[w] || {}).forEach(function (dn) {
        var slots = (s.programme.weekOverrides[w][dn] || {}).slots || {};
        Object.keys(slots).forEach(function (id) { noteName(slots[id].movement); });
      });
    });
    (P0.legacyMovements || []).forEach(function (m) {
      if (used[nameKey(m.name)] && !known[nameKey(m.name)]) {
        s.customMovements = (s.customMovements || []).concat([{ name: m.name, group: m.group, kit: m.kit, equip: m.equip, note: m.note }]);
        known[nameKey(m.name)] = true;
      }
    });
    s.app = CFG.app || 'v3';
    s.started = false; s.imported = true;
    s.testWeek = null; s.cycleResults = {};
    s.ui = s.ui || {}; s.ui.tab = 'today';
    return s;
  }

  function welcomeView() {
    return '<div class="card sess"><div class="sess-kicker">Welcome</div>' +
      '<div class="sess-title">Set up your block</div>' +
      '<p class="phase-note">A 16-week block: squat and overhead press on Day 1, bench on Day 2, deadlift on Day 3. ' +
      'Set your training maxes first — the wave tables and every support weight follow from them.</p></div>' + newCycleCard();
  }

  function newCycleCard() {
    var props = cycleProposals();
    var tw = state.testWeek;
    // Nothing to roll over from: a first start, with or without a test week.
    var fresh = !started() && !state.imported;
    var nextN = fresh ? (state.cycle || 1) : (state.cycle || 1) + 1;
    var loggedDays = Object.keys(state.logs || {}).filter(function (k) { return state.logs[k] && state.logs[k].date; }).length;
    var from = '';
    if (!started()) {
      from = state.imported
        ? '<p class="hint"><b>Brought across:</b> your earlier block — ' + loggedDays + ' logged session' + (loggedDays === 1 ? '' : 's') + ', up to week ' + maxLoggedWeek() +
          '. Its log is kept: it stays in Last time, the prefills and the CSV.</p>' +
          '<div class="row"><button type="button" class="small" data-action="discard-import">Discard it and start fresh</button></div>'
        : '<p class="hint">Trained with the v2 app? <b>Bring your data across</b> and the starting maxes, weights and exercise swaps carry over, and your history stays in Last time.</p>' +
          '<div class="row"><button type="button" data-action="upload-legacy">Choose a v2 backup (JSON)</button>' +
          (legacyAvailable() ? '<button type="button" data-action="legacy-browser">Use the v2 data in this browser</button>' : '') +
          '<input type="file" id="legacy-file" accept=".json,application/json" hidden></div>';
    }
    return '<section class="card newcycle"><h2>' + (fresh ? 'Start your block' : 'Start cycle ' + nextN) + '</h2>' +
      '<p class="hint">' + (fresh ? 'This block' : 'Cycle ' + nextN) + ' runs Squat and Overhead Press as main lifts on Day 1, Bench on Day 2 for all 16 weeks, Deadlift on Day 3. ' +
      'Supports are fixed weights that go up when every set reaches the top of its range.' +
      (fresh ? '' : ' Weights carry over from what you are lifting now, and so do exercises you swapped in "from now on".') + '</p>' +
      from +
      '<p class="hint">Starting training max is 90% of a recent 1RM — the book\'s rule. Give each lift a result: run the <b>test week</b>, <b>upload</b> an exported log, or type a heavy set you did recently (10 reps or fewer). ' +
      (fresh ? 'Without one it starts from the maxes shown.' : 'Without one, it suggests the lower of your current TM and 90% of your best set from the last six logged weeks.') +
      ' You can still change any number before you start.</p>' +
      (tw ? '<p class="hint"><b>Test week in progress</b> — day ' + (Math.min(tw.day || 0, testDays().length - 1) + 1) + ' of ' + testDays().length + '.</p>' : '') +
      '<div class="scroll"><table class="table nc-table"><thead><tr><th>Lift</th><th>Result (' + U() + ' × reps)</th><th>Start at</th></tr></thead><tbody>' +
      props.map(function (pp) {
        var r = pp.result;
        return '<tr class="nc-row" data-lift="' + esc(pp.name) + '"><td>' + esc(pp.name) + '<div class="hint sm">' + (fresh ? 'Max' : 'TM') + ' now ' + (pp.tm === null ? '–' : fmt(pp.tm)) + '</div></td>' +
          '<td><div class="nc-res"><input type="number" inputmode="decimal" step="0.5" min="0" class="nc-kg" placeholder="' + U() + '" value="' + (r ? r.kg : '') + '">' +
          '<span>×</span><input type="number" inputmode="numeric" step="1" min="1" class="nc-reps" placeholder="–" value="' + (r ? r.reps : '') + '"></div>' +
          '<div class="hint sm nc-src">' + esc(resultSource(pp)) + '</div></td>' +
          '<td><input type="number" step="0.5" min="0" class="nc-tm" data-lift="' + esc(pp.name) + '" value="' + (pp.start === null ? '' : pp.start) + '"></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row">' + (tw
        ? '<button type="button" data-action="tw-back">Back to the test week</button><button type="button" data-action="tw-cancel">Cancel test week</button>'
        : '<button type="button" data-action="test-week">Run a test week first</button>') +
      '<button type="button" data-action="upload-results">Upload results (CSV)</button>' +
      '<input type="file" id="results-file" accept=".csv,text/csv" hidden></div>' +
      '<div class="row"><button type="button" class="primary" data-action="' + (fresh ? 'begin-block' : 'start-cycle') + '">' + (fresh ? 'Start block' : 'Start cycle ' + nextN) + '</button></div></section>';
  }

  /* ---------------- skipping an exercise ---------------- */

  // Mark one support or accessory slot as skipped for this session, with a
  // reason. Sets already logged stay; the session counts as trained.
  function skipExercise(slotId, reason) {
    var card = document.querySelector('.card.slot[data-slot="' + slotId + '"]');
    if (!card || SKIP_REASONS.indexOf(reason) === -1) { return; }
    var noteEl = card.querySelector('.skip-note-in');
    var note = noteEl ? noteEl.value.trim() : '';
    readSession();
    var week = state.cursor.week, day = state.cursor.day;
    var log = logFor(week, day);
    var entry = log.slots[slotId] || { movement: card.dataset.movement, sets: [] };
    entry.skipped = note ? { reason: reason, note: note } : { reason: reason };
    log.slots[slotId] = entry;
    if (!log.date) { log.date = new Date().toISOString().slice(0, 10); }
    skipOpen = null;
    progressAccessories(week, day);   // takes back any bump this session had earned
    save(); render();
    toast(reason === 'Pain or niggle'
      ? 'Skipped ' + entry.movement + '. If the same thing is still there in two weeks, get it looked at.'
      : 'Skipped ' + entry.movement + ' · ' + reason, reason === 'Pain or niggle' ? 6000 : 0);
  }

  /* ---------------- swapping an exercise on the fly ---------------- */

  // Replace the exercise in one slot, either for this session only or for the
  // rest of the block. Main lifts are not swappable: the wave and the AMRAP
  // that drives the training max belong to the lift, not the slot.
  function applySwap(slotId, scope) {
    var card = document.querySelector('.card.slot[data-slot="' + slotId + '"]');
    var sel = card && card.querySelector('.swap-select');
    if (!sel) { return; }
    var name = sel.value;
    var week = state.cursor.week, day = state.cursor.day;
    var dayName = state.programme.days[day].name;
    var cur = E.prescribeDay(programme(), week, day, ctx()).filter(function (p) { return p.id === slotId; })[0];
    if (!cur || cur.slot.load.kind === 'wave') { return; }
    var oldMovement = cur.movement;
    var foundExisting = false;

    if (name === '__add__') {
      var grp = (movementInfo(oldMovement) || {}).group || P0.groups[0];
      name = canonicalName(card.querySelector('.swap-name').value);
      var eqSel = card.querySelector('.swap-equip').value;
      if (!name) { toast('Type a name for the new exercise'); return; }
      if (movementInfo(name)) { foundExisting = true; }
      else {
        // Every exercise carries an equipment type, so it cannot be created without one.
        if (!eqSel) { toast('Pick its equipment — it sets how the weight steps up'); return; }
        state.customMovements.push({ name: name, group: grp, kit: '', equip: eqSel, note: '' });
      }
    }
    if (name === oldMovement) { swapOpen = null; skipOpen = null; render(); return; }

    // Anything already typed for the old exercise is kept, under its own name.
    readSession();
    var log = state.logs[logKey(week, day)];
    var entry = log && log.slots[slotId];
    if (entry && (entry.sets || []).some(function (x) { return x && x.reps; })) {
      var n = 1;
      while (log.slots[slotId + '~' + n]) { n++; }
      log.slots[slotId + '~' + n] = entry;
      delete log.slots[slotId];
    }

    // The new exercise is a different load, so the old prescription (a fixed
    // 60 kg, or a percentage of a max that has nothing to do with it) is
    // dropped. Its own history supplies the weight from here.
    var patch = { movement: name, load: { kind: 'open' } };
    var changed = 0;
    for (var w = week; w <= P0.weeks; w++) {
      if (scope === 'today' && w !== week) { break; }
      var sl = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === slotId; })[0];
      // "From now on" replaces this exercise, not whatever a later week has
      // deliberately put in the slot.
      if (sl && sl.movement === oldMovement) { setOverride(w, dayName, slotId, JSON.parse(JSON.stringify(patch))); changed++; }
    }
    swapOpen = null; skipOpen = null;
    save(); render();
    toast((foundExisting ? 'Already in the library as ' + name + ' · ' : '') +
      oldMovement + ' → ' + name + (scope === 'today' ? ' for today' : ' for ' + changed + ' week' + (changed === 1 ? '' : 's')));
  }

  function readSlotEdits() {
    var week = state.ui.blockWeek, day = state.ui.blockDay;
    var dayName = state.programme.days[day].name;
    document.querySelectorAll('.card.slotedit').forEach(function (card) {
      var id = card.dataset.slot;
      var patch = {};
      var mv = card.querySelector('.s-move');
      if (mv && mv.value !== '__add__') { patch.movement = mv.value; }
      // Equipment belongs to the movement, not the week — record it against the
      // movement the select was rendered for, not whatever it has since become.
      var eqSel = card.querySelector('.s-equip');
      if (eqSel) {
        var forMovement = eqSel.dataset.movement;
        var base = (P0.movements.concat(state.customMovements || []))
          .filter(function (m) { return m.name === forMovement; })[0];
        if (base && eqSel.value === base.equip) { delete state.equipOverrides[forMovement]; }
        else if (base) { state.equipOverrides[forMovement] = eqSel.value; }
      }
      var kindSel = card.querySelector('.s-loadkind');
      if (kindSel) {
        var kind = kindSel.value;
        var load = { kind: kind };
        if (kind === 'pctTM') {
          load.lift = card.querySelector('.s-loadlift') ? card.querySelector('.s-loadlift').value : patch.movement;
          var pv = num(card.querySelector('.s-pct') ? card.querySelector('.s-pct').value : null);
          load.pct = pv === null ? 0.6 : pv / 100;
        } else if (kind === 'weight') {
          load.kg = num(card.querySelector('.s-kg') ? card.querySelector('.s-kg').value : null);
        } else if (kind === 'bodyweight') {
          load.added = num(card.querySelector('.s-added') ? card.querySelector('.s-added').value : 0) || 0;
        }
        patch.load = load;
        var sv = num(card.querySelector('.s-sets').value); if (sv) { patch.sets = sv; }
        var rv = num(card.querySelector('.s-reps').value); if (rv) { patch.reps = rv; }
        // A blank or non-rising top is stored as null, not left out, so this
        // week really is fixed reps rather than inheriting the template's range.
        var tv = num(card.querySelector('.s-reps-top').value);
        patch.repsTop = tv !== null && tv > (rv || 0) ? tv : null;
        var rir = num(card.querySelector('.s-rir').value); if (rir !== null) { patch.rir = rir; }
      }
      setOverride(week, dayName, id, patch);
    });
  }

  function setOverride(week, dayName, slotId, patch) {
    var ov = state.programme.weekOverrides;
    ov[week] = ov[week] || {};
    ov[week][dayName] = ov[week][dayName] || { slots: {} };
    ov[week][dayName].slots = ov[week][dayName].slots || {};
    var cur = ov[week][dayName].slots[slotId] || {};
    Object.keys(patch).forEach(function (k) { cur[k] = patch[k]; });
    ov[week][dayName].slots[slotId] = cur;
  }

  // Autoregulated accessory progression. Every prescribed set has to be done
  // at or above the prescribed weight, with a RIR logged on it. Then:
  //
  //  - A rep range (10-12) is double progression: the weight stays while the
  //    reps climb, and goes up once every set reaches the TOP of the range at
  //    the target RIR or easier. Reaching the top is itself the "easier than
  //    planned" signal, so the RIR only has to hold, not beat the target —
  //    asking for both would make the weight move slower than the reps earn.
  //    After the bump you drop back to the bottom of the range.
  //  - Fixed reps (the %TM supports, or a range cleared in Block) have no rep
  //    headroom to show it, so every set must hit the reps with a RIR strictly
  //    higher than prescribed — genuinely easier, not just "got through it".
  //
  // Fixed-number loads (weight, bodyweight) get a real plan change: the new
  // number is written forward into every remaining week, same mechanism as
  // "Apply to all weeks" in Block, so it shows up there too. Open loads have
  // no plan number to write — the suggested prefill just carries the bump
  // forward from the log (see suggestedKgFor) without touching what you
  // actually logged.
  //
  // Covers every non-main slot. %TM slots (a support lift at 65% of its own
  // max) progress by raising the slot's own percentage, never the training
  // max: Bench's TM has to move only through its Realization AMRAP, and
  // Overhead Press never gets a second AMRAP after week 4, so a support set
  // is the only signal left for it. The main lift is the one exclusion — it
  // follows the wave table and its TM follows the AMRAP, which is the method.
  //
  // The step comes from the movement's equipment, not one global number — a
  // cable stack and a pair of dumbbells do not jump by the same amount.
  // A support set is not a top set: past this share of the max it stops being
  // volume work behind the main lift and starts competing with it.
  var MAX_SUPPORT_PCT = 0.85;

  // Fixed-rep exercises where reps were logged on some set but RIR was left
  // blank. Fixed reps progress on a beaten RIR, so these silently never move.
  // A rep range progresses on reps alone, so its RIR is optional.
  function missingRir(week, day) {
    var log = state.logs[logKey(week, day)];
    if (!log) { return []; }
    var out = [];
    E.prescribeDay(programme(), week, day, ctx()).forEach(function (p) {
      if (p.slot.load.kind === 'wave' || p.repsTop) { return; }
      var entry = log.slots[p.id];
      if (!entry || !entry.sets || entry.skipped) { return; }
      var gap = entry.sets.some(function (x) { return x && x.reps && (x.rir === null || x.rir === undefined); });
      if (gap) { out.push(p.movement); }
    });
    return out;
  }

  function saveMessage(bumped, noRir, fallback) {
    var parts = [];
    if (bumped.length) { parts.push('Progressed: ' + bumped.join(', ')); }
    if (noRir.length) { parts.push('No RIR on ' + noRir.join(', ') + ' — can\'t progress'); }
    return parts.length ? parts.join(' · ') : fallback;
  }

  // The plan number a fixed load carries, and the load that puts it back.
  function loadValue(load) {
    if (!load) { return null; }
    if (load.kind === 'weight') { return load.kg; }
    if (load.kind === 'bodyweight') { return load.added || 0; }
    if (load.kind === 'pctTM') { return load.pct; }
    return null;
  }
  function loadWith(kind, lift, value) {
    if (kind === 'weight') { return { kind: 'weight', kg: value }; }
    if (kind === 'bodyweight') { return { kind: 'bodyweight', added: value }; }
    return { kind: 'pctTM', lift: lift, pct: value };
  }

  // Write a bump forward into every remaining week that still holds this
  // movement — a week reassigned to another exercise keeps its own number.
  // A percentage only replaces a percentage; a weight also fills in weeks
  // left at "your call", but never overwrites a percentage of a max.
  function writeForward(week, day, p, kind, value) {
    var dayName = state.programme.days[day].name;
    for (var w = week + 1; w <= P0.weeks; w++) {
      var fs = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === p.id; })[0];
      if (!fs || fs.movement !== p.movement || !fs.load) { continue; }
      if (kind === 'pctTM' ? fs.load.kind === 'pctTM' : (fs.load.kind !== 'pctTM' && fs.load.kind !== 'wave')) {
        setOverride(w, dayName, p.id, { load: loadWith(kind, p.slot.load.lift || p.movement, value) });
      }
    }
  }

  // A session re-saved after a correction no longer qualifies: take back the
  // bump it wrote. Only weeks still holding the bumped number are reset, so a
  // later session's own bump, or a number typed in Block since, survives.
  function undoBump(week, day, p, entry) {
    var b = entry.bump;
    delete entry.bump; delete entry.suggestBump;
    if (!b || b.kind === 'open') { return; }
    var dayName = state.programme.days[day].name;
    for (var w = week + 1; w <= P0.weeks; w++) {
      var fs = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === p.id; })[0];
      if (fs && fs.movement === p.movement && fs.load && fs.load.kind === b.kind && loadValue(fs.load) === b.to) {
        setOverride(w, dayName, p.id, { load: loadWith(b.kind, b.lift, b.from) });
      }
    }
  }

  // Whether a logged slot earned its bump. Every prescribed set must be done
  // at or above the target weight. A rep range then asks only that every set
  // reached the top — no RIR: the rep count is measured, a RIR is a guess, and
  // reaching the top of the range is the proof the weight got easier. Fixed
  // reps have no headroom to show that, so they still need every set at the
  // target reps with a RIR strictly higher than prescribed.
  function earnedBump(p, entry, week, day) {
    if (!entry || entry.skipped || !entry.sets || entry.sets.length < p.sets.length) { return false; }
    return p.sets.every(function (s, i) {
      var lg = entry.sets[i];
      if (!lg || lg.reps === null || lg.reps === undefined || lg.reps < (s.top || s.reps)) { return false; }
      if (lg.kg === null || lg.kg === undefined) { return false; }
      var target = s.kg === null || s.kg === undefined ? suggestedKgFor(p.movement, week, day, i) : s.kg;
      // First time on an exercise with no plan number: what you lifted is the baseline.
      if (target !== null && target !== undefined && lg.kg < target) { return false; }
      if (s.top) { return true; }
      if (lg.rir === null || lg.rir === undefined || p.rir === undefined) { return false; }
      return lg.rir > p.rir;
    });
  }

  function progressAccessories(week, day) {
    var log = state.logs[logKey(week, day)];
    if (!log) { return []; }
    // A deload is meant to leave you fresh — light sets reach the top of any
    // range easily, and each bump writes forward into every remaining week.
    if (E.phaseFor(week) === 'Deload') { return []; }
    var prescribed = E.prescribeDay(programme(), week, day, ctx());
    var bumped = [];

    prescribed.forEach(function (p) {
      if (p.slot.kind !== 'accessory' && p.slot.kind !== 'support') { return; }
      var kind = p.slot.load.kind;
      if (kind !== 'weight' && kind !== 'bodyweight' && kind !== 'open' && kind !== 'pctTM') { return; }
      // A support lift eases to 60% in Realization by design, so the load that
      // was lifted is not the slot's own percentage and cannot earn a bump.
      if (kind === 'pctTM' && E.phaseFor(week) === 'Realization') { return; }
      // A fixed weight left blank has no plan number to raise — carry the
      // bump on the log like an open load instead.
      if (kind === 'weight' && (p.slot.load.kg === null || p.slot.load.kg === undefined)) { kind = 'open'; }

      var entry = log.slots[p.id];
      if (!entry) { return; }
      var inc = incrementFor(p.movement);
      if (inc === null || !earnedBump(p, entry, week, day)) {
        if (entry.bump || entry.suggestBump !== undefined) { undoBump(week, day, p, entry); }
        return;
      }
      var reset = p.repsTop ? ', back to ' + p.sets[0].reps + ' reps' : '';

      if (kind === 'pctTM') {
        var basis = E.tracked(p.slot.load.lift || p.movement, state.lifts);
        if (!basis || !basis.tm) { return; }
        // One loadable step above what was prescribed, expressed back as a
        // percentage. The step is never smaller than the rounding, or the bump
        // would round away and the slot would sit still.
        var cur = p.sets[p.sets.length - 1].kg;
        var rounding = state.settings.rounding;
        var stepKg = Math.max(inc, rounding);
        var nextKg = E.mround(cur + stepKg, rounding);
        if (nextKg <= cur) { nextKg = cur + rounding; }
        var nextPct = Math.round(nextKg / basis.tm * 10000) / 10000;
        if (nextPct > MAX_SUPPORT_PCT) { return; }
        writeForward(week, day, p, 'pctTM', nextPct);
        entry.bump = { kind: 'pctTM', lift: p.slot.load.lift || p.movement, from: p.slot.load.pct, to: nextPct, inc: nextKg - cur };
        bumped.push(p.movement + ' → ' + fmt(nextKg) + U() + ' (' + fmt(nextPct * 100) + '% TM)' + reset);
      } else if (kind === 'weight' || kind === 'bodyweight') {
        var base = loadValue(p.slot.load);
        var next = Math.round((base + inc) * 100) / 100;
        writeForward(week, day, p, kind, next);
        entry.bump = { kind: kind, from: base, to: next, inc: inc };
        bumped.push(p.movement + ' → ' + fmt(next) + (kind === 'weight' ? U() : ' added') + reset);
      } else {
        entry.suggestBump = inc;
        entry.bump = { kind: 'open', inc: inc };
        bumped.push(p.movement + ' → +' + fmt(inc) + U() + ' next time' + reset);
      }
    });

    return bumped;
  }

  /* ---------------- actions ---------------- */

  function advance() {
    var days = state.programme.days.length;
    if (state.cursor.day < days - 1) { state.cursor.day++; }
    else if (state.cursor.week < P0.weeks) { state.cursor.week++; state.cursor.day = 0; }
  }
  function retreat() {
    var days = state.programme.days.length;
    if (state.cursor.day > 0) { state.cursor.day--; }
    else if (state.cursor.week > 1) { state.cursor.week--; state.cursor.day = days - 1; }
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportCSV() {
    var rows = [['Cycle', 'Week', 'Day', 'Movement', 'Set', U(), 'Reps', 'Note']];
    var cycles = (state.archive || []).map(function (a) { return { n: a.cycle, logs: a.logs || {}, prog: a.programme || state.programme }; })
      .concat([{ n: state.cycle || 1, logs: state.logs, prog: state.programme }]);
    cycles.forEach(function (c) {
      Object.keys(c.logs).sort(function (a, b) {
        return Number(a.split('|')[0]) - Number(b.split('|')[0]) || Number(a.split('|')[1]) - Number(b.split('|')[1]);
      }).forEach(function (k) {
        var parts = k.split('|'), l = c.logs[k];
        var dayName = (c.prog.days[Number(parts[1])] || { name: 'Day ' + (Number(parts[1]) + 1) }).name;
        Object.keys(l.slots || {}).forEach(function (id) {
          var s = l.slots[id];
          (s.sets || []).forEach(function (x, i) {
            if (!x || x.reps === null || x.reps === undefined) { return; }
            rows.push([c.n, parts[0], dayName, s.movement, i + 1, x.kg, x.reps, '']);
          });
          if (s.skipped) {
            rows.push([c.n, parts[0], dayName, s.movement, 'skipped', '', '',
              s.skipped.reason + (s.skipped.note ? ': ' + s.skipped.note : '')]);
          }
        });
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var v = c === null || c === undefined ? '' : String(c);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\n');
    download(new Blob([csv], { type: 'text/csv' }), 'juggernaut-log.csv');
  }

  document.addEventListener('click', function (e) {

      var psel = pnames.indexOf(state.ui.progLift) !== -1 ? state.ui.progLift : pnames[0];

    } else if (a === 'discard-import') {
      state = defaultState(); save(); render();
    } else if (a === 'start-cycle') {
      var tms = {};
      document.querySelectorAll('.nc-tm').forEach(function (el) { var v = num(el.value); if (v !== null) { tms[el.dataset.lift] = v; } });
      if (!window.confirm('Start cycle ' + ((state.cycle || 1) + 1) + ' at week 1? This cycle\'s log is kept, but you can\'t log into it from here any more.')) { return; }
      startNextCycle(tms); save(); render();
      toast('Cycle ' + state.cycle + ' started — week 1, Day 1');
    } else if (a === 'skip-cancel') {
      skipOpen = null; render();
    } else if (a === 'skip-reason') {
      skipExercise(btn.dataset.slot, btn.dataset.reason);
    } else if (a === 'unskip') {
      var ul = state.logs[logKey(state.cursor.week, state.cursor.day)];
      var ue = ul && ul.slots[btn.dataset.slot];
      if (ue) {
        delete ue.skipped;
        if (!(ue.sets || []).some(function (x) { return x && x.reps; })) { delete ul.slots[btn.dataset.slot]; }
      }
      save(); render();
    } else if (a === 'swap-cancel') {
      swapOpen = null; skipOpen = null; render();
    } else if (a === 'swap-today') {
      applySwap(btn.dataset.slot, 'today');
    } else if (a === 'swap-forward') {
      applySwap(btn.dataset.slot, 'forward');
    } else if (a === 'dismiss-migrate') {
      delete state.migrated; save(); render();
    } else if (a === 'save-session') {
      readSession(); swapOpen = null; skipOpen = null;
      var bumped1 = progressAccessories(state.cursor.week, state.cursor.day);
      var noRir1 = missingRir(state.cursor.week, state.cursor.day);
      save(); render();
      toast(saveMessage(bumped1, noRir1, 'Session saved'), noRir1.length ? 5000 : 0);
    } else if (a === 'finish-session') {
      readSession(); swapOpen = null; skipOpen = null;
      var bumped2 = progressAccessories(state.cursor.week, state.cursor.day);
      var noRir2 = missingRir(state.cursor.week, state.cursor.day);
      save(); advance(); save(); render();
      toast(saveMessage(bumped2, noRir2, 'Next session'), noRir2.length ? 5000 : 0);
    } else if (a === 'skip-back') {
      readSession(); swapOpen = null; skipOpen = null; save(); retreat(); save(); render();
    } else if (a === 'block-day') {
      readSlotEdits(); state.ui.blockDay = Number(btn.dataset.day); save(); render();
    } else if (a === 'save-slots') {
      readSlotEdits(); save(); render(); toast('Week ' + state.ui.blockWeek + ' saved');
    } else if (a === 'push-all') {
      readSlotEdits();
      var week = state.ui.blockWeek, dayName = state.programme.days[state.ui.blockDay].name;
      var src = ((state.programme.weekOverrides[week] || {})[dayName] || {}).slots || {};
      for (var w = 1; w <= P0.weeks; w++) {
        Object.keys(src).forEach(function (id) {
          var patch = JSON.parse(JSON.stringify(src[id]));
          // set counts stay per-week so the phase rules keep their shape
          delete patch.sets;
          setOverride(w, dayName, id, patch);
        });
      }
      save(); render(); toast('Applied to all ' + P0.weeks + ' weeks (set counts kept)');
    } else if (a === 'jump-here') {
      state.cursor = { week: state.ui.blockWeek, day: state.ui.blockDay };
      state.ui.tab = 'today'; save(); render();
    } else if (a === 'start-week') {
      var startWeek = Number(document.getElementById('start-week').value);
      var startDay = Number(document.getElementById('start-day').value);
      state.cursor = { week: startWeek, day: startDay };
      state.ui.blockWeek = startWeek; state.ui.blockDay = startDay;
      state.ui.tab = 'today'; save(); render();
      toast('Starting at ' + programme().days[startDay].name + ', Week ' + startWeek);
    } else if (a === 'save-setup') {
      document.querySelectorAll('.in-tm').forEach(function (el) {
        var v = num(el.value); if (v !== null) { state.lifts[Number(el.dataset.i)].tm = v; }
      });
      document.querySelectorAll('.in-inc').forEach(function (el) {
        var v = num(el.value); if (v !== null) { state.lifts[Number(el.dataset.i)].inc = v; }
      });
      document.querySelectorAll('.in-step').forEach(function (el) {

      });

      var bw = num(document.getElementById('in-bw').value); if (bw !== null) { state.settings.bodyweight = bw; }
      var m = num(document.getElementById('in-maint').value); if (m !== null) { state.settings.maintenance = m; }
      var su = num(document.getElementById('in-surplus').value); if (su !== null) { state.settings.surplus = su; }
      save(); render(); toast('Saved');
    } else if (a === 'apply-tm') {
      var lname = btn.dataset.lift, tm = Number(btn.dataset.tm);
      if (btn.dataset.k !== undefined) {
        state.trackerBase[btn.dataset.k] = Number(btn.dataset.base);
        // Remember the reps the new TM came from. When they were pre-filled from
        // the Today log rather than typed into the tracker, nothing else stored
        // them, and the Climb had no result to draw for a wave that was applied.
        if (btn.dataset.reps !== undefined && btn.dataset.reps !== '') { state.tracker[btn.dataset.k] = Number(btn.dataset.reps); }
      }

      save(); render(); toast(lname + ' TM → ' + fmt(tm));
    } else if (a === 'export') {
      state.backupThrough = maxLoggedWeek();

      save();
      download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }),
        'juggernaut-v2-' + state.lastExportAt + '.json');

      save(); render();
    } else if (a === 'fold-support') {
      foldSupport(btn.dataset);
      save(); render(); toast(btn.dataset.lift + ' TM → ' + fmt(Number(btn.dataset.tm)) + ', support back to ' + fmt(Number(btn.dataset.base) * 100) + '%');
    } else if (a === 'export-csv') {

    }
  });

  function trackerInput(el) {

    var wave = P0.waveSlots[Number(parts[0])];

  }

        var eqAns = (window.prompt('Equipment for ' + name + ': ' + P0.equipment.join(', '), 'machine') || '').trim().toLowerCase();
        if (P0.equipment.indexOf(eqAns) === -1) { toast('Not added — equipment must be one of: ' + P0.equipment.join(', '), 5000); name = ''; }
        else { state.customMovements.push({ name: name, group: grp, kit: '', equip: eqAns, note: '' }); }
      }
      if (name) {
        setOverride(state.ui.blockWeek, state.programme.days[state.ui.blockDay].name, card2.dataset.slot, { movement: name });
      }
      save(); render();
    }
    else if (t.classList.contains('s-move') || t.classList.contains('s-loadkind') ||
      t.classList.contains('s-loadlift') || t.classList.contains('s-equip')) {
      readSlotEdits(); save(); render();
    }
    else if (t.id === 'results-file') {
      var rf = t.files[0];
      if (rf) {
        var rr = new FileReader();
        rr.onload = function () {
          var found = bestFromCsv(rr.result);
          if (!found) { toast('Not a log this app exported — needs Week, Movement, kg and Reps columns', 5000); return; }
          var names = Object.keys(found).filter(function (n) {
            var cur = state.cycleResults[n];
            if (cur && cur.source === 'test week') { return false; }   // a test beats an old log
            state.cycleResults[n] = { kg: found[n].kg, reps: found[n].reps, source: 'CSV, wk ' + found[n].week };
            return true;
          });
          save(); render();
          toast(names.length ? 'Results filled for ' + names.join(', ') : 'No usable sets (10 reps or fewer) for the main lifts', 5000);
        };
        rr.readAsText(rf);
      }
      t.value = '';
    }
    else if (t.id === 'legacy-file') {
      var lf = t.files[0];
      if (lf) {
        var lr = new FileReader();
        lr.onload = function () {
          try {
            state = importLegacy(JSON.parse(lr.result)); save(); render();
            toast('Brought across — check the starting maxes, then start');
          } catch (err) { toast('That is not a trainer backup', 5000); }
        };
        lr.readAsText(lf);
      }
      t.value = '';
    }
    else if (t.id === 'import-file') {
      var f = t.files[0];
      if (f) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            if (!parsed || !parsed.lifts || !parsed.programme) { throw new Error('bad'); }
            // A backup from the earlier app is brought across, not restored:
            // restoring it would replace this block with the old one.
            if (ONBOARDING && parsed.app !== (CFG.app || 'v3')) {
              if (started()) {
                toast('That is a v2 backup — importing it here would replace the block you are running. Export this one first, or use a fresh browser to bring v2 across.', 7000);
                return;
              }
              state = importLegacy(parsed); save(); render();
              toast('That is a v2 backup — brought across; check the starting maxes, then start', 6000);
              return;
            }
            state = upgrade(parsed); save(); render(); toast('Imported');
          } catch (err) { toast('Import failed'); }
        };
        reader.readAsText(f);
      }
      t.value = '';
    }
  });

  render();
})();

</script>

<!-- ============================================================
     Juggernaut Trainer — v4 look + one-tap logging
     Sits on top of the app above: the engine, programme and saved
     data are untouched. Delete from here to the closing </script>

<style id="jg-v4-style">
/* ---- theme: dark, rounded, no registration marks ---- */
:root{
  --bg:#0f1113;--surface:#181b1f;--surface-2:#20242a;--text:#eceef0;--muted:#9aa1aa;--faint:#6b727b;
  --line:#2a2f36;--line-soft:#23272c;
  --accent:#7fa8d1;--accent-strong:#b5d3f2;--accent-deep:#d6ebff;--accent-tint:#14202c;--accent-tint-2:#1e3247;
  --accent-hover:#93b8de;--accent-press:#6b95bf;--on-accent:#0c1622;--danger:#e0806b;--mark:transparent;
  --r-card:20px;--r-ctl:12px;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text)}
header{padding-top:16px;padding-bottom:6px}
header h1{font-size:13px;color:var(--muted)}
footer{font-size:11px;color:var(--faint)}
.card>.corner{display:none}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px;margin:0 0 12px}
.card.highlight{box-shadow:none;border-color:var(--accent)}
button{border-radius:var(--r-ctl);border-color:transparent;background:var(--surface-2);font-weight:500}
button:hover{background:color-mix(in srgb,var(--text) 10%,var(--surface-2))}
button.primary{font-weight:700}
button.danger{background:transparent}
input[type=number],input[type=text],select{border-radius:10px;background:var(--bg);border-color:var(--line)}
.banner{border-radius:14px}
.pill{border-radius:999px;border-color:transparent;background:var(--surface-2)}
.pill.accent{background:var(--accent-tint-2);color:var(--accent-strong);font-weight:600}
.kindtag{border-radius:6px}
.kindtag.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip{border-radius:8px}
.vidlink{border-radius:10px;border-color:transparent;background:var(--surface-2);min-height:40px}
.seg{border-radius:var(--r-ctl);overflow:hidden;border-color:var(--line)}
.seg button{border-radius:0;background:transparent}
.daytab.active{border-color:transparent;background:var(--accent-tint-2);color:var(--accent-strong)}
.table th{border-bottom-color:var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toast{border-radius:12px;background:var(--accent-strong);color:var(--on-accent);font-weight:600}
.bump-note{background:var(--accent-tint-2);color:var(--accent-strong);border-radius:10px}
.lasttime{color:var(--muted)}

/* session header */
.card.sess{background:transparent;border:0;padding:6px 4px 4px}
.sess-title{font-size:34px;margin:4px 0 10px}
.weekticks{gap:2px}
.weekticks i{height:4px;border-radius:2px;background:var(--line)}
.weekticks i.now{height:4px;background:var(--accent-strong)}
.phase-note{font-size:13px;color:var(--muted);margin-top:10px}

/* bottom nav + action bar */
.tabs{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top-color:var(--line-soft)}
.tab{background:transparent;border-radius:0}
.tab.active{color:var(--accent-strong)}
.actionbar{position:static;margin-top:4px;border-radius:18px;border-color:var(--line-soft);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.actionbar button{border-radius:14px}

/* set cells */
.setgrid{gap:6px}
.setcell{border-radius:12px;background:var(--surface-2);border:1px solid transparent;min-height:56px}
.setcell.amrap{border:1.5px dashed var(--accent)}
.setcell.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setcell.done.short{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-strong)}
.setcell.done.short .c-reps{color:var(--accent-strong)}
.setcell.open{outline:2px solid var(--accent-strong);outline-offset:1px}
.set-note{display:none}

/* collapsed exercise rows */
.card.slot{scroll-margin-top:12px}
.card.slot.jg-collapsed{padding:12px 16px}
.card.slot.jg-collapsed>:not(.slot-head){display:none}
.card.slot.jg-collapsed>.editor:not([hidden]){display:block}
.card.slot.jg-collapsed .slot-head{cursor:pointer;align-items:center}
.card.slot.jg-collapsed .slot-name,.card.slot.main.jg-collapsed .slot-name{font-size:19px;margin:4px 0 0}
.card.slot.jg-collapsed .vidlink{display:none}
.card.slot.jg-collapsed .kindtag{display:none}
.card.slot.jg-collapsed.jg-complete{opacity:.6}
.card.slot:not(.jg-collapsed) .slot-head{cursor:pointer}
.slot-head>div:first-child{min-width:0}
.jg-count{margin-left:auto;flex:none;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.jg-complete .jg-count{color:var(--accent-strong);font-weight:600}
.card.slot:not(.jg-collapsed) .jg-count{display:none}

/* next-set panel */
.jg-next{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.jg-next-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.jg-next-v{font-family:var(--font-h);font-weight:600;font-size:52px;line-height:1;margin:4px 0 2px}
.jg-next-v small{font-size:20px;color:var(--muted);font-weight:500}
.jg-next-v .x{color:var(--muted);font-weight:500}
.jg-next-sub{font-size:13px;color:var(--muted);min-height:18px}
.jg-next-sub b{color:var(--text);font-weight:600}
.jg-next-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}
.jg-next-actions button{min-height:56px;font-size:16px;border-radius:16px}
.jg-next-actions .primary{font-size:17px}
.jg-alldone{color:var(--accent-strong);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}

/* set editor as a bottom sheet */
#jg-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29}
body.jg-sheet #jg-backdrop{display:block}
body.jg-sheet{overflow:hidden}
#app .editor:not([hidden]){position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;
  background:var(--surface);border:0;border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:26px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.45);
  animation:jg-up .18s ease-out}
#app .editor::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:5px;background:var(--line)}
@keyframes jg-up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#app .editor:not([hidden]){animation:none}}
.ed-title{font-family:var(--font-h);font-size:22px;text-transform:uppercase}
.ed-hint{color:var(--accent-strong)}
.stepper{border-radius:16px;overflow:hidden;border-color:var(--line);background:var(--bg);grid-template-columns:52px minmax(0,1fr) 52px}
.stepper button{border-radius:0;background:transparent;min-height:60px;font-size:24px}
.stepper input[type=number]{min-height:60px;font-size:30px;border-color:var(--line);background:transparent}
.ed-actions button{min-height:56px;border-radius:16px;font-size:16px}
.jg-hide{display:none!important}
.jg-rir{margin-top:12px}
.jg-rir>span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.jg-rir-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.jg-rir-row button{min-height:48px;font-size:16px;font-weight:600;background:transparent;border:1px solid var(--line)}
.jg-rir-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
</style>

<script id="jg-v4-script">
(function () {
  'use strict';
  var app = document.getElementById('app');
  if (!app) { return; }

  var PLATES = { kg: [25, 20, 15, 10, 5, 2.5, 1.25], lb: [45, 35, 25, 10, 5, 2.5] };
  var BAR = { kg: 20, lb: 45 };
  var CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"></polyline></svg>';

  var manual = {};        // slot id -> true (expanded) / false (collapsed), set by tapping a header
  var dayKey = '';
  var lastActive = null;

  function n(v) { if (v === '' || v === null || v === undefined) { return null; } var x = Number(v); return isFinite(x) ? x : null; }
  function f(x) { return String(Math.round(x * 100) / 100); }

  function unitOf(card) {
    var kg = card.querySelector('.in-kg');
    var field = kg && kg.closest('.ed-field');
    var span = field && field.querySelector('span');
    return span && span.textContent.trim().toLowerCase() === 'lb' ? 'lb' : 'kg';
  }

  // Plates per side for a barbell load, or null when it can't be made exactly.
  function plates(total, unit) {
    var bar = BAR[unit];
    if (total === null || total <= bar) { return null; }
    var side = (total - bar) / 2, out = [];
    PLATES[unit].forEach(function (p) { while (side >= p - 1e-9) { out.push(p); side -= p; } });
    return side > 0.01 ? null : out;
  }

  function closeSheet() {
    var open = app.querySelector('.setcell.open');
    if (open) { open.click(); }      // the app's own toggle closes the editor
  }

  function panelHtml(card) {
    var total = card.querySelectorAll('.setcell').length;
    var next = card.querySelector('.setcell:not(.done)');
    if (!next) { return '<div class="jg-next jg-alldone">' + CHECK + 'All ' + total + ' sets logged</div>'; }
    var i = next.dataset.i;
    var ed = card.querySelector('.editor[data-i="' + i + '"]');
    if (!ed) { return ''; }
    var kg = n(ed.querySelector('.in-kg').value);
    var tReps = ed.dataset.treps, tTop = ed.dataset.ttop, amrap = ed.dataset.amrap === '1';
    var reps = (tTop ? tReps + '–' + tTop : tReps) + (amrap ? '+' : '');
    var target = (ed.querySelector('.ed-target') || {}).textContent || '';
    var pct = (target.match(/[\d.]+% TM/) || [''])[0];
    var unit = unitOf(card);

    var sub = '';
    if (card.classList.contains('main')) {
      var pl = plates(kg, unit);
      if (pl) { sub = 'Each side: <b>' + pl.map(f).join(' + ') + '</b> · bar ' + BAR[unit] + ' ' + unit; }
    }
    if (!sub && tTop && !amrap) { sub = 'Done logs ' + tReps + ' reps — did more? Tap Adjust.'; }
    if (amrap) { sub = 'Enter the reps you got — nothing is assumed for this set.'; }

    var quick = !amrap && kg !== null;
    var doneLabel = quick ? CHECK + ' Done — ' + f(kg) + ' × ' + tReps : (amrap ? 'Log reps' : 'Set weight');
    return '<div class="jg-next" data-i="' + i + '">' +
      '<div class="jg-next-k">Next · set ' + (Number(i) + 1) + ' of ' + total + (pct ? ' · ' + pct : '') + '</div>' +
      '<div class="jg-next-v">' + (kg === null ? '–' : f(kg)) + '<small> ' + unit + '</small> <span class="x">×</span> ' + reps + '</div>' +
      '<div class="jg-next-sub">' + sub + '</div>' +
      '<div class="jg-next-actions">' +
      '<button type="button" class="jg-adjust">Adjust</button>' +
      '<button type="button" class="primary ' + (quick ? 'jg-done' : 'jg-adjust') + '">' + doneLabel + '</button>' +
      '</div></div>';
  }

  function enhanceEditor(card, ed) {
    var title = ed.querySelector('.ed-title');
    if (title && !title.dataset.jg) {
      title.dataset.jg = '1';
      title.textContent = card.dataset.movement + ' · ' + title.textContent;
    }
    // RIR as one-tap chips instead of a stepper (only where the app asks for RIR).
    var rirIn = ed.querySelector('input.in-rir[type="number"]');
    if (rirIn && !ed.querySelector('.jg-rir')) {
      rirIn.closest('.ed-field').classList.add('jg-hide');
      var kgField = ed.querySelector('.in-kg').closest('.ed-field');
      if (kgField) { kgField.classList.remove('wide'); }
      var tr = ed.dataset.trir;
      ed.querySelector('.ed-fields').insertAdjacentHTML('afterend',
        '<div class="jg-rir"><span>Reps in reserve' + (tr !== '' ? ' · target ' + tr : '') + '</span><div class="jg-rir-row">' +
        [0, 1, 2, 3, 4].map(function (v) { return '<button type="button" class="jg-rir-b" data-v="' + v + '">' + (v === 4 ? '4+' : v) + '</button>'; }).join('') +
        '</div></div>');
    }
    if (rirIn) {
      ed.querySelectorAll('.jg-rir-b').forEach(function (b) {
        b.setAttribute('aria-pressed', rirIn.value !== '' && Number(rirIn.value) === Number(b.dataset.v) ? 'true' : 'false');
      });
    }
  }

  function enhance() {
    var kicker = app.querySelector('.sess-kicker');
    var key = kicker ? kicker.textContent : '';
    if (key !== dayKey) { manual = {}; dayKey = key; lastActive = null; }

    var cards = Array.prototype.slice.call(app.querySelectorAll('.card.slot'));
    var active = null;
    cards.forEach(function (c) {
      if (!active && !c.dataset.skipped && c.querySelector('.setcell:not(.done)')) { active = c; }
    });

    var allSets = 0, doneSets = 0;
    cards.forEach(function (c) {
      var id = c.dataset.slot;
      var total = c.querySelectorAll('.setcell').length;
      var done = c.querySelectorAll('.setcell.done').length;
      if (!c.dataset.skipped) { allSets += total; doneSets += done; }
      var complete = !c.dataset.skipped && total > 0 && done === total;
      var open = Object.prototype.hasOwnProperty.call(manual, id) ? manual[id] : c === active;
      c.classList.toggle('jg-collapsed', !open);
      c.classList.toggle('jg-complete', complete);

      var head = c.querySelector('.slot-head');
      var count = head && head.querySelector('.jg-count');
      if (head && !count) {
        count = document.createElement('span');
        count.className = 'jg-count';
        head.insertBefore(count, head.querySelector('.vidlink'));
      }
      if (count) {
        count.innerHTML = c.dataset.skipped ? 'Skipped' : complete ? CHECK + done + '/' + total : done + '/' + total;
      }

      if (!c.dataset.skipped && total) {
        var html = panelHtml(c);
        var old = c.querySelector('.jg-next');
        if (old) { old.outerHTML = html; } else {
          var grid = c.querySelector('.setgrid');
          if (grid) { grid.insertAdjacentHTML('beforebegin', html); }
        }
      }
      c.querySelectorAll('.editor').forEach(function (ed) { enhanceEditor(c, ed); });
    });

    // Sets counter in the session header.
    var tags = app.querySelector('.card.sess .tags');
    if (tags && allSets) {
      var pill = tags.querySelector('.jg-sets');
      if (!pill) { pill = document.createElement('span'); pill.className = 'pill jg-sets'; tags.appendChild(pill); }
      pill.textContent = doneSets + ' / ' + allSets + ' sets';
    }

    // Wide tables scroll inside their card instead of off the screen.
    app.querySelectorAll('table.table').forEach(function (t) {
      if (!t.parentNode.classList.contains('scroll')) {
        var w = document.createElement('div'); w.className = 'scroll';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      }
    });

    document.body.classList.toggle('jg-sheet', !!app.querySelector('.editor:not([hidden])'));

    var activeId = active ? active.dataset.slot : null;
    if (activeId && lastActive && activeId !== lastActive && !document.body.classList.contains('jg-sheet')) {
      active.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    lastActive = activeId;
  }

  function later() { setTimeout(enhance, 0); }

  // One tap: log the next set exactly as prescribed.
  function quickLog(card, i) {
    var cell = card.querySelector('.setcell[data-i="' + i + '"]');
    var ed = card.querySelector('.editor[data-i="' + i + '"]');
    if (!cell || !ed) { return; }
    if (ed.hidden) { cell.click(); }
    var log = ed.querySelector('[data-action="log-set"]');
    if (log) { log.click(); }
    closeSheet();
    enhance();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* ignore */ } }
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    var card = t.closest && t.closest('#app .card.slot');

    if (t.closest('.jg-done')) {
      quickLog(card, t.closest('.jg-next').dataset.i);
      return;
    }
    if (t.closest('.jg-adjust')) {
      var cell = card.querySelector('.setcell[data-i="' + t.closest('.jg-next').dataset.i + '"]');
      if (cell) { cell.click(); }
      later();
      return;
    }
    var chip = t.closest('.jg-rir-b');
    if (chip) {
      var rir = chip.closest('.editor').querySelector('input.in-rir');
      rir.value = rir.value !== '' && Number(rir.value) === Number(chip.dataset.v) ? '' : chip.dataset.v;
      rir.dispatchEvent(new Event('change', { bubbles: true }));
      later();
      return;
    }
    if (t.id === 'jg-backdrop') { closeSheet(); later(); return; }

    var head = t.closest('.slot-head');
    if (head && card && !t.closest('a, button')) {
      var id = card.dataset.slot;
      manual[id] = card.classList.contains('jg-collapsed');
      enhance();
      return;
    }
    var act = t.closest('[data-action]');
    if (act && act.dataset.action === 'log-set') {
      // The app opens the next set straight away; close the sheet instead.
      setTimeout(function () { closeSheet(); enhance(); }, 0);
      return;
    }
    if (act) { later(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('jg-sheet')) { closeSheet(); later(); }
  });

  // Re-apply after every full render of the app.
  new MutationObserver(later).observe(app, { childList: true });

  var bd = document.createElement('div');
  bd.id = 'jg-backdrop';
  document.body.appendChild(bd);

  // Footer: keep the v2 link, drop the paragraph of rules.
  var foot = document.querySelector('footer');
  if (foot && foot.firstChild && foot.firstChild.nodeType === 3) { foot.removeChild(foot.firstChild); }

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) { meta.setAttribute('content', '#0f1113'); }

  enhance();
})();
</script>
