<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juggernaut Trainer</title>
<style>
:root {
  --bg:#f4f6f8; --card:#fff; --text:#16191d; --muted:#5b6472; --line:#dfe3e8;
  --accent:#1f6f4a; --accent-text:#fff; --amap:#fff2e4; --amap-line:#b9481f;
  --danger:#b03a2e; --tag:#b9481f; --last:#1f6f4a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#121417; --card:#1c1f24; --text:#e9ebee; --muted:#98a1ad; --line:#2f353e;
    --accent:#35a06b; --accent-text:#06120c; --amap:#3a2b1a; --amap-line:#d9663f;
    --danger:#d1543f; --tag:#d9663f; --last:#5fc493;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
header,#app,footer{max-width:920px;margin:0 auto;padding:0 12px}
header{padding-top:18px}
header h1{margin:0 0 2px;font-size:1.3rem}
header .sub{margin:0 0 10px;color:var(--muted);font-size:.85rem}
footer{color:var(--muted);font-size:.78rem;padding:18px 12px 40px}
.tabs{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.92rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.daytab{background:var(--card);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.86rem}
.daytab.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px}
.card.sess{border-left:3px solid var(--accent)}
.card.highlight{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
h2{font-size:1.02rem;margin:10px 0 8px}
h3{font-size:.98rem;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.84rem;margin:5px 0}
.hint.sm{font-size:.78rem;margin:2px 0}
.amap-hint{border-left:3px solid var(--amap-line);padding-left:10px}
.kindtag{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700}
.vidlink{display:inline-block;text-decoration:none;color:var(--accent);font-size:.7em;vertical-align:middle;padding:2px 4px}
.kindtag.main{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.kindtag.support{border-color:var(--accent);color:var(--accent)}
.lasttime{font-size:.82rem;color:var(--last);margin:5px 0;padding:5px 8px;background:var(--bg);border-radius:6px}
.warm{font-size:.8rem;color:var(--muted);margin:4px 0;font-style:italic}
.table{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}
.table th,.table td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
.table th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
.sets .setn{color:var(--muted);width:22px}
.sets .pctcol{color:var(--muted);width:52px}
.sets .target{color:var(--muted);white-space:nowrap}
tr.amap td{background:var(--amap)}
.tag{color:var(--tag);font-size:.66rem;font-weight:700;letter-spacing:.05em}
input[type=number],input[type=text],select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:.92rem;font-family:inherit}
input[type=number]{width:74px}
.sets input[type=number]{width:68px}
label{font-size:.83rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
button{font-family:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.small{padding:4px 9px;font-size:.77rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:7px 0}
.row.wrap{gap:9px 13px}
.row.spread{justify-content:space-between}
.weekbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.weekbar select{flex:1;min-width:190px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.79rem;color:var(--muted);white-space:nowrap;margin-left:4px}
.banner{background:var(--amap);border:1px solid var(--amap-line);border-radius:8px;padding:8px 12px;font-size:.84rem;margin-bottom:10px}
.scroll{overflow-x:auto}
.slotedit{border-left:3px solid var(--line)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.88rem;opacity:0;transition:all .25s ease;z-index:10;max-width:90vw;text-align:center}
/* A full session is several screens tall; the save buttons stay in reach instead of waiting at the bottom. */
.savebar{position:sticky;bottom:0;z-index:5;margin-bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.12)}
.savebar .row{flex-wrap:nowrap;gap:8px}
.savebar button{flex:1 1 auto;white-space:nowrap}
.savebar button[data-action="skip-back"]{flex:0 0 auto}
.logged-note{margin:0 4px 8px}
.swap-btn{margin-left:4px;vertical-align:middle;font-weight:600}
/* Library: three table columns do not fit a phone — the name got squeezed to a
   sliver and the selects ran off the edge — so each exercise stacks instead. */
.libtable thead{display:none}
.libtable,.libtable tbody,.libtable tr{display:block}
.libtable tr{padding:8px 0;border-bottom:1px solid var(--line)}
.libtable td{display:block;border:0;padding:2px 0}
.libtable td.lib-step,.libtable td.lib-type{display:inline-block;vertical-align:top;width:calc(50% - 6px);box-sizing:border-box}
.libtable td.lib-step{margin-right:8px}
.libtable input,.libtable select{width:100%;box-sizing:border-box}
.lib-lbl{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.swap-panel{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.swap-panel select{max-width:100%}
.swap-panel .row{margin-top:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juggernaut Trainer">

</head>
<body>
<header>
  <h1>Juggernaut Trainer <span style="font-size:.7em;color:var(--muted);font-weight:400">v2</span></h1>
  <p class="sub">16-week BULK block · 4 waves × 4 weeks · training-max driven</p>
</header>
<div id="app"></div>
<footer>Main lifts run the wave tables off your training max; the Realization AMRAP sets the next one. Everything else is yours to set. Data stays in this browser — export from Setup to back it up.<p style="margin-top:10px"><a href="./index.html" style="color:inherit">v1 bulk block →</a></p></footer>
<script>
/*
 * Juggernaut trainer v2 — engine.
 *
 * One idea instead of three: every prescribed piece of work is a SLOT.
 *   { movement, load, sets, reps, rir }
 *
 * A slot's load is typed, which is what lets a chin-up, a machine row and a
 * barbell squat all live in the same structure:
 *   { kind:'wave' }                      main lift — sets/reps/% from the wave table
 *   { kind:'pctTM', lift, pct }          a percentage of some tracked lift's TM
 *   { kind:'weight', kg }                a plain load
 *   { kind:'bodyweight', added }         bodyweight plus whatever is on the belt
 *   { kind:'open' }                      you decide in the gym
 *
 * Only wave slots take an AMRAP and drive the training max. Everything else is
 * prescription plus logging. The wave tables and the progression formula are
 * the method and are locked by tests/methodology-lock.test.mjs.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.JG2 = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PHASES = ['Accumulation', 'Intensification', 'Realization', 'Deload'];

  // The method. Percentages of the training max, reps, and where the AMRAP sits.
  var WAVES = {
    '10s': {
      Accumulation: [[0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10, 'A']],
      Intensification: [[0.55, 5], [0.625, 5], [0.675, 10], [0.675, 10], [0.675, 10, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 1], [0.75, 10, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '8s': {
      Accumulation: [[0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8, 'A']],
      Intensification: [[0.6, 3], [0.675, 3], [0.725, 8], [0.725, 8], [0.725, 8, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 8, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '5s': {
      Accumulation: [[0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5, 'A']],
      Intensification: [[0.65, 2], [0.725, 2], [0.775, 5], [0.775, 5], [0.775, 5], [0.775, 5, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 5, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '3s': {
      Accumulation: [[0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3, 'A']],
      Intensification: [[0.7, 1], [0.775, 1], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 1], [0.9, 3, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    }
  };

  // Excel MROUND semantics: halves away from zero. Kept so v1 and v2 agree.
  function mround(value, step) {
    if (!step || step <= 0) { return value; }
    var q = Math.abs(value) / step;
    var r = Math.floor(q + 0.5) * step * (value < 0 ? -1 : 1);
    return Math.round(r * 1000) / 1000;
  }

  function phaseFor(week) { return PHASES[(week - 1) % 4]; }
  function waveSlotFor(week) { return Math.floor((week - 1) / 4); }
  function waveFor(week, waveSlots) { return waveSlots[waveSlotFor(week) % waveSlots.length]; }
  function standardReps(wave) { return parseInt(wave, 10); }

  function tracked(name, lifts) {
    for (var i = 0; i < lifts.length; i++) { if (lifts[i].name === name) { return lifts[i]; } }
    return null;
  }

  /* ---------------- load resolution ---------------- */

  // Returns kg, or null when the app can't know it (open loads, missing TM).
  function resolveLoad(load, movement, ctx) {
    if (!load) { return null; }
    var lift;
    switch (load.kind) {
      case 'wave':
        lift = tracked(movement, ctx.lifts);
        return lift ? lift.tm : null;                     // caller applies the %
      case 'pctTM':
        lift = tracked(load.lift || movement, ctx.lifts);
        return lift ? mround(lift.tm * load.pct, ctx.rounding) : null;
      case 'weight':
        return load.kg === null || load.kg === undefined ? null : load.kg;
      case 'bodyweight':
        // Bodyweight is not a plate load — don't round it to the plate step.
        return ctx.bodyweight ? Math.round((ctx.bodyweight + (load.added || 0)) * 10) / 10 : null;
      default:
        return null;                                       // 'open'
    }
  }

  function loadLabel(load, movement, ctx) {
    if (!load) { return ''; }
    if (load.kind === 'pctTM') { return Math.round(load.pct * 1000) / 10 + '% ' + (load.lift || movement); }
    if (load.kind === 'bodyweight') {
      var a = load.added || 0;
      return a ? 'bodyweight + ' + a : 'bodyweight';
    }
    if (load.kind === 'open') { return 'your call'; }
    return '';
  }

  /* ---------------- prescription ---------------- */

  // Volume scaling per phase, applied to everything except the main lift —
  // the wave table already varies the main work.
  function phaseScale(phase, rules) {
    var r = (rules || {})[phase];
    return r && r.scale ? r.scale : 1;
  }

  // Scaling is per phase only. A per-wave bonus was tried and removed: the main
  // lift's rep volume falls across the waves but its SET count rises (15 a week
  // in the 10s, 21 in the 3s), so weekly totals already climb into the 3s wave
  // without help. See the note in CLAUDE.md before adding one back.
  function scaleSets(sets, phase, rules) {
    var s = phaseScale(phase, rules);
    if (s === 1) { return sets; }
    return Math.max(1, Math.ceil(sets * s));
  }

  // Warm-up ramp into the first working set. Realization ramps itself through
  // ascending singles, and a deload opens at 40% which is already a warm-up.
  function warmups(firstKg, phase, ctx) {
    if (phase === 'Realization' || phase === 'Deload' || !firstKg) { return []; }
    return [
      { reps: 5, kg: mround(firstKg * 0.5, ctx.rounding) },
      { reps: 3, kg: mround(firstKg * 0.75, ctx.rounding) }
    ];
  }

  // Expand one slot into the sets you actually perform.
  function prescribe(slot, week, ctx) {
    var phase = phaseFor(week);
    var out = { movement: slot.movement, kind: slot.kind, rir: slot.rir, note: slot.note, sets: [], warmups: [] };

    if (slot.load && slot.load.kind === 'wave') {
      var wave = waveFor(week, ctx.waveSlots);
      var table = (WAVES[wave] || {})[phase] || [];
      var tm = resolveLoad(slot.load, slot.movement, ctx);
      out.wave = wave;
      out.standard = standardReps(wave);
      out.sets = table.map(function (row, i) {
        return {
          n: i + 1,
          pct: row[0],
          reps: row[1],
          amrap: row[2] === 'A',
          kg: tm === null ? null : mround(tm * row[0], ctx.rounding)
        };
      });
      if (out.sets.length) {
        out.warmups = warmups(out.sets[0].kg, phase, { rounding: ctx.rounding });
      }
      return out;
    }

    var n = scaleSets(slot.sets || 1, phase, ctx.phaseRules);
    var kg = resolveLoad(slot.load, slot.movement, ctx);
    var reps = slot.reps;
    // A support lift eases off in the realization week for the same reason the
    // accessories do: that week's AMRAP sets the next training max.
    if (slot.kind === 'support' && phase === 'Realization' && slot.load && slot.load.kind === 'pctTM') {
      kg = resolveLoad({ kind: 'pctTM', lift: slot.load.lift, pct: 0.6 }, slot.movement, ctx);
    }
    for (var i = 0; i < n; i++) {
      out.sets.push({ n: i + 1, reps: reps, kg: kg, amrap: false });
    }
    out.label = loadLabel(slot.load, slot.movement, ctx);
    return out;
  }

  /* ---------------- the day ---------------- */

  function slotsFor(programme, week, dayIndex) {
    var day = programme.days[dayIndex];
    var slots = day.slots.map(function (s) { return JSON.parse(JSON.stringify(s)); });
    var ov = (programme.weekOverrides || {})[week];
    var dayOv = ov && ov[day.name];
    if (dayOv && dayOv.slots) {
      Object.keys(dayOv.slots).forEach(function (id) {
        for (var i = 0; i < slots.length; i++) {
          if (slots[i].id === id) {
            var patch = dayOv.slots[id];
            Object.keys(patch).forEach(function (k) { slots[i][k] = patch[k]; });
          }
        }
      });
    }
    return slots;
  }

  function prescribeDay(programme, week, dayIndex, ctx) {
    var c = {
      lifts: ctx.lifts, rounding: ctx.rounding, bodyweight: ctx.bodyweight,
      waveSlots: ctx.waveSlots || programme.waveSlots, phaseRules: programme.phaseRules
    };
    return slotsFor(programme, week, dayIndex).map(function (s) {
      var p = prescribe(s, week, c);
      p.id = s.id;
      p.slot = s;
      return p;
    });
  }

  /* ---------------- progression ---------------- */

  // "[(Reps Performed - Standard) x Increment per rep] + Working Max = New Working Max",
  // with the book's cap: only 10 reps beyond the standard count. Very high rep
  // sets are common early on and would otherwise inflate the max past what the
  // lift has earned.
  var REP_CAP_OVER_STANDARD = 10;
  function nextTM(oldTM, amrapReps, standard, incPerRep) {
    if (amrapReps === null || amrapReps === undefined || amrapReps === '') { return null; }
    var over = Math.min(amrapReps - standard, REP_CAP_OVER_STANDARD);
    return Math.round((oldTM + over * incPerRep) * 100) / 100;
  }

  function estimate1RM(kg, reps) {
    if (!kg || !reps || reps < 1) { return 0; }
    return Math.round(kg * (1 + reps / 30) * 10) / 10;
  }

  // Which lifts take an AMRAP anywhere in the programme — the TM Tracker's rows.
  function progressingLifts(programme) {
    var seen = [];
    for (var w = 1; w <= programme.weeks; w++) {
      for (var d = 0; d < programme.days.length; d++) {
        slotsFor(programme, w, d).forEach(function (s) {
          if (s.load && s.load.kind === 'wave' && seen.indexOf(s.movement) === -1) { seen.push(s.movement); }
        });
      }
    }
    return seen;
  }

  /* ---------------- volume ---------------- */

  function weeklyVolume(programme, week, ctx) {
    var totals = {};
    for (var d = 0; d < programme.days.length; d++) {
      prescribeDay(programme, week, d, ctx).forEach(function (p) {
        var m = programme.movements.filter(function (x) { return x.name === p.movement; })[0];
        var group = m ? m.group : 'Other';
        totals[group] = (totals[group] || 0) + p.sets.length;
      });
    }
    return totals;
  }

  return {
    PHASES: PHASES, WAVES: WAVES,
    mround: mround, phaseFor: phaseFor, waveFor: waveFor, waveSlotFor: waveSlotFor,
    standardReps: standardReps, tracked: tracked,
    resolveLoad: resolveLoad, loadLabel: loadLabel,
    prescribe: prescribe, prescribeDay: prescribeDay, slotsFor: slotsFor,
    nextTM: nextTM, REP_CAP_OVER_STANDARD: REP_CAP_OVER_STANDARD, estimate1RM: estimate1RM, progressingLifts: progressingLifts,
    weeklyVolume: weeklyVolume, scaleSets: scaleSets
  };
});

</script>
<script>
/*
 * The 16-week BULK block as a programme definition, not a 48-day grid.
 *
 * Three days of slots + phase rules + sparse week overrides. Changing an
 * exercise is one edit here, not sixteen. Everything the coaching work in this
 * repo settled on is encoded below with its reason.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.JG2Programme = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // Every exercise has an equipment type, and an exercise that comes in more
  // than one version is a separate entry per version (DB fly, Pec fly machine,
  // Cable fly) — the equipment decides the smallest load jump, and the versions
  // do not jump by the same amount. The class decides the default step; the
  // actual numbers live in settings.increments so they can match the gym.
  // band, bodyweight and cardio have no weight to add, so they carry no default
  // step; a step typed against the exercise in Library still makes it progress.
  var EQUIP = ['barbell', 'dumbbell', 'machine', 'cable', 'belt', 'kettlebell', 'band', 'bodyweight', 'cardio'];

  // Refuses to build an exercise without a valid type, so a library entry can
  // never quietly go untyped.
  var M = function (name, group, kit, equip, note) {
    if (EQUIP.indexOf(equip) === -1) {
      throw new Error('Movement "' + name + '" needs an equipment type from: ' + EQUIP.join(', '));
    }
    return { name: name, group: group, kit: kit || '', equip: equip, note: note || '' };
  };

  var MOVEMENTS = [
    // Horizontal push
    M('Bench Press', 'Horizontal_Push', 'Barbell + bench', 'barbell'),
    M('Incline Bench', 'Horizontal_Push', 'Barbell + incline bench', 'barbell'),
    M('Close-grip bench press', 'Horizontal_Push', 'Barbell + bench', 'barbell', 'Triceps bias, kinder on the shoulder'),
    M('Cable fly', 'Horizontal_Push', 'Dual adjustable cable', 'cable', 'Loaded stretch the press does not give you'),
    M('DB fly', 'Horizontal_Push', 'Dumbbells + flat bench', 'dumbbell', 'Stretch at the bottom, but no tension at the top — the cable and machine versions keep it'),
    M('Pec fly machine', 'Horizontal_Push', 'Pec deck machine', 'machine', 'Fixed path — same loaded-stretch idea as the cable fly, easier to load hard'),
    M('DB bench press', 'Horizontal_Push', 'Dumbbells + flat bench', 'dumbbell'),
    M('Machine chest press', 'Horizontal_Push', 'Selectorised chest press', 'machine'),
    M('Weighted dip', 'Horizontal_Push', 'Dip station + belt', 'belt'),
    // Vertical push
    M('Overhead Press', 'Vertical_Push', 'Barbell', 'barbell'),
    M('Seated DB shoulder press', 'Vertical_Push', 'Dumbbells + upright bench', 'dumbbell'),
    M('Machine shoulder press', 'Vertical_Push', 'Selectorised shoulder press', 'machine'),
    M('DB lateral raise', 'Vertical_Push', 'Dumbbells', 'dumbbell'),
    M('Machine lateral raise', 'Vertical_Push', 'Lateral raise machine', 'machine'),
    M('Cable lateral raise', 'Vertical_Push', 'Cable stack', 'cable', 'Tension held at the top, unlike a dumbbell'),
    // Horizontal pull
    M('Chest-supported row', 'Horizontal_Pull', 'Chest-supported row machine', 'machine', 'Mid-back without any lower-back cost'),
    M('Seated cable row', 'Horizontal_Pull', 'Cable row station', 'cable'),
    M('Chest-supported DB row', 'Horizontal_Pull', 'Dumbbells + incline bench', 'dumbbell'),
    M('T-bar row', 'Horizontal_Pull', 'T-bar', 'barbell', 'Plate-loaded, so it steps like a barbell, not a machine stack. A landmine setup counts'),
    M('Barbell row', 'Horizontal_Pull', 'Barbell', 'barbell', 'Spinally loaded — costs erector recovery'),
    M('Machine row', 'Horizontal_Pull', 'Selectorised row', 'machine'),
    M('Cable face pull', 'Horizontal_Pull', 'Cable + rope', 'cable', 'Rear delt and external rotation against your pressing volume'),
    M('DB rear delt fly', 'Horizontal_Pull', 'Dumbbells + incline bench', 'dumbbell'),

  var pressWave = {};
  [1, 2, 3, 4].forEach(function (w) {
    pressWave[w] = {
      'Day 1': { slots: { support: { movement: 'Incline Bench', load: pct('Incline Bench', 0.65) } } },
      'Day 2': { slots: { main: { movement: 'Overhead Press' } } },
      'Day 3': { slots: { support: { movement: 'Bench Press', load: pct('Bench Press', 0.65) } } }

  return {
    id: 'bulk-12wk-v2',

    // The full method: four waves of four weeks. The workbook stopped at three

    weeks: 16,
    waveSlots: ['10s', '8s', '5s', '3s'],
    days: DAYS,
    movements: MOVEMENTS,
    groups: GROUPS,
    equipment: EQUIP,
    weekOverrides: pressWave,

    // already varies. Realization is the week whose AMRAP sets the next TM.

      // (3 sets at 40-60%, down in both volume and intensity). Cable/machine

      Deload: { scale: 1 / 2 }

      increments: {

        machine: 1.13,

        belt: 1.25,
        kettlebell: 4

      bodyweight: 80,
      maintenance: 2500,
      surplus: 300
    }
  };
});
