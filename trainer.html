<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juggernaut Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap');
:root{
  --bg:#f2f2f3;--text:#1d1f20;--muted:#5d5d60;--faint:#98989b;
  --line:color-mix(in srgb,#1d1f20 16%,transparent);--line-soft:color-mix(in srgb,#1d1f20 8%,transparent);
  --accent:#5980a6;--accent-strong:#416180;--accent-deep:#1d2d3d;--accent-tint:#eef6ff;--accent-tint-2:#d6ebff;
  --accent-hover:#597ea3;--accent-press:#416180;--on-accent:#f2f2f3;--danger:#a3412f;
  --mark:color-mix(in srgb,#1d1f20 55%,transparent);
  --font-h:"Barlow Condensed",system-ui,sans-serif;--font-b:"Barlow",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#18191b;--text:#ececee;--muted:#a6a6aa;--faint:#7a7a7d;
  --line:color-mix(in srgb,#ececee 18%,transparent);--line-soft:color-mix(in srgb,#ececee 9%,transparent);
  --accent:#749dc4;--accent-strong:#94bce3;--accent-deep:#d6ebff;--accent-tint:#1d2d3d;--accent-tint-2:#2c455d;
  --accent-hover:#94bce3;--accent-press:#b5d9fd;--on-accent:#101418;--danger:#e0806b;
  --mark:color-mix(in srgb,#ececee 50%,transparent);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-b);font-size:15px;background:var(--bg);color:var(--text);line-height:1.45}
::selection{background:var(--accent-tint-2)}
a{color:var(--accent-strong)}a:hover{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header,#app,footer{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:20px;padding-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--font-h);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
header .sub{margin:0;color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;padding:8px 16px calc(var(--nav-h) + 120px)}
h2,h3{font-family:var(--font-h);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:20px;margin:4px 0 10px}
h3{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* buttons + fields */
button{font-family:inherit;font-size:14px;padding:9px 14px;min-height:40px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);cursor:pointer}
button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
button:active{background:color-mix(in srgb,var(--text) 14%,transparent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{background:var(--accent-hover)}button.primary:active{background:var(--accent-press)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:12px;min-height:32px}
input[type=number],input[type=text],select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:0;padding:7px 9px;min-height:40px;font-size:15px;font-family:inherit}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:color-mix(in srgb,var(--text) 45%,transparent)}
input:focus-visible,select:focus-visible{border-color:var(--accent);outline-offset:0}
select option{background:var(--bg);color:var(--text)}
input[type=number]{width:84px}
label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
/* cards: hairline frames with registration marks */
.card{position:relative;border:1px solid var(--line);padding:16px;margin:0 0 22px;background:transparent}
.card>.corner{position:absolute;width:11px;height:11px;color:var(--mark);pointer-events:none}
.card>.corner::before,.card>.corner::after{content:"";position:absolute;background:currentColor}
.card>.corner::before{left:5px;top:0;width:1px;height:100%}
.card>.corner::after{top:5px;left:0;width:100%;height:1px}
.corner.tl{top:-6px;left:-6px}.corner.tr{top:-6px;right:-6px}.corner.bl{bottom:-6px;left:-6px}.corner.br{bottom:-6px;right:-6px}
.card.highlight{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.hint.sm{font-size:12px;margin:2px 0}
.amap-hint{border-left:2px solid var(--accent);padding-left:10px}
.kindtag{display:inline-flex;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-family:var(--font-b)}
.kindtag.main{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.kindtag.support{border-color:var(--accent);color:var(--accent-strong)}
.tag{color:var(--accent-strong);font-size:11px;font-weight:600;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.table th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom-color:var(--line)}
.table tbody tr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
tr.amap td{background:var(--accent-tint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row.wrap{gap:10px 14px}.row.spread{justify-content:space-between}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{flex:1;min-width:190px}
.daytab{font-size:14px}
.daytab.active{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.banner{border:1px solid var(--accent);background:var(--accent-tint);color:var(--accent-deep);padding:10px 12px;font-size:13px;margin:0 0 18px}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-deep);color:var(--bg);padding:10px 18px;font-size:14px;opacity:0;transition:all .25s ease;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px;border:0;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.04em}
.tab:hover{background:transparent;color:var(--text)}
.tab.active{color:var(--accent-strong);font-weight:600}
/* today */
.sess-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sess-title{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.weekticks{display:grid;gap:3px;margin:14px 0 0;align-items:center}
.weekticks i{height:3px;background:var(--line)}
.weekticks i.past{background:var(--accent)}
.weekticks i.now{background:var(--accent-strong);height:6px}
.phase-note{margin:12px 0 0;font-size:14px}
.slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.slot-name{font-family:var(--font-h);font-weight:600;font-size:23px;line-height:1.05;text-transform:uppercase;margin:8px 0 2px}
.slot.main .slot-name{font-size:40px;line-height:.95}
.slot-meta{font-size:13px;color:var(--muted)}
.vidlink{display:inline-flex;align-items:center;gap:5px;flex:none;min-height:36px;padding:0 10px;border:1px solid var(--line);color:var(--accent-strong);text-decoration:none;font-size:13px;vertical-align:middle}
.vidlink:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.table .vidlink{min-height:24px;padding:0 6px;font-size:11px}
details.info{margin-top:8px;font-size:13px;color:var(--muted)}
details.info summary{cursor:pointer;color:var(--accent-strong);font-size:12px;letter-spacing:.04em}
details.info div{margin-top:4px}
.lasttime{font-size:13px;color:var(--accent-strong);margin:10px 0 0}
.warm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-strong);border:1px solid var(--accent);padding:2px 8px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:14px}
.setcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:6px 2px}
.setcell .c-kg{font-family:var(--font-h);font-weight:600;font-size:21px;line-height:1.1}
.setcell .c-reps{font-size:12px;color:var(--muted)}
.setcell.amrap{border-style:dashed;border-color:var(--accent)}
.setcell.done{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.setcell.done:hover{background:var(--accent-hover)}
.setcell.done .c-reps{color:var(--on-accent)}
.setcell.done.short{background:var(--accent-tint-2);color:var(--accent-deep)}
.setcell.done.short .c-reps{color:var(--accent-deep)}
.setcell.open{outline:2px solid var(--accent-strong);outline-offset:1px}
.set-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.editor{margin-top:12px;padding:12px;border:1px solid var(--accent);background:var(--accent-tint)}
.editor[hidden]{display:none}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ed-title{font-weight:600;font-size:14px}
.ed-target{font-size:12px;color:var(--muted)}
.ed-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed-field.wide{grid-column:1 / -1}
.ed-field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);background:var(--bg)}
.stepper button{border:0;padding:0;min-height:46px;font-size:20px;line-height:1}
.stepper input[type=number]{width:100%;min-height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;font-family:var(--font-h);font-weight:600;font-size:22px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ed-hint{font-size:12px;color:var(--accent-deep);min-height:16px;margin:10px 0}
.ed-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.ed-actions button{min-height:46px}
.prog-head{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 4px}
.tm-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tm-name{font-size:13px;color:var(--muted)}
.tm-val{font-family:var(--font-h);font-weight:600;font-size:36px;line-height:1}
.tm-val small{font-family:var(--font-b);font-weight:400;font-size:13px;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;height:84px;margin-top:14px}
.bars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.bar{background:var(--accent);border:1px solid var(--accent)}
.bar.future{background:transparent;border-style:dashed}
.bar-label{font-size:11px;color:var(--muted);text-align:center}
.bar-label b{color:var(--text);font-weight:600}
.tm-next{font-size:12px;color:var(--muted);margin:10px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line)}
.seg button{border:0;border-left:1px solid var(--line);min-height:44px;font-size:13px;padding:4px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.preview-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.preview-row .stepper{width:170px}
.preview-row .stepper span{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--font-h);font-weight:600;font-size:24px}
.tm-flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tm-flow .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tm-flow .v{font-family:var(--font-h);font-weight:600;font-size:30px;line-height:1.1}
.tm-flow .v.new{color:var(--accent-strong)}
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:4;display:grid;grid-template-columns:auto 1fr 1.7fr;gap:8px;padding:10px;margin:0 0 16px;background:var(--bg);border:1px solid var(--line)}
.actionbar button{min-height:48px}
</style>

<meta name="theme-color" content="#5980a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<header>
  <h1>Juggernaut Trainer</h1>
  <p class="sub">16-week bulk block · v2</p>
</header>
<div id="app"></div>
<footer>Main lifts run the wave tables off your training max; the Realization AMRAP sets the next one. Everything else is yours to set. Data stays in this browser — export from Setup to back it up.<p style="margin-top:10px"><a href="./index.html" style="color:inherit">v1 bulk block →</a></p></footer>
<script>
/*
 * Juggernaut trainer v2 — engine.
 *
 * One idea instead of three: every prescribed piece of work is a SLOT.
 *   { movement, load, sets, reps, rir }
 *
 * A slot's load is typed, which is what lets a chin-up, a machine row and a
 * barbell squat all live in the same structure:
 *   { kind:'wave' }                      main lift — sets/reps/% from the wave table
 *   { kind:'pctTM', lift, pct }          a percentage of some tracked lift's TM
 *   { kind:'weight', kg }                a plain load
 *   { kind:'bodyweight', added }         bodyweight plus whatever is on the belt
 *   { kind:'open' }                      you decide in the gym
 *
 * Only wave slots take an AMRAP and drive the training max. Everything else is
 * prescription plus logging. The wave tables and the progression formula are
 * the method and are locked by tests/methodology-lock.test.mjs.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.JG2 = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PHASES = ['Accumulation', 'Intensification', 'Realization', 'Deload'];

  // The method. Percentages of the training max, reps, and where the AMRAP sits.
  var WAVES = {
    '10s': {
      Accumulation: [[0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10, 'A']],
      Intensification: [[0.55, 5], [0.625, 5], [0.675, 10], [0.675, 10], [0.675, 10, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 1], [0.75, 10, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '8s': {
      Accumulation: [[0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8, 'A']],
      Intensification: [[0.6, 3], [0.675, 3], [0.725, 8], [0.725, 8], [0.725, 8, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 8, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '5s': {
      Accumulation: [[0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5, 'A']],
      Intensification: [[0.65, 2], [0.725, 2], [0.775, 5], [0.775, 5], [0.775, 5], [0.775, 5, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 5, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '3s': {
      Accumulation: [[0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3, 'A']],
      Intensification: [[0.7, 1], [0.775, 1], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 1], [0.9, 3, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    }
  };

  // Excel MROUND semantics: halves away from zero. Kept so v1 and v2 agree.
  function mround(value, step) {
    if (!step || step <= 0) { return value; }
    var q = Math.abs(value) / step;
    var r = Math.floor(q + 0.5) * step * (value < 0 ? -1 : 1);
    return Math.round(r * 1000) / 1000;
  }

  function phaseFor(week) { return PHASES[(week - 1) % 4]; }
  function waveSlotFor(week) { return Math.floor((week - 1) / 4); }
  function waveFor(week, waveSlots) { return waveSlots[waveSlotFor(week) % waveSlots.length]; }
  function standardReps(wave) { return parseInt(wave, 10); }

  function tracked(name, lifts) {
    for (var i = 0; i < lifts.length; i++) { if (lifts[i].name === name) { return lifts[i]; } }
    return null;
  }

  /* ---------------- load resolution ---------------- */

  // Returns kg, or null when the app can't know it (open loads, missing TM).
  function resolveLoad(load, movement, ctx) {
    if (!load) { return null; }
    var lift;
    switch (load.kind) {
      case 'wave':
        lift = tracked(movement, ctx.lifts);
        return lift ? lift.tm : null;                     // caller applies the %
      case 'pctTM':
        lift = tracked(load.lift || movement, ctx.lifts);
        return lift ? mround(lift.tm * load.pct, ctx.rounding) : null;
      case 'weight':
        return load.kg === null || load.kg === undefined ? null : load.kg;
      case 'bodyweight':
        // Bodyweight is not a plate load — don't round it to the plate step.
        return ctx.bodyweight ? Math.round((ctx.bodyweight + (load.added || 0)) * 10) / 10 : null;
      default:
        return null;                                       // 'open'
    }
  }

  function loadLabel(load, movement, ctx) {
    if (!load) { return ''; }
    if (load.kind === 'pctTM') { return Math.round(load.pct * 1000) / 10 + '% ' + (load.lift || movement); }
    if (load.kind === 'bodyweight') {
      var a = load.added || 0;
      return a ? 'bodyweight + ' + a : 'bodyweight';
    }
    if (load.kind === 'open') { return 'your call'; }
    return '';
  }

  /* ---------------- prescription ---------------- */

  // Volume scaling per phase, applied to everything except the main lift —
  // the wave table already varies the main work.
  function phaseScale(phase, rules) {
    var r = (rules || {})[phase];
    return r && r.scale ? r.scale : 1;
  }

  // Scaling is per phase only. A per-wave bonus was tried and removed: the main
  // lift's rep volume falls across the waves but its SET count rises (15 a week
  // in the 10s, 21 in the 3s), so weekly totals already climb into the 3s wave
  // without help. See the note in CLAUDE.md before adding one back.
  function scaleSets(sets, phase, rules) {
    var s = phaseScale(phase, rules);
    if (s === 1) { return sets; }
    return Math.max(1, Math.ceil(sets * s));
  }

  // Warm-up ramp into the first working set. Realization ramps itself through
  // ascending singles, and a deload opens at 40% which is already a warm-up.
  function warmups(firstKg, phase, ctx) {
    if (phase === 'Realization' || phase === 'Deload' || !firstKg) { return []; }
    return [
      { reps: 5, kg: mround(firstKg * 0.5, ctx.rounding) },
      { reps: 3, kg: mround(firstKg * 0.75, ctx.rounding) }
    ];
  }

  // Expand one slot into the sets you actually perform.
  function prescribe(slot, week, ctx) {
    var phase = phaseFor(week);
    var out = { movement: slot.movement, kind: slot.kind, rir: slot.rir, note: slot.note, sets: [], warmups: [] };

    if (slot.load && slot.load.kind === 'wave') {
      var wave = waveFor(week, ctx.waveSlots);
      var table = (WAVES[wave] || {})[phase] || [];
      var tm = resolveLoad(slot.load, slot.movement, ctx);
      out.wave = wave;

  }

    mround: mround, phaseFor: phaseFor, waveFor: waveFor, waveSlotFor: waveSlotFor,
    standardReps: standardReps, tracked: tracked,

    weeklyVolume: weeklyVolume, scaleSets: scaleSets

  function defaultState() {

      version: 2,

      programme: { days: JSON.parse(JSON.stringify(P0.days)), weekOverrides: JSON.parse(JSON.stringify(P0.weekOverrides)) },
      cursor: { week: 1, day: 0 },
      logs: {},

      // clicked. Recomputes always run from this base, so tapping Apply twice
