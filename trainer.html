<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juggernaut Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap');
:root{
  --bg:#f2f2f3;--text:#1d1f20;--muted:#5d5d60;--faint:#98989b;
  --line:color-mix(in srgb,#1d1f20 16%,transparent);--line-soft:color-mix(in srgb,#1d1f20 8%,transparent);
  --accent:#5980a6;--accent-strong:#416180;--accent-deep:#1d2d3d;--accent-tint:#eef6ff;--accent-tint-2:#d6ebff;
  --accent-hover:#597ea3;--accent-press:#416180;--on-accent:#f2f2f3;--danger:#a3412f;
  --mark:color-mix(in srgb,#1d1f20 55%,transparent);
  --font-h:"Barlow Condensed",system-ui,sans-serif;--font-b:"Barlow",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#18191b;--text:#ececee;--muted:#a6a6aa;--faint:#7a7a7d;
  --line:color-mix(in srgb,#ececee 18%,transparent);--line-soft:color-mix(in srgb,#ececee 9%,transparent);
  --accent:#749dc4;--accent-strong:#94bce3;--accent-deep:#d6ebff;--accent-tint:#1d2d3d;--accent-tint-2:#2c455d;
  --accent-hover:#94bce3;--accent-press:#b5d9fd;--on-accent:#101418;--danger:#e0806b;
  --mark:color-mix(in srgb,#ececee 50%,transparent);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-b);font-size:15px;background:var(--bg);color:var(--text);line-height:1.45}
::selection{background:var(--accent-tint-2)}
a{color:var(--accent-strong)}a:hover{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header,#app,footer{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:20px;padding-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--font-h);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
header .sub{margin:0;color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;padding:8px 16px calc(var(--nav-h) + 120px)}
h2,h3{font-family:var(--font-h);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:20px;margin:4px 0 10px}
h3{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* buttons + fields */
button{font-family:inherit;font-size:14px;padding:9px 14px;min-height:40px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);cursor:pointer}
button:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
button:active{background:color-mix(in srgb,var(--text) 14%,transparent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{background:var(--accent-hover)}button.primary:active{background:var(--accent-press)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:12px;min-height:32px}
input[type=number],input[type=text],select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:0;padding:7px 9px;min-height:40px;font-size:15px;font-family:inherit}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:color-mix(in srgb,var(--text) 45%,transparent)}
input:focus-visible,select:focus-visible{border-color:var(--accent);outline-offset:0}
select option{background:var(--bg);color:var(--text)}
input[type=number]{width:84px}
label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
/* cards: hairline frames with registration marks */
.card{position:relative;border:1px solid var(--line);padding:16px;margin:0 0 22px;background:transparent}
.card>.corner{position:absolute;width:11px;height:11px;color:var(--mark);pointer-events:none}
.card>.corner::before,.card>.corner::after{content:"";position:absolute;background:currentColor}
.card>.corner::before{left:5px;top:0;width:1px;height:100%}
.card>.corner::after{top:5px;left:0;width:100%;height:1px}
.corner.tl{top:-6px;left:-6px}.corner.tr{top:-6px;right:-6px}.corner.bl{bottom:-6px;left:-6px}.corner.br{bottom:-6px;right:-6px}
.card.highlight{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.hint.sm{font-size:12px;margin:2px 0}
.amap-hint{border-left:2px solid var(--accent);padding-left:10px}
.kindtag{display:inline-flex;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-family:var(--font-b)}
.kindtag.main{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.kindtag.support{border-color:var(--accent);color:var(--accent-strong)}
.tag{color:var(--accent-strong);font-size:11px;font-weight:600;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-tint-2);border-color:var(--accent-tint-2);color:var(--accent-deep)}
.table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.table th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom-color:var(--line)}
.table tbody tr:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
tr.amap td{background:var(--accent-tint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row.wrap{gap:10px 14px}.row.spread{justify-content:space-between}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{flex:1;min-width:190px}
.daytab{font-size:14px}
.daytab.active{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.banner{border:1px solid var(--accent);background:var(--accent-tint);color:var(--accent-deep);padding:10px 12px;font-size:13px;margin:0 0 18px}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-deep);color:var(--bg);padding:10px 18px;font-size:14px;opacity:0;transition:all .25s ease;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px;border:0;background:transparent;color:var(--muted);font-size:11px;letter-spacing:.04em}
.tab:hover{background:transparent;color:var(--text)}
.tab.active{color:var(--accent-strong);font-weight:600}
/* today */
.sess-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sess-title{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.weekticks{display:grid;gap:3px;margin:14px 0 0;align-items:center}
.weekticks i{height:3px;background:var(--line)}
.weekticks i.past{background:var(--accent)}
.weekticks i.now{background:var(--accent-strong);height:6px}
.phase-note{margin:12px 0 0;font-size:14px}
.slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.slot-name{font-family:var(--font-h);font-weight:600;font-size:23px;line-height:1.05;text-transform:uppercase;margin:8px 0 2px}
.slot.main .slot-name{font-size:40px;line-height:.95}
.slot-meta{font-size:13px;color:var(--muted)}
.vidlink{display:inline-flex;align-items:center;gap:5px;flex:none;min-height:36px;padding:0 10px;border:1px solid var(--line);color:var(--accent-strong);text-decoration:none;font-size:13px;vertical-align:middle}
.vidlink:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.table .vidlink{min-height:24px;padding:0 6px;font-size:11px}
details.info{margin-top:8px;font-size:13px;color:var(--muted)}
details.info summary{cursor:pointer;color:var(--accent-strong);font-size:12px;letter-spacing:.04em}
details.info div{margin-top:4px}
.lasttime{font-size:13px;color:var(--accent-strong);margin:10px 0 0}
.warm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-strong);border:1px solid var(--accent);padding:2px 8px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:14px}
.setcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:6px 2px}
.setcell .c-kg{font-family:var(--font-h);font-weight:600;font-size:21px;line-height:1.1}
.setcell .c-reps{font-size:12px;color:var(--muted)}
.setcell.amrap{border-style:dashed;border-color:var(--accent)}
.setcell.done{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.setcell.done:hover{background:var(--accent-hover)}
.setcell.done .c-reps{color:var(--on-accent)}
.setcell.done.short{background:var(--accent-tint-2);color:var(--accent-deep)}
.setcell.done.short .c-reps{color:var(--accent-deep)}
.setcell.open{outline:2px solid var(--accent-strong);outline-offset:1px}
.set-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.bump-note{font-size:13px;font-weight:600;color:var(--accent-strong);background:var(--accent-tint);border-radius:6px;padding:6px 10px;margin:8px 0 0}
.bump-note[hidden]{display:none}
.editor{margin-top:12px;padding:12px;border:1px solid var(--accent);background:var(--accent-tint)}
.editor[hidden]{display:none}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ed-title{font-weight:600;font-size:14px}
.ed-target{font-size:12px;color:var(--muted)}
.ed-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.ed-field.wide{grid-column:1 / -1}
.ed-field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);background:var(--bg)}
.stepper button{border:0;padding:0;min-height:46px;font-size:20px;line-height:1}
.stepper input[type=number]{width:100%;min-height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;font-family:var(--font-h);font-weight:600;font-size:22px;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ed-hint{font-size:12px;color:var(--accent-deep);min-height:16px;margin:10px 0}
.ed-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.ed-actions button{min-height:46px}
.prog-head{font-family:var(--font-h);font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;margin:4px 0 4px}
.tm-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tm-name{font-size:13px;color:var(--muted)}
.tm-val{font-family:var(--font-h);font-weight:600;font-size:36px;line-height:1}
.tm-val small{font-family:var(--font-b);font-weight:400;font-size:13px;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;height:84px;margin-top:14px}
.bars>div{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.bar{background:var(--accent);border:1px solid var(--accent)}
.bar.future{background:transparent;border-style:dashed}
.bar.na{height:2px;background:var(--line);border:0}
.bar-label{font-size:11px;color:var(--muted);text-align:center}
.bar-label b{color:var(--text);font-weight:600}
.tm-next{font-size:12px;color:var(--muted);margin:10px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line)}
.seg button{border:0;border-left:1px solid var(--line);min-height:44px;font-size:13px;padding:4px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.preview-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.preview-row .stepper{width:170px}
.preview-row .stepper span{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--font-h);font-weight:600;font-size:24px}
.tm-flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tm-flow .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tm-flow .v{font-family:var(--font-h);font-weight:600;font-size:30px;line-height:1.1}
.tm-flow .v.new{color:var(--accent-strong)}
.actionbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:4;display:grid;grid-template-columns:auto 1fr 1.7fr;gap:8px;padding:10px;margin:0 0 16px;background:var(--bg);border:1px solid var(--line)}
.actionbar button{min-height:48px}
.backup-dot{position:absolute;top:8px;left:calc(50% + 8px);width:7px;height:7px;background:var(--accent);border-radius:50%}
.tab{position:relative}
.swap-panel{border:1px dashed var(--accent);background:var(--accent-tint);padding:12px;margin:12px 0 0}
.swap-panel label{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.swap-panel select,.swap-panel input{width:100%;max-width:100%;text-transform:none;letter-spacing:0}
.swap-add{display:grid;gap:8px;margin-top:8px}
.swap-add[hidden]{display:none}
.swap-panel .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.swap-panel .row button{min-height:44px}
details.info .row{margin-top:10px}
.logged-note{margin:0 0 12px}
.libtable thead{display:none}
.libtable,.libtable tbody,.libtable tr{display:block}
.libtable tr{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.libtable td{display:block;border:0;padding:2px 0}
.libtable td.lib-step,.libtable td.lib-type{display:inline-block;vertical-align:top;width:calc(50% - 6px)}
.libtable td.lib-step{margin-right:8px}
.libtable input,.libtable select{width:100%}
.lib-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:2px}
</style>

<link rel="manifest" href="./manifest-trainer.webmanifest">
<meta name="theme-color" content="#5980a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<header>
  <h1>Juggernaut Trainer</h1>
  <p class="sub">16-week block · v2</p>
</header>
<div id="app"></div>
<footer>Main lifts run the wave tables off your training max; the Realization AMRAP sets the next one. Everything else is yours to set. Data stays in this browser — export from Setup to back it up.<p style="margin-top:10px"><a href="./index.html" style="color:inherit">v1 bulk block →</a></p></footer>
<script>
/*
 * Juggernaut trainer v2 — engine.
 *
 * One idea instead of three: every prescribed piece of work is a SLOT.
 *   { movement, load, sets, reps, rir }   (+ repsTop for a rep range)
 *
 * A slot's load is typed, which is what lets a chin-up, a machine row and a
 * barbell squat all live in the same structure:
 *   { kind:'wave' }                      main lift — sets/reps/% from the wave table
 *   { kind:'pctTM', lift, pct }          a percentage of some tracked lift's TM
 *   { kind:'weight', kg }                a plain load
 *   { kind:'bodyweight', added }         bodyweight plus whatever is on the belt
 *   { kind:'open' }                      you decide in the gym
 *
 * Only wave slots take an AMRAP and drive the training max. Everything else is
 * prescription plus logging. The wave tables and the progression formula are
 * the method and are locked by tests/methodology-lock.test.mjs.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.JG2 = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PHASES = ['Accumulation', 'Intensification', 'Realization', 'Deload'];

  // The method. Percentages of the training max, reps, and where the AMRAP sits.
  var WAVES = {
    '10s': {
      Accumulation: [[0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10], [0.6, 10, 'A']],
      Intensification: [[0.55, 5], [0.625, 5], [0.675, 10], [0.675, 10], [0.675, 10, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 1], [0.75, 10, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '8s': {
      Accumulation: [[0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8], [0.65, 8, 'A']],
      Intensification: [[0.6, 3], [0.675, 3], [0.725, 8], [0.725, 8], [0.725, 8, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 8, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '5s': {
      Accumulation: [[0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5], [0.7, 5, 'A']],
      Intensification: [[0.65, 2], [0.725, 2], [0.775, 5], [0.775, 5], [0.775, 5], [0.775, 5, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 5, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    },
    '3s': {
      Accumulation: [[0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3], [0.75, 3, 'A']],
      Intensification: [[0.7, 1], [0.775, 1], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3], [0.825, 3, 'A']],
      Realization: [[0.5, 5], [0.6, 3], [0.7, 2], [0.75, 1], [0.8, 1], [0.85, 1], [0.9, 3, 'A']],
      Deload: [[0.4, 5], [0.5, 5], [0.6, 5]]
    }
  };

  // Excel MROUND semantics: halves away from zero. Kept so v1 and v2 agree.
  function mround(value, step) {
    if (!step || step <= 0) { return value; }
    var q = Math.abs(value) / step;
    var r = Math.floor(q + 0.5) * step * (value < 0 ? -1 : 1);
    return Math.round(r * 1000) / 1000;
  }

  function phaseFor(week) { return PHASES[(week - 1) % 4]; }
  function waveSlotFor(week) { return Math.floor((week - 1) / 4); }
  function waveFor(week, waveSlots) { return waveSlots[waveSlotFor(week) % waveSlots.length]; }
  function standardReps(wave) { return parseInt(wave, 10); }

  function tracked(name, lifts) {
    for (var i = 0; i < lifts.length; i++) { if (lifts[i].name === name) { return lifts[i]; } }
    return null;
  }

  /* ---------------- load resolution ---------------- */

  // Returns kg, or null when the app can't know it (open loads, missing TM).
  function resolveLoad(load, movement, ctx) {
    if (!load) { return null; }
    var lift;
    switch (load.kind) {
      case 'wave':
        lift = tracked(movement, ctx.lifts);
        return lift ? lift.tm : null;                     // caller applies the %
      case 'pctTM':
        lift = tracked(load.lift || movement, ctx.lifts);
        return lift ? mround(lift.tm * load.pct, ctx.rounding) : null;
      case 'weight':
        return load.kg === null || load.kg === undefined ? null : load.kg;
      case 'bodyweight':
        // Bodyweight is not a plate load — don't round it to the plate step.
        return ctx.bodyweight ? Math.round((ctx.bodyweight + (load.added || 0)) * 10) / 10 : null;
      default:
        return null;                                       // 'open'
    }
  }

  function loadLabel(load, movement, ctx) {
    if (!load) { return ''; }
    if (load.kind === 'pctTM') { return Math.round(load.pct * 1000) / 10 + '% ' + (load.lift || movement); }
    if (load.kind === 'bodyweight') {

        });

    }

  }

    standardReps: standardReps, tracked: tracked,

  }

  // Brings a saved state up to date. Shared by load and Import, so a backup
  // taken before a change gets the same migrations as the copy on the phone.
  function upgrade(parsed) {
    if ((parsed.repRanges || 0) < REP_RANGES) { migrateRepRanges(parsed); }
    var base = defaultState();
    Object.keys(base).forEach(function (k) { if (parsed[k] === undefined) { parsed[k] = base[k]; } });
    // settings gained keys after v2 shipped, so backfill inside it too —
    // a state saved before then has no increments at all.
    Object.keys(base.settings).forEach(function (k) {
      if (parsed.settings[k] === undefined) { parsed.settings[k] = base.settings[k]; }
    });
    Object.keys(base.settings.increments).forEach(function (k) {
      if (parsed.settings.increments[k] === undefined) { parsed.settings.increments[k] = base.settings.increments[k]; }
    });
    // "No equipment type" no longer exists: every exercise is typed. An
    // exercise you added before that was saved untyped; bodyweight is the
    // class with no step, so nothing that used to sit still starts moving.
    (parsed.customMovements || []).forEach(function (m) {
      if (!m.equip || m.equip === 'none') { m.equip = 'bodyweight'; }
    });
    Object.keys(parsed.equipOverrides || {}).forEach(function (k) {
      if (parsed.equipOverrides[k] === 'none') { delete parsed.equipOverrides[k]; }
    });
    return parsed;
  }

  // Rep ranges arrived after v2 shipped, and a saved state carries its own copy
  // of the programme, so it would never see them. Each base slot that the
  // template now gives a range adopts it. Saving a week in Block used to copy
  // the slot's reps into that week's override whether or not they were
  // changed; a copy equal to the old base number is that, not a decision, and
  // would pin the slot to fixed reps — so it is dropped. A number that differs
  // was typed on purpose and stays exactly as typed: fixed reps, rather than
  // a bottom stretched up to the template's top (an 8 under a 15 is not a
  // range anyone chose). Block can add a range to that week by hand.
  function migrateRepRanges(s) {
    s.repRanges = REP_RANGES;
    if (!s.programme || !s.programme.days) { return; }
    s.programme.days.forEach(function (day, d) {
      var tpl = P0.days[d];
      if (!tpl || tpl.name !== day.name) { return; }
      (day.slots || []).forEach(function (slot) {
        var t = tpl.slots.filter(function (x) { return x.id === slot.id; })[0];
        if (!t || !t.repsTop || slot.repsTop !== undefined) { return; }
        var oldReps = slot.reps;
        Object.keys(s.programme.weekOverrides || {}).forEach(function (w) {
          var patch = ((s.programme.weekOverrides[w][day.name] || {}).slots || {})[slot.id];
          if (!patch || patch.reps === undefined || patch.repsTop !== undefined) { return; }
          if (patch.reps === oldReps) { delete patch.reps; } else { patch.repsTop = null; }
        });
        slot.reps = t.reps;
        slot.repsTop = t.repsTop;
      });
    });
  }

  // Carry across what maps cleanly from v1: training maxes and the nutrition
  // inputs. v1's logs stay in v1 — the shapes are too different to guess at.
  function migrateFromV1() {
    try {
      var old = JSON.parse(localStorage.getItem(V1KEY) || 'null');
      if (!old || !old.inputs) { return null; }
      var s = defaultState();
      s.lifts = s.lifts.map(function (l) {
        var m = (old.inputs.lifts || []).filter(function (x) { return x.name === l.name; })[0];
        return m ? { name: l.name, tm: m.tm, inc: m.inc } : l;
      });
      s.settings.rounding = old.inputs.rounding || s.settings.rounding;
      s.settings.bodyweight = old.inputs.bodyweight || s.settings.bodyweight;
      s.settings.maintenance = old.inputs.maintenance || s.settings.maintenance;
      s.settings.surplus = old.inputs.surplus === undefined ? s.settings.surplus : old.inputs.surplus;
      s.migrated = true;
      return s;
    } catch (e) { return null; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { memoryOnly = true; }
  }

  /* ---------------- helpers ---------------- */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) { if (v === '' || v === null || v === undefined) { return null; } var n = Number(v); return isNaN(n) ? null : n; }
  function fmt(n) { return (n === null || n === undefined || isNaN(n)) ? '–' : String(Math.round(n * 100) / 100); }
  function pretty(g) { return String(g || '').replace(/_/g, ' '); }
  var U = function () { return state.settings.unit; };

  function programme() {
    return {
      id: P0.id, name: P0.name, weeks: P0.weeks, waveSlots: P0.waveSlots,
      days: state.programme.days, movements: movements(), groups: P0.groups,
      weekOverrides: state.programme.weekOverrides, phaseRules: P0.phaseRules

  }
  function movements() {
    var all = P0.movements.concat(state.customMovements || []);

  // The step this movement progresses by. A number typed against the movement
  // itself in Library wins; otherwise it comes from the equipment class. Band,
  // bodyweight and cardio have no weight to add, so they carry no class step
  // and never auto-progress unless you give them a number by hand.
  function incrementFor(movementName) {
    var own = (state.movementIncrements || {})[movementName];

    return equipIncrementFor(movementName);
  }

  function equipIncrementFor(movementName) {
    var equip = (movementInfo(movementName) || {}).equip;
    if (!equip) { return null; }

  }
  function movementsIn(group) { return movements().filter(function (m) { return m.group === group; }); }

  function ctx() {
    return {
      lifts: state.lifts, rounding: state.settings.rounding,
      bodyweight: state.settings.bodyweight, waveSlots: P0.waveSlots

  }

  function logKey(week, day) { return week + '|' + day; }
  function logFor(week, day) {
    var k = logKey(week, day);
    if (!state.logs[k]) { state.logs[k] = { date: null, slots: {} }; }
    return state.logs[k];
  }

  // The most recent logged sets for a movement, before the given session.
  function lastTime(movement, week, day) {
    for (var w = week; w >= 1; w--) {
      for (var d = (w === week ? day - 1 : programme().days.length - 1); d >= 0; d--) {
        var l = state.logs[logKey(w, d)];
        if (!l) { continue; }
        var hit = null;
        Object.keys(l.slots).forEach(function (id) {
          var s = l.slots[id];
          if (s && s.movement === movement && (s.sets || []).some(function (x) { return x && x.reps; })) { hit = s; }

  }

    setTimeout(function () { el.classList.remove('show'); }, hold);

  }

  function maxLoggedWeek() {
    var m = 0;

  }

  // The latest Realization week with anything logged that has not been
  // exported since. Once per wave is often enough to matter and rare enough
  // not to be ignored.
  function unbackedRealization() {
    var latest = 0;
    Object.keys(state.logs).forEach(function (k) {
      var w = Number(k.split('|')[0]);
      if (state.logs[k] && state.logs[k].date && E.phaseFor(w) === 'Realization') { latest = Math.max(latest, w); }
    });
    if (!latest || latest <= (state.backupThrough || 0) || latest <= (state.backupDismissedThrough || 0)) { return 0; }

  }

  /* ---------------- shell ---------------- */

  var TABS = [
    { id: 'today', label: 'Today' },
    { id: 'block', label: 'Block' },
    { id: 'progress', label: 'Progress' },
    { id: 'library', label: 'Library' },
    { id: 'setup', label: 'Setup' }
  ];

  // Lucide paths, drawn at stroke 1.5.
  var ICONS = {
    today: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
    block: '<rect width="18" height="18" x="3" y="4"/><path d="M16 2v4M8 2v4M3 10h18"/>',

  }
  var CORNERS = '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';

  function render() {
    var views = { today: viewToday, block: viewBlock, setup: viewSetup, progress: viewProgress, library: viewLibrary };
    var app = document.getElementById('app');
    app.innerHTML =
      (memoryOnly ? '<div class="banner">Browser storage unavailable — this tab only. Export from Setup.</div>' : '') +

      '<main>' + views[state.ui.tab]() + '</main>' +

  }

  /* ---------------- session rendering ---------------- */

  // The book is explicit that the last main set is not the same effort every
  // week: push past the prescribed reps in every phase but Deload (that's the
  // Doug Young mechanic the whole method is built on), while how close to
  // failure you take it is prescribed on its own — RIR 2-3 during
  // Accumulation, RIR 1-2 during Intensification, and only Realization is a
  // true RIR 0 (AMRAP). Training to failure every week is exactly what the
  // book warns burns recovery, so the two are not interchangeable. RIR is the
  // same language every other slot's prescribed-effort column already uses.
  var RESERVE_HINT = {
    Accumulation: 'RIR 2-3',
    Intensification: 'RIR 1-2',
    Realization: 'RIR 0 — AMRAP'
  };
  // Short form for the in-row tag — the sets table is narrow on a phone and
  // .sets .target is nowrap, so the full sentence above belongs in the header
  // hint, not squeezed into this column.
  var RESERVE_TAG = {
    Accumulation: 'RIR 2-3',
    Intensification: 'RIR 1-2',
    Realization: 'AMRAP'
  };

  // Target RIR for the last main set, as a number the stepper can start from.
  var MAIN_RIR = { Accumulation: 2, Intensification: 1, Realization: 0 };

  function sessionHeader(week, day) {
    var wave = E.waveFor(week, P0.waveSlots), phase = E.phaseFor(week);
    var d = programme().days[day];
    var main = E.slotsFor(programme(), week, day).filter(function (s) { return s.id === 'main'; })[0];
    var ticks = '';
    for (var w = 1; w <= P0.weeks; w++) { ticks += '<i class="' + (w < week ? 'past' : w === week ? 'now' : '') + '"></i>'; }
    var note = {
      Accumulation: 'Last main set: push past the prescribed reps, but stop at RIR 2–3. Not a true AMRAP.',
      Intensification: 'Last main set: push past the prescribed reps, but stop at RIR 1–2.',
      Realization: 'Last main set is an AMRAP against a standard of ' + E.standardReps(wave) + ', RIR 0. Those reps set your next training max — log them here and Progress picks them up.',
      Deload: 'Main work as written, everything else cut right back. Leave fresh.'
    }[phase];
    return '<div class="card sess">' +
      '<div class="sess-kicker">Week ' + week + ' of ' + P0.weeks + ' · ' + esc(d.name) + '</div>' +
      '<div class="sess-title">' + esc(main ? main.movement : d.name) + ' day</div>' +
      '<div class="tags"><span class="pill accent">' + wave + ' wave</span><span class="pill">' + phase + '</span></div>' +
      '<div class="weekticks" style="grid-template-columns:repeat(' + P0.weeks + ',1fr)" aria-hidden="true">' + ticks + '</div>' +
      (note ? '<p class="phase-note">' + note + '</p>' : '') +
      '</div>';
  }

  // Verified, specific videos for the main lifts only — same author as the
  // book (Chad Wesley Smith / Juggernaut Training Systems), so the technique
  // shown matches the method this app runs. Everything else links to a
  // YouTube search instead of a hand-picked video: a specific video ID goes
  // dead or private with no warning, a search query never does, and there
  // are too many accessories to keep re-verifying individual links by hand.
  var CURATED_VIDEOS = {
    'Squat': 'https://www.youtube.com/watch?v=X_wwJhaN0vU',
    'Bench Press': 'https://www.youtube.com/watch?v=LpLmYf9z1ZA',
    'Deadlift': 'https://www.youtube.com/watch?v=rukd80YXUaE'
  };
  function videoLinkFor(movementName) {
    return CURATED_VIDEOS[movementName] ||
      ('https://www.youtube.com/results?search_query=' + encodeURIComponent(movementName + ' exercise form'));
  }
  function videoLink(movementName) {
    return '<a class="vidlink" href="' + esc(videoLinkFor(movementName)) + '" target="_blank" rel="noopener" title="Watch a form demo">' + icon(ICONS.play, 13) + 'Form</a>';
  }

  function renderSlot(p, week, day, idx) {
    var log = logFor(week, day);
    var entry = log.slots[p.id] || {};
    var logged = entry.sets || [];
    var prev = lastTime(p.movement, week, day);
    var info = movementInfo(p.movement);
    var isMain = p.slot.load.kind === 'wave';
    var phase = E.phaseFor(week);

    var prevLine = '';
    if (prev) {
      var txt = (prev.entry.sets || []).filter(function (s) { return s && s.reps; })
        .map(function (s) { return (s.kg === null || s.kg === undefined ? '?' : s.kg) + '×' + (s.reps === null || s.reps === undefined ? '?' : s.reps); }).join('  ');
      var rirs = (prev.entry.sets || []).filter(function (s) { return s && s.reps && s.rir !== null && s.rir !== undefined; })
        .map(function (s) { return s.rir; });
      prevLine = '<div class="lasttime">Last time (wk ' + prev.week + '): ' + esc(txt) + (rirs.length ? ' · RIR ' + esc(rirs.join('/')) : '') + '</div>';
    }
    var warm = p.warmups.length
      ? '<div class="warm">Warm-up ' + p.warmups.map(function (w) { return '<span class="chip">' + fmt(w.kg) + ' × ' + w.reps + '</span>'; }).join('') + '</div>'
      : '';

    // Weight steps by the plate rounding for TM-driven loads, otherwise by the
    // movement's own equipment jump.
    var kgStep = (isMain || p.slot.load.kind === 'pctTM') ? state.settings.rounding : (incrementFor(p.movement) || state.settings.rounding);
    function field(label, input, step, wide) {
      return '<div class="ed-field' + (wide ? ' wide' : '') + '"><span>' + label + '</span><div class="stepper">' +
        '<button type="button" data-action="step" data-d="-' + step + '" aria-label="Less ' + label + '">−</button>' + input +
        '<button type="button" data-action="step" data-d="' + step + '" aria-label="More ' + label + '">+</button></div></div>';
    }

    // RIR is asked for only where something uses it: a fixed-rep slot, which
    // progresses on a beaten RIR. A rep range progresses on reps alone and the
    // main lift on its AMRAP reps, so there the target RIR stays in the set
    // header as where to stop, and the box is gone. A RIR logged before this
    // rides along in a hidden input so re-saving an old session keeps it.
    var askRir = !isMain && !p.repsTop;
    var cells = '', editors = '', amrapSet = null;
    p.sets.forEach(function (s, i) {
      var lg = logged[i] || {};
      var kgVal = lg.kg !== null && lg.kg !== undefined ? lg.kg : (s.kg === null ? fmtBox(suggestedKgFor(p.movement, week, day, i)) : s.kg);
      var repVal = lg.reps !== null && lg.reps !== undefined ? lg.reps : '';
      var rirVal = lg.rir !== null && lg.rir !== undefined ? lg.rir : '';
      var tRir = isMain ? (s.amrap && MAIN_RIR[phase] !== undefined ? MAIN_RIR[phase] : '') : (p.rir === undefined ? '' : p.rir);

        (s.amrap && isMain ? ' · ' + (RESERVE_TAG[phase] || 'AMRAP') : (tRir !== '' ? ' @ RIR ' + tRir : '')) +

        '<span class="c-kg"></span><span class="c-reps"></span></button>';
      editors += '<div class="editor" data-i="' + i + '" data-treps="' + s.reps + '" data-ttop="' + (s.top || '') + '" data-trir="' + tRir + '" data-amrap="' + (s.amrap ? 1 : 0) + '" hidden>' +
        '<div class="ed-head"><span class="ed-title">Set ' + s.n + '</span><span class="ed-target">' + esc(target) + '</span></div>' +
        '<div class="ed-fields">' +
        field('Reps', '<input type="number" inputmode="numeric" step="1" min="0" class="in-reps" data-i="' + i + '" value="' + repVal + '" placeholder="' + repsTxt + '">', 1) +
        (askRir
          ? field('RIR', '<input type="number" inputmode="numeric" step="1" min="0" class="in-rir" data-i="' + i + '" value="' + rirVal + '" placeholder="' + tRir + '">', 1)
          : '<input type="hidden" class="in-rir" data-i="' + i + '" value="' + rirVal + '">') +
        field(U(), '<input type="number" inputmode="decimal" step="0.5" min="0" class="in-kg" data-i="' + i + '" value="' + kgVal + '">', kgStep, askRir) +
        '</div><div class="ed-hint"></div>' +
        '<div class="ed-actions"><button type="button" data-action="clear-set">Clear</button><button type="button" class="primary" data-action="log-set">Log set</button></div>' +
        '</div>';
    });

    var meta = isMain
      ? p.wave + ' wave · TM ' + fmt((E.tracked(p.movement, state.lifts) || {}).tm) + ' ' + U()
      : [p.label ? esc(p.label) : '', p.sets.length + ' × ' + (p.sets[0] ? E.repsLabel(p.sets[0].reps, p.sets[0].top) : ''), p.rir !== undefined ? 'RIR ' + p.rir : ''].filter(Boolean).join(' · ');
    var swapping = swapOpen === p.id && !isMain;
    var infoHtml = ((info && info.kit) || p.note || !isMain)
      ? '<details class="info"' + (swapping ? ' open' : '') + '><summary>More</summary>' +
        (info && info.kit ? '<div>' + esc(info.kit) + (info.note ? ' — ' + esc(info.note) : '') + '</div>' : '') +
        (p.note ? '<div>' + esc(p.note) + '</div>' : '') +
        (!isMain ? '<div class="row"><button type="button" class="small swap-btn" data-action="swap-open" data-slot="' + esc(p.id) + '">Swap exercise</button></div>' : '') +
        '</details>' + (swapping ? swapPanel(p) : '')
