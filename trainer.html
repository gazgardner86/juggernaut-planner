    return '<div class="card slot' + (isMain ? ' main' : '') + '" data-slot="' + esc(p.id) + '" data-movement="' + esc(p.movement) + '">' +
      '<div class="slot-head"><div><span class="kindtag ' + p.kind + '">' + p.kind + '</span>' +
      '<div class="slot-name">' + esc(p.movement) + '</div><div class="slot-meta">' + meta + '</div></div>' +
      videoLink(p.movement) + '</div>' +
      infoHtml + prevLine + warm +
      '<div class="setgrid">' + cells + '</div>' +
      '<p class="bump-note"' + (bumpNoteText(entry) ? '' : ' hidden') + '>' + esc(bumpNoteText(entry)) + '</p>' +
      (setNote ? '<p class="set-note">' + setNote + '</p>' : '') +
      editors +
      '</div>';
  }

  // Paints a set cell from its editor's inputs. The inputs stay the source of
  // truth — readSession() reads them exactly as it always has.
  function refreshCell(card, i) {
    var ed = card.querySelector('.editor[data-i="' + i + '"]');
    var cell = card.querySelector('.setcell[data-i="' + i + '"]');
    if (!ed || !cell) { return; }
    var reps = num(ed.querySelector('.in-reps').value), rir = num(ed.querySelector('.in-rir').value), kg = num(ed.querySelector('.in-kg').value);
    var tReps = num(ed.dataset.treps), tTop = num(ed.dataset.ttop), tRir = num(ed.dataset.trir), amrap = ed.dataset.amrap === '1';
    var done = reps !== null;
    var short = done && ((tReps !== null && reps < tReps) || (rir !== null && tRir !== null && rir < tRir));
    cell.classList.toggle('done', done);
    cell.classList.toggle('short', short);
    cell.querySelector('.c-kg').textContent = kg === null ? '–' : fmt(kg);
    cell.querySelector('.c-reps').textContent = done ? reps + (rir !== null ? ' @ ' + rir : '') : '× ' + E.repsLabel(tReps, tTop) + (amrap ? '+' : '');
    var hints = [];
    if (done && tReps !== null && reps < tReps) { hints.push((tReps - reps) + ' short of target'); }
    if (done && amrap && tReps !== null && reps > tReps) { hints.push((reps - tReps) + ' over the standard'); }
    if (done && tTop !== null && reps >= tTop) { hints.push('top of the range — stop here'); }
    if (rir !== null && tRir !== null && rir < tRir) { hints.push('harder than planned'); }
    ed.querySelector('.ed-hint').textContent = hints.join(' · ');
  }

  // Every logged set re-checks progression, so the weight goes up for next
  // session the moment the last set reaches the top — no Save needed — and a
  // set corrected back down takes it away again (undoBump).
  function persistSession() {
    readSession();
    progressAccessories(state.cursor.week, state.cursor.day);
    save();
    paintBumpNotes();
  }

  function bumpNoteText(entry) {
    var b = entry && entry.bump;
    if (!b) { return ''; }
    var up = b.kind === 'pctTM' || b.kind === 'open' ? '+' + fmt(b.inc) + ' ' + U()
      : b.kind === 'bodyweight' ? fmt(b.to) + ' added' : fmt(b.to) + ' ' + U();
    return 'Top of the range on every set — next session ' + up;
  }
  function paintBumpNotes() {
    var log = state.logs[logKey(state.cursor.week, state.cursor.day)];
    document.querySelectorAll('#app .card.slot').forEach(function (card) {
      var el = card.querySelector('.bump-note');
      if (!el) { return; }
      var txt = bumpNoteText(log && log.slots[card.dataset.slot]);
      el.textContent = txt; el.hidden = !txt;
    });
  }

  function setAction(btn, a) {
    var card = btn.closest('.card.slot');
    if (!card) { return; }
    if (a === 'cell') {
      var ci = btn.dataset.i;
      var target = card.querySelector('.editor[data-i="' + ci + '"]');
      var opening = target.hidden;
      document.querySelectorAll('#app .editor').forEach(function (e) { e.hidden = true; });
      document.querySelectorAll('#app .setcell.open').forEach(function (c) { c.classList.remove('open'); });
      if (opening) { target.hidden = false; btn.classList.add('open'); }
      return;
    }
    var ed = btn.closest('.editor');
    var i = ed.dataset.i;
    var reps = ed.querySelector('.in-reps'), rir = ed.querySelector('.in-rir');
    if (a === 'step') {
      var input = btn.parentNode.querySelector('input');
      var cur = num(input.value);
      if (cur === null) {
        // An empty box steps from the target, so "−" on a missed set means one short.
        if (input === reps) { cur = num(ed.dataset.treps) || 0; }
        else if (input === rir) { cur = num(ed.dataset.trir) === null ? 2 : num(ed.dataset.trir); }
        else { cur = 0; }
      }
      input.value = Math.max(0, Math.round((cur + Number(btn.dataset.d)) * 100) / 100);
      refreshCell(card, i); persistSession();
      return;
    }
    var cell = card.querySelector('.setcell[data-i="' + i + '"]');
    if (a === 'log-set') {
      if (reps.value === '') {
        // The AMRAP set exists to record what you actually got, and on a
        // Realization week that number becomes the next training max, so
        // nothing is assumed for it. Any other set can be "did the plan" —
        // for a rep range that is the bottom, the least the plan asked for,
        // so an untyped set can never be what earns a weight increase.
        if (ed.dataset.amrap === '1') {
          ed.querySelector('.ed-hint').textContent = 'Enter the reps you got — nothing is assumed for this set.';
          return;
        }
        reps.value = ed.dataset.treps;
      }
      // RIR is never filled in: it is a measurement, not a plan. Progression
      // needs the real number, and a made-up one would also silence the
      // "no RIR logged" warning.
    } else if (a === 'clear-set') {
      reps.value = ''; rir.value = '';
    }
    refreshCell(card, i);
    ed.hidden = true; cell.classList.remove('open');
    persistSession();
    if (a === 'log-set') {
      var next = card.querySelector('.setcell:not(.done)');
      if (next) { setAction(next, 'cell'); }
    }
  }

  function swapPanel(p) {
    var group = (movementInfo(p.movement) || {}).group;
    // Lifts that take an AMRAP own a training max and a wave, so they are not
    // something an accessory slot can become.
    var mains = E.progressingLifts(programme());
    var options = movementsIn(group).filter(function (m) { return m.name !== p.movement && mains.indexOf(m.name) === -1; });
    return '<div class="swap-panel"><label>Swap for <select class="swap-select">' +
      options.map(function (m) {
        return '<option value="' + esc(m.name) + '">' + esc(m.name) + ' · ' + esc(equipName(m.equip)) + '</option>';
      }).join('') +
      '<option value="__add__">+ Add your own…</option></select></label>' +
      '<div class="swap-add" hidden><input type="text" class="swap-name" placeholder="Exercise name"> ' +
      '<select class="swap-equip"><option value="">Equipment…</option>' +
      P0.equipment.map(function (eq) { return '<option value="' + eq + '">' + esc(equipName(eq)) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="row"><button type="button" class="small primary" data-action="swap-today" data-slot="' + esc(p.id) + '">Just today</button>' +
      '<button type="button" class="small" data-action="swap-forward" data-slot="' + esc(p.id) + '">From now on</button>' +
      '<button type="button" class="small" data-action="swap-cancel">Cancel</button></div>' +
      '<div class="hint sm">The load resets to "your call" — the new exercise brings its own history.</div></div>';
  }

  function fmtBox(n) { return n === null || n === undefined ? '' : n; }

  // Display names for every equipment class, used wherever one is picked or shown.
  var EQUIP_NAMES = {
    barbell: 'Barbell', dumbbell: 'Dumbbell', machine: 'Machine', cable: 'Cable',
    belt: 'Bodyweight + belt', kettlebell: 'Kettlebell', band: 'Band',
    bodyweight: 'Bodyweight', cardio: 'Cardio machine'
  };
  function equipName(id) { return EQUIP_NAMES[id] || id; }

  var EQUIP_LABELS = [
    { id: 'barbell', label: 'Barbell', note: 'Smallest pair of plates — 1.25 kg each side' },
    { id: 'dumbbell', label: 'Dumbbells', note: 'The gap between one dumbbell and the next' },
    { id: 'machine', label: 'Machines', note: 'Selectorised stacks, leg press, hack squat' },
    { id: 'cable', label: 'Cables', note: 'Often the same stack increment as the machines' },
    { id: 'belt', label: 'Bodyweight + belt', note: 'Chin-ups, dips — the plate you hang on' },
    { id: 'kettlebell', label: 'Kettlebells', note: 'The gap between one kettlebell and the next' }
  ];

  // Open loads have no prescribed number, so the box would otherwise start
  // blank every session. Suggest last time's weight for that set instead —
  // it's still just a prefill: a set only logs once reps are entered, so
  // this can't record a set you didn't do. If last time earned a progression
  // bump (see progressAccessories), the suggestion carries that bump forward
  // without rewriting what you actually logged.
  function suggestedKgFor(movement, week, day, i) {
    var prev = lastTime(movement, week, day);
    if (!prev) { return null; }
    var prevSets = prev.entry.sets || [];
    var bump = prev.entry.suggestBump || 0;
    var exact = prevSets[i];
    if (exact && exact.kg !== null && exact.kg !== undefined) { return exact.kg + bump; }
    for (var j = prevSets.length - 1; j >= 0; j--) {
      if (prevSets[j] && prevSets[j].kg !== null && prevSets[j].kg !== undefined) { return prevSets[j].kg + bump; }
    }
    return null;
  }

  function viewToday() {
    var week = state.cursor.week, day = state.cursor.day;
    var prescribed = E.prescribeDay(programme(), week, day, ctx());
    var done = state.logs[logKey(week, day)] && state.logs[logKey(week, day)].date;
    return sessionHeader(week, day) +
      prescribed.map(function (p, i) { return renderSlot(p, week, day, i); }).join('') +
      (done ? '<p class="hint">Logged ' + esc(done) + '</p>' : '') +
      '<div class="actionbar">' +
      '<button type="button" data-action="skip-back" aria-label="Previous session">‹ Back</button>' +
      '<button type="button" data-action="save-session">Save</button>' +
      '<button type="button" class="primary" data-action="finish-session">Finish · next ›</button>' +
      '</div>';
  }

  /* ---------------- block editing ---------------- */

  function daysLogged(week) {
    var n = 0;
    for (var d = 0; d < state.programme.days.length; d++) {
      var l = state.logs[logKey(week, d)];
      if (l && l.date) { n++; }
    }
    return n;
  }

  // Shared by the Block browser and the Setup "start here" picker so both
  // list weeks the same way: wave and phase alongside the number, plus how
  // much of the week is already logged.
  function weekOptionsHtml(selectedWeek) {
    var total = state.programme.days.length;
    var opts = '';
    for (var w = 1; w <= P0.weeks; w++) {
      var dl = daysLogged(w);
      var mark = dl === total ? ' ✓' : dl > 0 ? ' · ' + dl + '/' + total : '';
      opts += '<option value="' + w + '"' + (w === selectedWeek ? ' selected' : '') + '>Week ' + w + ' — ' +
        E.waveFor(w, P0.waveSlots) + ' · ' + E.phaseFor(w) + mark + '</option>';
    }
    return opts;
  }

  function viewBlock() {
    var week = state.ui.blockWeek, day = state.ui.blockDay;
    var pr = programme();
    var opts = weekOptionsHtml(week);
    var slots = E.slotsFor(pr, week, day);
    var trackedNames = state.lifts.map(function (l) { return l.name; });
    var progressing = E.progressingLifts(pr);

    var rows = slots.map(function (s) {
      var isMain = s.load.kind === 'wave';
      var pool = isMain ? progressing : movementsIn((movementInfo(s.movement) || {}).group || pr.groups[0]).map(function (m) { return m.name; });
      var groupSel = isMain ? '' :
        '<label>Group <select class="s-group">' + pr.groups.map(function (g) {
          var cur = (movementInfo(s.movement) || {}).group;
          return '<option value="' + g + '"' + (g === cur ? ' selected' : '') + '>' + pretty(g) + '</option>';
        }).join('') + '</select></label>';
      var movSel = '<label>Movement <select class="s-move">' +
        pool.map(function (n) { return '<option value="' + esc(n) + '"' + (n === s.movement ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
        (isMain ? '' : '<option value="__add__">+ Add your own…</option>') + '</select></label>';

      var loadCtl = '';
      if (!isMain) {
        loadCtl = '<label>Load <select class="s-loadkind">' +
          ['pctTM', 'weight', 'bodyweight', 'open'].map(function (k) {
            var lbl = { pctTM: '% of a TM', weight: 'fixed weight', bodyweight: 'bodyweight', open: 'your call' }[k];
            return '<option value="' + k + '"' + (k === s.load.kind ? ' selected' : '') + '>' + lbl + '</option>';
          }).join('') + '</select></label>';
        if (s.load.kind === 'pctTM') {
          loadCtl += '<label>of <select class="s-loadlift">' + trackedNames.map(function (n) {
            return '<option value="' + esc(n) + '"' + (n === (s.load.lift || s.movement) ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('') + '</select></label>' +
            '<label>% <input type="number" step="0.5" class="s-pct" value="' + (Math.round(s.load.pct * 1000) / 10) + '"></label>' +
            '<span class="hint">Rises one step when it earns a progression — the percentage moves, never the training max.</span>';
        } else if (s.load.kind === 'weight') {
          loadCtl += '<label>' + U() + ' <input type="number" step="0.5" class="s-kg" value="' + (s.load.kg === null || s.load.kg === undefined ? '' : s.load.kg) + '"></label>';
        } else if (s.load.kind === 'bodyweight') {
          loadCtl += '<label>+ <input type="number" step="0.5" class="s-added" value="' + (s.load.added || 0) + '"></label>';
        } else if (s.load.kind === 'open') {
          loadCtl += '<span class="hint">No fixed number — you\'ll still enter what you actually lifted on the Today tab, same as every other slot. This just means the plan doesn\'t prescribe one for you.</span>';
        }
        loadCtl += '<label>Sets <input type="number" min="1" step="1" class="s-sets" value="' + s.sets + '"></label>' +
          '<label>Reps <input type="number" min="1" step="1" class="s-reps" value="' + s.reps + '"></label>' +
          '<label>to <input type="number" min="1" step="1" class="s-reps-top" value="' + (E.repTop(s) || '') + '" placeholder="–"></label>' +
          '<label>RIR <input type="number" min="0" step="1" class="s-rir" value="' + (s.rir === undefined ? '' : s.rir) + '"></label>' +
          // The equipment class decides the progression step for this exercise.
          '<label>Equipment <select class="s-equip" data-movement="' + esc(s.movement) + '">' +
          P0.equipment.map(function (eq) {
            var cur = (movementInfo(s.movement) || {}).equip;
            return '<option value="' + eq + '"' + (eq === cur ? ' selected' : '') + '>' + esc(equipName(eq)) + '</option>';
          }).join('') + '</select></label>' +
          '<span class="hint">' + (E.repTop(s)
            ? 'Range: keep the weight and add reps. Once every set reaches ' + E.repTop(s) + ', the weight goes up next session and you drop back to ' + s.reps + '. RIR ' + (s.rir === undefined ? '?' : s.rir) + ' is where to stop, not a test.'
            : 'Fixed reps: the weight goes up when every set hits ' + s.reps + ' with a higher RIR than asked. Fill in "to" for a range.') + '</span>';
      } else {
        loadCtl = '<span class="hint">Sets, reps and percentages come from the ' + E.waveFor(week, P0.waveSlots) + ' wave table.</span>';
      }

      return '<div class="card slotedit" data-slot="' + esc(s.id) + '">' +
        '<div class="row spread"><b><span class="kindtag ' + s.kind + '">' + s.kind + '</span></b></div>' +
        '<div class="row wrap">' + groupSel + movSel + '</div>' +
        '<div class="row wrap">' + loadCtl + '</div></div>';
    }).join('');

    var vol = E.weeklyVolume(pr, week, ctx());
    return '<div class="card weekbar">' +
      '<select id="block-week">' + opts + '</select>' +
      pr.days.map(function (d, i) {
        var dlog = state.logs[logKey(week, i)];
        return '<button type="button" class="daytab' + (i === day ? ' active' : '') + '" data-action="block-day" data-day="' + i + '">' + esc(d.name) + (dlog && dlog.date ? ' ✓' : '') + '</button>';
      }).join('') + '</div>' +
      '<p class="hint">Edits apply to <b>this week only</b> unless you push them to the whole block. The main lift\'s sets and percentages always come from the wave table.</p>' +
      rows +
      '<div class="card"><div class="row">' +
      '<button type="button" class="primary" data-action="save-slots">Save this week</button>' +
      '<button type="button" data-action="push-all">Apply to all ' + P0.weeks + ' weeks</button>' +
      '<button type="button" data-action="jump-here">Train this session</button></div></div>' +
      '<div class="card"><h3>Week ' + week + ' sets by group</h3><p class="hint">' +
      Object.keys(vol).sort().map(function (g) { return pretty(g) + ' ' + vol[g]; }).join(' · ') +
      ' &nbsp;—&nbsp; <b>' + Object.keys(vol).reduce(function (t, g) { return t + vol[g]; }, 0) + ' sets</b></p></div>';
  }

  /* ---------------- setup ---------------- */

  function viewSetup() {
    var s = state.settings;
    // Protein is prescribed per kg of bodyweight; convert when the app is in lb
    // or the maths silently doubles the target.
    var bwKg = s.unit === 'lb' ? s.bodyweight * 0.45359237 : s.bodyweight;
    var protein = [Math.round(bwKg * 2), Math.round(bwKg * 2.2)];
    var atDefault = state.cursor.week === 1 && state.cursor.day === 0 &&
      Object.keys(state.logs).length === 0;
    var startCard = '<section class="card' + (state.migrated && atDefault ? ' highlight' : '') + '">' +
      '<h2>Start / jump to a week</h2>' +
      (state.migrated && atDefault ?
        '<p class="hint">Training maxes and nutrition carried over from the old app. Logs did not — pick the week you\'re actually on before your next session, so the wave table and volume match where you are.</p>' : '') +
      '<p class="hint">Currently set to <b>' + esc(programme().days[state.cursor.day].name) + ', Week ' + state.cursor.week + '</b> ' +
      '(' + E.waveFor(state.cursor.week, P0.waveSlots) + ' · ' + E.phaseFor(state.cursor.week) + ').</p>' +
      '<div class="row wrap">' +
      '<label>Week <select id="start-week">' + weekOptionsHtml(state.cursor.week) + '</select></label>' +
      '<label>Day <select id="start-day">' + programme().days.map(function (d, i) {
        return '<option value="' + i + '"' + (i === state.cursor.day ? ' selected' : '') + '>' + esc(d.name) + '</option>';
      }).join('') + '</select></label>' +
      '<button type="button" class="primary" data-action="start-week">Start here</button>' +
      '</div></section>';
    return startCard +
      '<section class="card"><h2>Training maxes</h2>' +
      '<p class="hint">Every lift here can be used as a percentage-based load. Only lifts used as a <b>main</b> lift take an AMRAP and progress automatically — see Progress.</p>' +
      '<table class="table"><thead><tr><th>Lift</th><th>TM (' + U() + ')</th><th>Per-rep increment</th><th></th></tr></thead><tbody>' +
      state.lifts.map(function (l, i) {
        var prog = E.progressingLifts(programme()).indexOf(l.name) !== -1;
        return '<tr><td>' + esc(l.name) + '</td>' +
          '<td><input type="number" step="0.5" min="0" class="in-tm" data-i="' + i + '" value="' + l.tm + '"></td>' +
          '<td><input type="number" step="0.25" min="0" class="in-inc" data-i="' + i + '" value="' + l.inc + '"></td>' +
          '<td class="hint">' + (prog ? 'progresses' : 'load only') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>Block</h2><div class="row wrap">' +
      '<label>Units <select id="in-unit">' + ['kg', 'lb'].map(function (u) {
        return '<option value="' + u + '"' + (u === s.unit ? ' selected' : '') + '>' + u + '</option>';
      }).join('') + '</select></label>' +
      '<label>Round to <input type="number" step="0.25" min="0.25" id="in-round" value="' + s.rounding + '"></label>' +
      '<label>Bodyweight <input type="number" step="0.1" id="in-bw" value="' + s.bodyweight + '"></label>' +
      '</div><p class="hint">Switching units relabels the numbers — nothing is converted. Enter your maxes, steps and bodyweight in the unit you train in.</p>' +
      '<p class="hint">Waves: ' + P0.waveSlots.map(function (w, i) {
        return w + ' (weeks ' + (i * 4 + 1) + '–' + (i * 4 + 4) + ')';
      }).join(' → ') + '</p>' +
      '<h2>Weight jumps</h2>' +
      '<p class="hint">The smallest step each kind of kit allows at <b>your</b> gym. This is what an accessory goes up by when you earn a progression — nothing to do with the rounding above, which is for the main lifts.</p>' +
      '<table class="table"><thead><tr><th>Equipment</th><th>Step (' + U() + ')</th><th></th></tr></thead><tbody>' +
      EQUIP_LABELS.map(function (e) {
        return '<tr><td>' + esc(e.label) + '</td>' +
          '<td><input type="number" step="0.01" min="0.01" class="in-step" data-equip="' + e.id + '" value="' + (s.increments[e.id] === undefined ? '' : s.increments[e.id]) + '"></td>' +
          '<td class="hint">' + esc(e.note) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>Nutrition</h2><div class="row wrap">' +
      '<label>Maintenance (kcal) <input type="number" step="10" id="in-maint" value="' + s.maintenance + '"></label>' +
      '<label>Surplus (kcal) <input type="number" step="10" id="in-surplus" value="' + s.surplus + '"></label>' +
      '</div><table class="table"><tbody>' +
      '<tr><td>Protein</td><td><b>' + protein[0] + ' – ' + protein[1] + ' g/day</b></td><td class="hint">2.0–2.2 g/kg</td></tr>' +
      '<tr><td>Target calories</td><td><b>' + (s.maintenance + s.surplus) + ' kcal</b></td><td class="hint">Re-estimate maintenance every 2–3 weeks from your weight trend</td></tr>' +
      '</tbody></table>' +
      '<button type="button" class="primary" id="save-setup" data-action="save-setup">Save</button></section>' +
      '<section class="card"><h2>Data</h2><div class="row">' +
      '<button type="button" data-action="export">Export JSON</button>' +
      '<button type="button" data-action="import">Import JSON</button>' +
      '<input type="file" id="import-file" accept=".json" hidden>' +
      '<button type="button" data-action="export-csv">Export log (CSV)</button>' +
      '<button type="button" class="danger" data-action="reset">Reset</button></div>' +
      '<p class="hint">Stored in this browser only. ' +
      (state.lastExportAt ? 'Last backup: ' + esc(state.lastExportAt) + '.' : 'Never backed up.') + '</p></section>';
  }

  /* ---------------- progress ---------------- */

  // The realization AMRAP already logged on Today, so Progress can prefill it
  // instead of asking for the same number twice. Looks up the AMRAP by its set
  // index in the prescription — the last *logged* set is not good enough,
  // because a session abandoned before the AMRAP would hand back a ramp single.
  // Does this lift take the Realization AMRAP of this wave? A lift is only the
  // main lift in some waves — Overhead Press in weeks 1-4, Bench from week 5 —
  // and a tracker row for a wave where it is only a support lift can never be
  // filled in, because that wave has no AMRAP for it.
  function testedInWave(slot, name) {
    var week = slot * 4 + 3;
    for (var d = 0; d < state.programme.days.length; d++) {
      if (E.slotsFor(programme(), week, d).some(function (x) { return x.load && x.load.kind === 'wave' && x.movement === name; })) { return true; }
    }
    return false;
  }

  function loggedAmrapFor(slot, name) {
    var week = slot * 4 + 3;
    for (var d = 0; d < state.programme.days.length; d++) {
      var log = state.logs[logKey(week, d)];
      if (!log || !log.slots || !log.slots.main || log.slots.main.movement !== name) { continue; }
      var pres = E.prescribeDay(programme(), week, d, ctx()).filter(function (p) { return p.id === 'main'; })[0];
      if (!pres) { continue; }
      var ai = -1;
      pres.sets.forEach(function (s, i) { if (s.amrap) { ai = i; } });
      var s = ai === -1 ? null : (log.slots.main.sets || [])[ai];
      if (s && s.reps !== null && s.reps !== undefined) { return s.reps; }
    }
    return null;
  }

  // A lift used as the main lift anywhere from this week on still gets an
  // AMRAP, and its TM must move only through that.
  function mainFrom(lift, fromWeek) {
    for (var w = fromWeek; w <= P0.weeks; w++) {
      for (var d = 0; d < state.programme.days.length; d++) {
        if (E.slotsFor(programme(), w, d).some(function (x) { return x.load && x.load.kind === 'wave' && x.movement === lift; })) { return true; }
      }
    }
    return false;
  }

  // %TM support slots whose own percentage has been raised by progression,
  // for lifts that will not be tested by an AMRAP again this block (Overhead
  // Press after week 4, Incline Bench always). Folding converts the raised
  // percentage back into a training max, so the next block starts from what
  // was actually lifted rather than a max set weeks earlier.
  function supportFolds() {
    var out = [];
    state.programme.days.forEach(function (day, d) {
      day.slots.forEach(function (base) {
        if (base.kind === 'main' || !base.load || base.load.kind !== 'pctTM') { return; }
        var lift = base.load.lift || base.movement;
        var last = E.slotsFor(programme(), P0.weeks, d).filter(function (x) { return x.id === base.id; })[0];
        if (!last || !last.load || last.load.kind !== 'pctTM' || (last.load.lift || last.movement) !== lift) { return; }
        if (!(last.load.pct > base.load.pct + 1e-9)) { return; }
        if (mainFrom(lift, state.cursor.week)) { return; }
        var L = E.tracked(lift, state.lifts);
        if (!L || !L.tm) { return; }
        out.push({
          day: d, id: base.id, lift: lift, basePct: base.load.pct, nowPct: last.load.pct, tm: L.tm,
          implied: E.mround(L.tm * last.load.pct / base.load.pct, state.settings.rounding)
        });
      });
    });
    return out;
  }

  // Raise the TM and put the slot's percentage back to its base for the
  // remaining weeks, so what gets prescribed stays the same weight.
  function foldSupport(ds) {
    var d = Number(ds.day), basePct = Number(ds.base), lift = ds.lift;
    state.lifts.forEach(function (l) { if (l.name === lift) { l.tm = Number(ds.tm); } });
    var dayName = state.programme.days[d].name;
    for (var w = state.cursor.week; w <= P0.weeks; w++) {
      var sl = E.slotsFor(programme(), w, d).filter(function (x) { return x.id === ds.id; })[0];
      if (sl && sl.load && sl.load.kind === 'pctTM' && (sl.load.lift || sl.movement) === lift && sl.load.pct !== basePct) {
        setOverride(w, dayName, ds.id, { load: { kind: 'pctTM', lift: lift, pct: basePct } });
      }
    }
  }

  /* ---------------- progress overview ---------------- */

  // TM after each wave, from what Apply recorded. trackerBase holds the TM the
  // wave was lifted at; the result is recomputed from it, so it never compounds.
  function waveResultsFor(name) {
    var lift = E.tracked(name, state.lifts);
    var out = [], start = null;
    P0.waveSlots.forEach(function (wave, slot) {
      var k = slot + '|' + name;
      // A wave the lift is never the main lift in has no result to wait for.
      if (!testedInWave(slot, name)) { out.push('na'); return; }
      var base = state.trackerBase[k];
      if (base === undefined) { out.push(null); return; }
      if (start === null) { start = base; }
      var reps = state.tracker[k];
      // Waves applied before the reps were remembered: the log still has them.
      if (reps === undefined) { var lr = loggedAmrapFor(slot, name); if (lr !== null) { reps = lr; } }
      var nt = E.nextTM(base, reps === undefined ? null : reps, E.standardReps(wave), lift.inc);
      out.push(nt === null ? null : nt);
    });
    return { waves: out, start: start === null ? lift.tm : start };
  }

  function isMainIn(name, week) {
    for (var d = 0; d < state.programme.days.length; d++) {
      var m = E.slotsFor(programme(), week, d).filter(function (s) { return s.id === 'main'; })[0];
      if (m && m.movement === name) { return true; }
    }
    return false;
  }

  // The next realization week, from where you are, in which this lift is a
  // main lift and its result hasn't been applied yet.
  function nextRealizationFor(name) {
    var lift = E.tracked(name, state.lifts);
    for (var slot = 0; slot < P0.waveSlots.length; slot++) {
      var week = slot * 4 + 3;
      if (week < state.cursor.week || state.trackerBase[slot + '|' + name] !== undefined || !isMainIn(name, week)) { continue; }
      var wave = P0.waveSlots[slot];
      var rows = E.WAVES[wave].Realization;
      var top = rows[rows.length - 1];
      return { slot: slot, week: week, wave: wave, std: E.standardReps(wave), kg: E.mround(lift.tm * top[0], state.settings.rounding) };
    }
    return null;
  }

  function progressOverview() {
    var names = E.progressingLifts(programme()).filter(function (n) { return E.tracked(n, state.lifts); });
    if (!names.length) { return { climb: '', preview: '' }; }
    var u = U(), total = 0;
    var cards = names.map(function (name) {
      var lift = E.tracked(name, state.lifts);
      var r = waveResultsFor(name);
      var delta = Math.round((lift.tm - r.start) * 100) / 100;
      total += delta;
      var vals = r.waves.filter(function (v) { return typeof v === 'number'; }).concat([r.start, lift.tm]);
      var lo = Math.min.apply(null, vals) * 0.97, hi = Math.max.apply(null, vals) * 1.02;
      var hpx = function (v) { return Math.max(6, Math.round((v - lo) / (hi - lo || 1) * 60)) + 'px'; };
      var bars = P0.waveSlots.map(function (wave, i) {
        var v = r.waves[i];
        if (v === 'na') {
          return '<div><div class="bar na"></div><span class="bar-label" title="' + esc(name) + ' is not the main lift in this wave">' + wave + ' · –</span></div>';
        }
        return '<div><div class="bar' + (v === null ? ' future' : '') + '" style="height:' + hpx(v === null ? lift.tm : v) + '"></div>' +
          '<span class="bar-label">' + wave + (v === null ? '' : ' · <b>' + fmt(v) + '</b>') + '</span></div>';
      }).join('');
      var nx = nextRealizationFor(name);
      return '<div class="card">' +
        '<div class="tm-top"><div><div class="tm-name">' + esc(name) + '</div><div class="tm-val">' + fmt(lift.tm) + '<small>' + u + '</small></div></div>' +
        '<span class="pill' + (delta ? ' accent' : '') + '">' + (delta > 0 ? '+' : '') + fmt(delta) + ' ' + u + '</span></div>' +
        '<div class="bars" aria-hidden="true">' + bars + '</div>' +
        '<p class="tm-next">' + (nx ? 'Next AMRAP · week ' + nx.week + ' · ' + fmt(nx.kg) + ' ' + u + ' × ' + nx.std + '+' : 'No AMRAP left for this lift in the block') + '</p>' +
        '</div>';
    }).join('');

    var withNext = names.filter(function (n) { return nextRealizationFor(n); });
    var preview = '';
    if (withNext.length) {
      var sel = withNext.indexOf(state.ui.progLift) !== -1 ? state.ui.progLift : withNext[0];
      var lift = E.tracked(sel, state.lifts);
      var nx = nextRealizationFor(sel);
      var reps = state.ui.progReps === undefined || state.ui.progReps === null ? nx.std : state.ui.progReps;
      var nt = E.nextTM(lift.tm, reps, nx.std, lift.inc);
      var over = reps - nx.std, capped = Math.min(over, E.REP_CAP_OVER_STANDARD);
      var note = over > 0
        ? over + ' over the standard × ' + fmt(lift.inc) + ' = +' + fmt(capped * lift.inc) + ' ' + u + (over > E.REP_CAP_OVER_STANDARD ? ' (capped at ' + E.REP_CAP_OVER_STANDARD + ' reps over)' : '')
        : over === 0 ? 'Hit the standard: TM holds.' : (-over) + ' under the standard: TM drops ' + fmt(-capped * lift.inc) + ' ' + u + '.';
      preview = '<div class="card">' +
        (withNext.length > 1 ? '<div class="seg" role="group" aria-label="Lift">' + withNext.map(function (n) {
          return '<button type="button" class="' + (n === sel ? 'on' : '') + '" data-action="prog-lift" data-lift="' + esc(n) + '">' + esc(n.replace(' Press', '')) + '</button>';
        }).join('') + '</div>' : '') +
        '<div class="sess-kicker" style="margin-top:14px">Week ' + nx.week + ' · ' + nx.wave + ' realization</div>' +
        '<div class="slot-name" style="font-size:28px">What your AMRAP buys</div>' +
        '<p class="slot-meta">' + esc(sel) + ' · ' + fmt(nx.kg) + ' ' + u + ' × ' + nx.std + '+ · standard ' + nx.std + '</p>' +
        '<div class="preview-row"><span>Reps</span><div class="stepper">' +
        '<button type="button" data-action="prog-step" data-d="-1" aria-label="Fewer reps">−</button><span>' + reps + '</span>' +
        '<button type="button" data-action="prog-step" data-d="1" aria-label="More reps">+</button></div></div>' +
        '<div class="tm-flow"><div><div class="k">TM now</div><div class="v">' + fmt(lift.tm) + '</div></div>' +
        icon('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>', 20) +
        '<div style="text-align:right"><div class="k">Next TM</div><div class="v new">' + fmt(nt) + '</div></div></div>' +
        '<p class="hint">' + note + ' A preview only — log the real set on Today and apply it below.</p>' +
        '</div>';
    }

    return {
      climb: '<div class="sess-kicker">Training maxes</div>' +
        '<div class="prog-head">' + (total > 0 ? '+' : '') + fmt(Math.round(total * 100) / 100) + ' ' + u + ' this block</div>' +
        '<p class="hint" style="margin-bottom:22px">Solid bars are applied waves; dashed are waves still to come.</p>' + cards,
      preview: preview
    };
  }

  function viewProgress() {
    var pr = programme();
    var lifts = E.progressingLifts(pr);
    var rows = '';
    P0.waveSlots.forEach(function (wave, slot) {
      var std = E.standardReps(wave);
      lifts.forEach(function (name) {
        var lift = E.tracked(name, state.lifts);
        if (!lift || !testedInWave(slot, name)) { return; }
        var k = slot + '|' + name;
        var reps = state.tracker[k];
        var fromLog = false;
        if (reps === undefined) {
          var lr = loggedAmrapFor(slot, name);
          if (lr !== null) { reps = lr; fromLog = true; }
        }
        // Once applied, the recompute base is the TM the wave was lifted at,
        // not the current TM — otherwise a second Apply compounds.
        var base = state.trackerBase[k] === undefined ? lift.tm : state.trackerBase[k];
        var nt = E.nextTM(base, reps === undefined ? null : reps, std, lift.inc);
        var applied = nt !== null && state.trackerBase[k] !== undefined && lift.tm === nt;
        rows += '<tr><td>Wk ' + (slot * 4 + 1) + '–' + (slot * 4 + 4) + '</td><td>' + wave + '</td><td>' + esc(name) + '</td>' +
          '<td>' + fmt(base) + '</td><td>' + std + '</td>' +
          '<td><input type="number" min="0" step="1" class="tr-reps" data-k="' + esc(k) + '" value="' + (reps === undefined || reps === null ? '' : reps) + '">' +
          (fromLog ? '<div class="hint sm">from your week ' + (slot * 4 + 3) + ' log</div>' : '') + '</td>' +
          '<td>' + fmt(lift.inc) + '</td><td class="new-tm"><b>' + (nt === null ? '–' : fmt(nt)) + '</b></td>' +
          '<td class="apply-cell">' + (applied ? '<span class="hint">applied ✓</span>'
            : (nt === null ? '' : '<button type="button" class="small" data-action="apply-tm" data-lift="' + esc(name) + '" data-tm="' + nt + '" data-k="' + esc(k) + '" data-base="' + base + '" data-reps="' + reps + '">Apply</button>')) + '</td></tr>';
      });
    });

    // Estimated 1RM per main lift, best set per session. Every accumulation and
    // intensification week ends in an AMRAP; this is what those are for.
    // Deloads are submaximal by design and would only put a fake dip in the
    // trend, so they are skipped.
    var oneRm = {};
    Object.keys(state.logs).forEach(function (k) {
      var l = state.logs[k];
      if (!l.slots || !l.slots.main || !l.slots.main.movement) { return; }
      var wk = Number(k.split('|')[0]);
      if (E.phaseFor(wk) === 'Deload') { return; }
      var best = 0;
      (l.slots.main.sets || []).forEach(function (s) {
        if (s && s.kg && s.reps) {
          var e = E.estimate1RM(s.kg, s.reps);
          if (e > best) { best = e; }
        }
      });
      if (best) { (oneRm[l.slots.main.movement] = oneRm[l.slots.main.movement] || []).push({ wk: wk, e: best }); }
    });
    var oneRmHtml = Object.keys(oneRm).sort().map(function (m) {
      var entries = oneRm[m].sort(function (a, b) { return a.wk - b.wk; }).slice(-6);
      var last = entries[entries.length - 1];
      return '<tr><td>' + esc(m) + '</td><td class="hint">' +
        entries.map(function (e) {
          return 'wk' + e.wk + ' ' + (e === last ? '<b>' + fmt(e.e) + '</b>' : fmt(e.e));
        }).join(' → ') + '</td></tr>';
    }).join('');

    // per-movement progression, newest first
    var hist = {};
    Object.keys(state.logs).forEach(function (k) {
      var l = state.logs[k];
      Object.keys(l.slots || {}).forEach(function (id) {
        var s = l.slots[id];
        if (!s || !s.movement) { return; }
        var sets = (s.sets || []).filter(function (x) { return x && x.reps; });
        if (!sets.length) { return; }
        (hist[s.movement] = hist[s.movement] || []).push({ k: k, week: Number(k.split('|')[0]), sets: sets });
      });
    });
    var histHtml = Object.keys(hist).sort().map(function (m) {
      var entries = hist[m].sort(function (a, b) { return b.week - a.week; }).slice(0, 4);
      return '<tr><td>' + esc(m) + '</td><td class="hint">' + entries.map(function (e) {
        return 'wk' + e.week + ': ' + e.sets.map(function (s) { return (s.kg === null || s.kg === undefined ? '?' : s.kg) + '×' + s.reps; }).join(', ');
      }).join(' &nbsp;|&nbsp; ') + '</td></tr>';
    }).join('');

    var full = '<section class="card"><h2>Training max</h2>' +
      '<p class="hint">New TM = old TM + (AMRAP reps − standard) × increment. A lift gets a row only in the waves where it is the main lift and takes a Realization AMRAP — Overhead Press in weeks 1–4, Bench from week 5. Miss the standard and the TM drops, which is the method working.</p>' +
      '<div class="scroll"><table class="table"><thead><tr><th>Weeks</th><th>Wave</th><th>Lift</th><th>TM</th><th>Std</th><th>AMRAP</th><th>Inc</th><th>New TM</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table></div></section>' +
      (oneRmHtml ? '<section class="card"><h2>Estimated 1RM</h2>' +
        '<p class="hint">Best set per logged main-lift session (deloads excluded). Flat into a new wave means the TM is about right; falling means it is set too high.</p>' +
        '<div class="scroll"><table class="table"><thead><tr><th>Lift</th><th>Trend (' + U() + ')</th></tr></thead><tbody>' +
        oneRmHtml + '</tbody></table></div></section>' : '') +
      (function () {
        var folds = supportFolds();
        if (!folds.length) { return ''; }
        return '<section class="card"><h2>Support lifts</h2>' +
          '<p class="hint">These support slots have progressed past their base percentage, and the lift will not be tested by an AMRAP again this block. ' +
          'Carry it into the training max before the next block — what you lift stays the same, the max just catches up.</p>' +
          '<div class="scroll"><table class="table"><thead><tr><th>Lift</th><th>TM</th><th>Base</th><th>Now</th><th>New TM</th><th></th></tr></thead><tbody>' +
          folds.map(function (f) {
            return '<tr class="fold-row"><td>' + esc(f.lift) + '</td><td>' + fmt(f.tm) + '</td><td>' + fmt(f.basePct * 100) + '%</td>' +
              '<td>' + fmt(f.nowPct * 100) + '%</td><td class="fold-tm"><b>' + fmt(f.implied) + '</b></td>' +
              '<td><button type="button" class="small" data-action="fold-support" data-lift="' + esc(f.lift) + '" data-tm="' + f.implied +
              '" data-day="' + f.day + '" data-id="' + esc(f.id) + '" data-base="' + f.basePct + '">Apply</button></td></tr>';
          }).join('') + '</tbody></table></div></section>';
      })() +
      '<section class="card"><h2>Movement history</h2>' +
      (histHtml ? '<div class="scroll"><table class="table"><thead><tr><th>Movement</th><th>Recent sessions</th></tr></thead><tbody>' + histHtml + '</tbody></table></div>'
        : '<p class="hint">Nothing logged yet.</p>') + '</section>';
    var cut = full.indexOf('</section>') + '</section>'.length;
    var ov = progressOverview();
    var view = state.ui.progView === 'amrap' ? 'amrap' : 'climb';
    var switcher = '<div class="seg" role="tablist" aria-label="Progress view" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:22px">' +
      '<button type="button" role="tab" aria-selected="' + (view === 'climb') + '" class="' + (view === 'climb' ? 'on' : '') + '" data-action="prog-view" data-view="climb">Climb</button>' +
      '<button type="button" role="tab" aria-selected="' + (view === 'amrap') + '" class="' + (view === 'amrap' ? 'on' : '') + '" data-action="prog-view" data-view="amrap">AMRAP &amp; ledger</button>' +
      '</div>';
    return view === 'climb' ? switcher + ov.climb + full.slice(cut) : switcher + ov.preview + full.slice(0, cut);
  }

  /* ---------------- library ---------------- */

  // What the Step box says about where a movement's number comes from.
  function incSourceLabel(name) {
    if ((state.movementIncrements || {})[name] > 0) { return 'set by you'; }
    var eq = equipIncrementFor(name);
    return eq === null ? 'no default step (' + equipName((movementInfo(name) || {}).equip) + ')' : 'from ' + ((movementInfo(name) || {}).equip || '');
  }

  function viewLibrary() {
    return '<section class="card"><h2>Exercise library</h2>' +
      '<p class="hint">Every exercise has an <b>equipment</b> type, and a version on different kit is its own exercise — a dumbbell fly and a machine fly step up by different amounts. ' +
      '<b>Step</b> is how much it goes up by when you earn a progression: leave it blank to follow the equipment default from Setup, or type a number to pin this one exercise to a step of its own. ' +
      'Band, bodyweight and cardio have no default step — give one a number here and it will progress.</p></section>' +
      '<section>' + P0.groups.map(function (g) {
        var items = movementsIn(g);
        if (!items.length) { return ''; }
        return '<div class="card"><h3>' + pretty(g) + '</h3>' +
          '<table class="table libtable"><thead><tr><th>Exercise</th><th>Step (' + U() + ')</th><th>Equipment</th></tr></thead><tbody>' +
          items.map(function (m) {
            var mine = (state.customMovements || []).some(function (c) { return c.name === m.name; });
            var own = (state.movementIncrements || {})[m.name];
            var eq = equipIncrementFor(m.name);
            return '<tr><td>' + esc(m.name) + ' ' + videoLink(m.name) + (mine ? ' <span class="tag">YOURS</span>' : '') +
              (m.note ? '<div class="hint sm">' + esc(m.note) + '</div>' : '') + '</td>' +
              '<td class="lib-step"><span class="lib-lbl">Step (' + U() + ')</span><input type="number" step="0.01" min="0.01" class="lib-inc" data-movement="' + esc(m.name) + '"' +
              ' value="' + (own === undefined || own === null ? '' : own) + '"' +
              ' placeholder="' + (eq === null ? '—' : eq) + '">' +
              '<div class="hint sm inc-src">' + esc(incSourceLabel(m.name)) + '</div></td>' +
              '<td class="lib-type"><span class="lib-lbl">Equipment</span><select class="lib-equip" data-movement="' + esc(m.name) + '">' +
              P0.equipment.map(function (eq) {
                return '<option value="' + eq + '"' + (eq === m.equip ? ' selected' : '') + '>' + esc(equipName(eq)) + '</option>';
              }).join('') + '</select><div class="hint sm">' + esc(m.kit) + '</div></td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('') + '</section>';
  }

  /* ---------------- reading the DOM ---------------- */

  // A set counts as done when you enter REPS. The weight box is prefilled with
  // the prescription, so recording it on its own would log sets you never did —
  // which then shadows the prescription and pollutes the history.
  function readSession() {
    var week = state.cursor.week, day = state.cursor.day;
    var log = logFor(week, day);
    var anything = false;
    document.querySelectorAll('.card.slot').forEach(function (card) {
      var id = card.dataset.slot;
      var sets = [];
      var reps = {}, kgs = {}, rirs = {};
      card.querySelectorAll('.in-reps').forEach(function (el) { reps[Number(el.dataset.i)] = num(el.value); });
      card.querySelectorAll('.in-kg').forEach(function (el) { kgs[Number(el.dataset.i)] = num(el.value); });
      card.querySelectorAll('.in-rir').forEach(function (el) { rirs[Number(el.dataset.i)] = num(el.value); });
      Object.keys(reps).forEach(function (k) {
        var i = Number(k);
        sets[i] = reps[i] === null ? null : { kg: kgs[i], reps: reps[i], rir: rirs[i] === undefined ? null : rirs[i] };
        if (sets[i]) { anything = true; }
      });
      if (sets.some(function (x) { return x; })) {
        // readSession() re-runs on every tab switch away from Today, even
        // after an explicit save — rebuilding the entry from the DOM must not
        // silently drop a progression bump a prior save already earned.
        var prevEntry = log.slots[id] || {};
        log.slots[id] = { movement: card.dataset.movement, sets: sets };
        if (prevEntry.suggestBump !== undefined) { log.slots[id].suggestBump = prevEntry.suggestBump; }
        if (prevEntry.bump) { log.slots[id].bump = prevEntry.bump; }
      } else {
        delete log.slots[id];
      }
    });
    if (anything && !log.date) { log.date = new Date().toISOString().slice(0, 10); }
    // Entries archived by a swap live under other keys and are not on screen,
    // so they must keep the session alive even when nothing else is logged.
    if (!anything && !Object.keys(log.slots).length) { delete state.logs[logKey(week, day)]; }
  }

  /* ---------------- swapping an exercise on the fly ---------------- */

  // Replace the exercise in one slot, either for this session only or for the
  // rest of the block. Main lifts are not swappable: the wave and the AMRAP
  // that drives the training max belong to the lift, not the slot.
  function applySwap(slotId, scope) {
    var card = document.querySelector('.card.slot[data-slot="' + slotId + '"]');
    var sel = card && card.querySelector('.swap-select');
    if (!sel) { return; }
    var name = sel.value;
    var week = state.cursor.week, day = state.cursor.day;
    var dayName = state.programme.days[day].name;
    var cur = E.prescribeDay(programme(), week, day, ctx()).filter(function (p) { return p.id === slotId; })[0];
    if (!cur || cur.slot.load.kind === 'wave') { return; }
    var oldMovement = cur.movement;

    if (name === '__add__') {
      var grp = (movementInfo(oldMovement) || {}).group || P0.groups[0];
      name = (card.querySelector('.swap-name').value || '').trim();
      var eqSel = card.querySelector('.swap-equip').value;
      if (!name) { toast('Type a name for the new exercise'); return; }
      if (!movementInfo(name)) {
        // Every exercise carries an equipment type, so it cannot be created without one.
        if (!eqSel) { toast('Pick its equipment — it sets how the weight steps up'); return; }
        state.customMovements.push({ name: name, group: grp, kit: '', equip: eqSel, note: '' });
      }
    }
    if (name === oldMovement) { swapOpen = null; render(); return; }

    // Anything already typed for the old exercise is kept, under its own name.
    readSession();
    var log = state.logs[logKey(week, day)];
    var entry = log && log.slots[slotId];
    if (entry && (entry.sets || []).some(function (x) { return x && x.reps; })) {
      var n = 1;
      while (log.slots[slotId + '~' + n]) { n++; }
      log.slots[slotId + '~' + n] = entry;
      delete log.slots[slotId];
    }

    // The new exercise is a different load, so the old prescription (a fixed
    // 60 kg, or a percentage of a max that has nothing to do with it) is
    // dropped. Its own history supplies the weight from here.
    var patch = { movement: name, load: { kind: 'open' } };
    var changed = 0;
    for (var w = week; w <= P0.weeks; w++) {
      if (scope === 'today' && w !== week) { break; }
      var sl = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === slotId; })[0];
      // "From now on" replaces this exercise, not whatever a later week has
      // deliberately put in the slot.
      if (sl && sl.movement === oldMovement) { setOverride(w, dayName, slotId, JSON.parse(JSON.stringify(patch))); changed++; }
    }
    swapOpen = null;
    save(); render();
    toast(oldMovement + ' → ' + name + (scope === 'today' ? ' for today' : ' for ' + changed + ' week' + (changed === 1 ? '' : 's')));
  }

  function readSlotEdits() {
    var week = state.ui.blockWeek, day = state.ui.blockDay;
    var dayName = state.programme.days[day].name;
    document.querySelectorAll('.card.slotedit').forEach(function (card) {
      var id = card.dataset.slot;
      var patch = {};
      var mv = card.querySelector('.s-move');
      if (mv && mv.value !== '__add__') { patch.movement = mv.value; }
      // Equipment belongs to the movement, not the week — record it against the
      // movement the select was rendered for, not whatever it has since become.
      var eqSel = card.querySelector('.s-equip');
      if (eqSel) {
        var forMovement = eqSel.dataset.movement;
        var base = (P0.movements.concat(state.customMovements || []))
          .filter(function (m) { return m.name === forMovement; })[0];
        if (base && eqSel.value === base.equip) { delete state.equipOverrides[forMovement]; }
        else if (base) { state.equipOverrides[forMovement] = eqSel.value; }
      }
      var kindSel = card.querySelector('.s-loadkind');
      if (kindSel) {
        var kind = kindSel.value;
        var load = { kind: kind };
        if (kind === 'pctTM') {
          load.lift = card.querySelector('.s-loadlift') ? card.querySelector('.s-loadlift').value : patch.movement;
          var pv = num(card.querySelector('.s-pct') ? card.querySelector('.s-pct').value : null);
          load.pct = pv === null ? 0.6 : pv / 100;
        } else if (kind === 'weight') {
          load.kg = num(card.querySelector('.s-kg') ? card.querySelector('.s-kg').value : null);
        } else if (kind === 'bodyweight') {
          load.added = num(card.querySelector('.s-added') ? card.querySelector('.s-added').value : 0) || 0;
        }
        patch.load = load;
        var sv = num(card.querySelector('.s-sets').value); if (sv) { patch.sets = sv; }
        var rv = num(card.querySelector('.s-reps').value); if (rv) { patch.reps = rv; }
        // A blank or non-rising top is stored as null, not left out, so this
        // week really is fixed reps rather than inheriting the template's range.
        var tv = num(card.querySelector('.s-reps-top').value);
        patch.repsTop = tv !== null && tv > (rv || 0) ? tv : null;
        var rir = num(card.querySelector('.s-rir').value); if (rir !== null) { patch.rir = rir; }
      }
      setOverride(week, dayName, id, patch);
    });
  }

  function setOverride(week, dayName, slotId, patch) {
    var ov = state.programme.weekOverrides;
    ov[week] = ov[week] || {};
    ov[week][dayName] = ov[week][dayName] || { slots: {} };
    ov[week][dayName].slots = ov[week][dayName].slots || {};
    var cur = ov[week][dayName].slots[slotId] || {};
    Object.keys(patch).forEach(function (k) { cur[k] = patch[k]; });
    ov[week][dayName].slots[slotId] = cur;
  }

  // Autoregulated accessory progression. Every prescribed set has to be done
  // at or above the prescribed weight, with a RIR logged on it. Then:
  //
  //  - A rep range (10-12) is double progression: the weight stays while the
  //    reps climb, and goes up once every set reaches the TOP of the range at
  //    the target RIR or easier. Reaching the top is itself the "easier than
  //    planned" signal, so the RIR only has to hold, not beat the target —
  //    asking for both would make the weight move slower than the reps earn.
  //    After the bump you drop back to the bottom of the range.
  //  - Fixed reps (the %TM supports, or a range cleared in Block) have no rep
  //    headroom to show it, so every set must hit the reps with a RIR strictly
  //    higher than prescribed — genuinely easier, not just "got through it".
  //
  // Fixed-number loads (weight, bodyweight) get a real plan change: the new
  // number is written forward into every remaining week, same mechanism as
  // "Apply to all weeks" in Block, so it shows up there too. Open loads have
  // no plan number to write — the suggested prefill just carries the bump
  // forward from the log (see suggestedKgFor) without touching what you
  // actually logged.
  //
  // Covers every non-main slot. %TM slots (a support lift at 65% of its own
  // max) progress by raising the slot's own percentage, never the training
  // max: Bench's TM has to move only through its Realization AMRAP, and
  // Overhead Press never gets a second AMRAP after week 4, so a support set
  // is the only signal left for it. The main lift is the one exclusion — it
  // follows the wave table and its TM follows the AMRAP, which is the method.
  //
  // The step comes from the movement's equipment, not one global number — a
  // cable stack and a pair of dumbbells do not jump by the same amount.
  // A support set is not a top set: past this share of the max it stops being
  // volume work behind the main lift and starts competing with it.
  var MAX_SUPPORT_PCT = 0.85;

  // Fixed-rep exercises where reps were logged on some set but RIR was left
  // blank. Fixed reps progress on a beaten RIR, so these silently never move.
  // A rep range progresses on reps alone, so its RIR is optional.
  function missingRir(week, day) {
    var log = state.logs[logKey(week, day)];
    if (!log) { return []; }
    var out = [];
    E.prescribeDay(programme(), week, day, ctx()).forEach(function (p) {
      if (p.slot.load.kind === 'wave' || p.repsTop) { return; }
      var entry = log.slots[p.id];
      if (!entry || !entry.sets) { return; }
      var gap = entry.sets.some(function (x) { return x && x.reps && (x.rir === null || x.rir === undefined); });
      if (gap) { out.push(p.movement); }
    });
    return out;
  }

  function saveMessage(bumped, noRir, fallback) {
    var parts = [];
    if (bumped.length) { parts.push('Progressed: ' + bumped.join(', ')); }
    if (noRir.length) { parts.push('No RIR on ' + noRir.join(', ') + ' — can\'t progress'); }
    return parts.length ? parts.join(' · ') : fallback;
  }

  // The plan number a fixed load carries, and the load that puts it back.
  function loadValue(load) {
    if (!load) { return null; }
    if (load.kind === 'weight') { return load.kg; }
    if (load.kind === 'bodyweight') { return load.added || 0; }
    if (load.kind === 'pctTM') { return load.pct; }
    return null;
  }
  function loadWith(kind, lift, value) {
    if (kind === 'weight') { return { kind: 'weight', kg: value }; }
    if (kind === 'bodyweight') { return { kind: 'bodyweight', added: value }; }
    return { kind: 'pctTM', lift: lift, pct: value };
  }

  // Write a bump forward into every remaining week that still holds this
  // movement — a week reassigned to another exercise keeps its own number.
  // A percentage only replaces a percentage; a weight also fills in weeks
  // left at "your call", but never overwrites a percentage of a max.
  function writeForward(week, day, p, kind, value) {
    var dayName = state.programme.days[day].name;
    for (var w = week + 1; w <= P0.weeks; w++) {
      var fs = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === p.id; })[0];
      if (!fs || fs.movement !== p.movement || !fs.load) { continue; }
      if (kind === 'pctTM' ? fs.load.kind === 'pctTM' : (fs.load.kind !== 'pctTM' && fs.load.kind !== 'wave')) {
        setOverride(w, dayName, p.id, { load: loadWith(kind, p.slot.load.lift || p.movement, value) });
      }
    }
  }

  // A session re-saved after a correction no longer qualifies: take back the
  // bump it wrote. Only weeks still holding the bumped number are reset, so a
  // later session's own bump, or a number typed in Block since, survives.
  function undoBump(week, day, p, entry) {
    var b = entry.bump;
    delete entry.bump; delete entry.suggestBump;
    if (!b || b.kind === 'open') { return; }
    var dayName = state.programme.days[day].name;
    for (var w = week + 1; w <= P0.weeks; w++) {
      var fs = E.slotsFor(programme(), w, day).filter(function (x) { return x.id === p.id; })[0];
      if (fs && fs.movement === p.movement && fs.load && fs.load.kind === b.kind && loadValue(fs.load) === b.to) {
        setOverride(w, dayName, p.id, { load: loadWith(b.kind, b.lift, b.from) });
      }
    }
  }

  // Whether a logged slot earned its bump. Every prescribed set must be done
  // at or above the target weight. A rep range then asks only that every set
  // reached the top — no RIR: the rep count is measured, a RIR is a guess, and
  // reaching the top of the range is the proof the weight got easier. Fixed
  // reps have no headroom to show that, so they still need every set at the
  // target reps with a RIR strictly higher than prescribed.
  function earnedBump(p, entry, week, day) {
    if (!entry || !entry.sets || entry.sets.length < p.sets.length) { return false; }
    return p.sets.every(function (s, i) {
      var lg = entry.sets[i];
      if (!lg || lg.reps === null || lg.reps === undefined || lg.reps < (s.top || s.reps)) { return false; }
      if (lg.kg === null || lg.kg === undefined) { return false; }
      var target = s.kg === null || s.kg === undefined ? suggestedKgFor(p.movement, week, day, i) : s.kg;
      // First time on an exercise with no plan number: what you lifted is the baseline.
      if (target !== null && target !== undefined && lg.kg < target) { return false; }
      if (s.top) { return true; }
      if (lg.rir === null || lg.rir === undefined || p.rir === undefined) { return false; }
      return lg.rir > p.rir;
    });
  }

  function progressAccessories(week, day) {
    var log = state.logs[logKey(week, day)];
    if (!log) { return []; }
    // A deload is meant to leave you fresh — light sets reach the top of any
    // range easily, and each bump writes forward into every remaining week.
    if (E.phaseFor(week) === 'Deload') { return []; }
    var prescribed = E.prescribeDay(programme(), week, day, ctx());
    var bumped = [];

    prescribed.forEach(function (p) {
      if (p.slot.kind !== 'accessory' && p.slot.kind !== 'support') { return; }
      var kind = p.slot.load.kind;
      if (kind !== 'weight' && kind !== 'bodyweight' && kind !== 'open' && kind !== 'pctTM') { return; }
      // A support lift eases to 60% in Realization by design, so the load that
      // was lifted is not the slot's own percentage and cannot earn a bump.
      if (kind === 'pctTM' && E.phaseFor(week) === 'Realization') { return; }
      // A fixed weight left blank has no plan number to raise — carry the
      // bump on the log like an open load instead.
      if (kind === 'weight' && (p.slot.load.kg === null || p.slot.load.kg === undefined)) { kind = 'open'; }

      var entry = log.slots[p.id];
      if (!entry) { return; }
      var inc = incrementFor(p.movement);
      if (inc === null || !earnedBump(p, entry, week, day)) {
        if (entry.bump || entry.suggestBump !== undefined) { undoBump(week, day, p, entry); }
        return;
      }
      var reset = p.repsTop ? ', back to ' + p.sets[0].reps + ' reps' : '';

      if (kind === 'pctTM') {
        var basis = E.tracked(p.slot.load.lift || p.movement, state.lifts);
        if (!basis || !basis.tm) { return; }
        // One loadable step above what was prescribed, expressed back as a
        // percentage. The step is never smaller than the rounding, or the bump
        // would round away and the slot would sit still.
        var cur = p.sets[p.sets.length - 1].kg;
        var rounding = state.settings.rounding;
        var stepKg = Math.max(inc, rounding);
        var nextKg = E.mround(cur + stepKg, rounding);
        if (nextKg <= cur) { nextKg = cur + rounding; }
        var nextPct = Math.round(nextKg / basis.tm * 10000) / 10000;
        if (nextPct > MAX_SUPPORT_PCT) { return; }
        writeForward(week, day, p, 'pctTM', nextPct);
        entry.bump = { kind: 'pctTM', lift: p.slot.load.lift || p.movement, from: p.slot.load.pct, to: nextPct, inc: nextKg - cur };
        bumped.push(p.movement + ' → ' + fmt(nextKg) + U() + ' (' + fmt(nextPct * 100) + '% TM)' + reset);
      } else if (kind === 'weight' || kind === 'bodyweight') {
        var base = loadValue(p.slot.load);
        var next = Math.round((base + inc) * 100) / 100;
        writeForward(week, day, p, kind, next);
        entry.bump = { kind: kind, from: base, to: next, inc: inc };
        bumped.push(p.movement + ' → ' + fmt(next) + (kind === 'weight' ? U() : ' added') + reset);
      } else {
        entry.suggestBump = inc;
        entry.bump = { kind: 'open', inc: inc };
        bumped.push(p.movement + ' → +' + fmt(inc) + U() + ' next time' + reset);
      }
    });

    return bumped;
  }

  /* ---------------- actions ---------------- */

  function advance() {
    var days = state.programme.days.length;
    if (state.cursor.day < days - 1) { state.cursor.day++; }
    else if (state.cursor.week < P0.weeks) { state.cursor.week++; state.cursor.day = 0; }
  }
  function retreat() {
    var days = state.programme.days.length;
    if (state.cursor.day > 0) { state.cursor.day--; }
    else if (state.cursor.week > 1) { state.cursor.week--; state.cursor.day = days - 1; }
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportCSV() {
    var rows = [['Week', 'Day', 'Movement', 'Set', U(), 'Reps']];
    Object.keys(state.logs).sort(function (a, b) {
      return Number(a.split('|')[0]) - Number(b.split('|')[0]) || Number(a.split('|')[1]) - Number(b.split('|')[1]);
    }).forEach(function (k) {
      var parts = k.split('|'), l = state.logs[k];
      Object.keys(l.slots || {}).forEach(function (id) {
        var s = l.slots[id];
        (s.sets || []).forEach(function (x, i) {
          if (!x || x.reps === null || x.reps === undefined) { return; }
          rows.push([parts[0], state.programme.days[Number(parts[1])].name, s.movement, i + 1, x.kg, x.reps]);
        });
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var v = c === null || c === undefined ? '' : String(c);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\n');
    download(new Blob([csv], { type: 'text/csv' }), 'juggernaut-log.csv');
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!btn) { return; }
    var a = btn.dataset.action;
    if (a === 'cell' || a === 'step' || a === 'log-set' || a === 'clear-set') { setAction(btn, a); return; }
    if (a === 'prog-view') { state.ui.progView = btn.dataset.view; save(); render(); return; }
    if (a === 'prog-lift') { state.ui.progLift = btn.dataset.lift; state.ui.progReps = null; save(); render(); return; }
    if (a === 'prog-step') {
      var pnames = E.progressingLifts(programme()).filter(function (n) { return E.tracked(n, state.lifts) && nextRealizationFor(n); });
      var psel = pnames.indexOf(state.ui.progLift) !== -1 ? state.ui.progLift : pnames[0];
      var pnx = psel ? nextRealizationFor(psel) : null;
      var pbase = state.ui.progReps === undefined || state.ui.progReps === null ? (pnx ? pnx.std : 0) : state.ui.progReps;
      state.ui.progReps = Math.max(0, pbase + Number(btn.dataset.d)); render(); return;
    }
    if (a === 'tab') {
      if (state.ui.tab === 'today') { readSession(); }
      swapOpen = null;
      state.ui.tab = btn.dataset.tab; save(); render();
    } else if (a === 'swap-open') {
      readSession(); save();
      swapOpen = btn.dataset.slot; render();
    } else if (a === 'swap-cancel') {
      swapOpen = null; render();
    } else if (a === 'swap-today') {
      applySwap(btn.dataset.slot, 'today');
    } else if (a === 'swap-forward') {
      applySwap(btn.dataset.slot, 'forward');
    } else if (a === 'dismiss-migrate') {
      delete state.migrated; save(); render();
    } else if (a === 'save-session') {
      readSession(); swapOpen = null;
      var bumped1 = progressAccessories(state.cursor.week, state.cursor.day);
      var noRir1 = missingRir(state.cursor.week, state.cursor.day);
      save(); render();
      toast(saveMessage(bumped1, noRir1, 'Session saved'), noRir1.length ? 5000 : 0);
    } else if (a === 'finish-session') {
      readSession(); swapOpen = null;
      var bumped2 = progressAccessories(state.cursor.week, state.cursor.day);
      var noRir2 = missingRir(state.cursor.week, state.cursor.day);
      save(); advance(); save(); render();
      toast(saveMessage(bumped2, noRir2, 'Next session'), noRir2.length ? 5000 : 0);
    } else if (a === 'skip-back') {
      readSession(); swapOpen = null; save(); retreat(); save(); render();
    } else if (a === 'block-day') {
      readSlotEdits(); state.ui.blockDay = Number(btn.dataset.day); save(); render();
    } else if (a === 'save-slots') {
      readSlotEdits(); save(); render(); toast('Week ' + state.ui.blockWeek + ' saved');
    } else if (a === 'push-all') {
      readSlotEdits();
      var week = state.ui.blockWeek, dayName = state.programme.days[state.ui.blockDay].name;
      var src = ((state.programme.weekOverrides[week] || {})[dayName] || {}).slots || {};
      for (var w = 1; w <= P0.weeks; w++) {
        Object.keys(src).forEach(function (id) {
          var patch = JSON.parse(JSON.stringify(src[id]));
          // set counts stay per-week so the phase rules keep their shape
          delete patch.sets;
          setOverride(w, dayName, id, patch);
        });
      }
      save(); render(); toast('Applied to all ' + P0.weeks + ' weeks (set counts kept)');
    } else if (a === 'jump-here') {
      state.cursor = { week: state.ui.blockWeek, day: state.ui.blockDay };
      state.ui.tab = 'today'; save(); render();
    } else if (a === 'start-week') {
      var startWeek = Number(document.getElementById('start-week').value);
      var startDay = Number(document.getElementById('start-day').value);
      state.cursor = { week: startWeek, day: startDay };
      state.ui.blockWeek = startWeek; state.ui.blockDay = startDay;
      state.ui.tab = 'today'; save(); render();
      toast('Starting at ' + programme().days[startDay].name + ', Week ' + startWeek);
    } else if (a === 'save-setup') {
      document.querySelectorAll('.in-tm').forEach(function (el) {
        var v = num(el.value); if (v !== null) { state.lifts[Number(el.dataset.i)].tm = v; }
      });
      document.querySelectorAll('.in-inc').forEach(function (el) {
        var v = num(el.value); if (v !== null) { state.lifts[Number(el.dataset.i)].inc = v; }
      });
      document.querySelectorAll('.in-step').forEach(function (el) {
        var v = num(el.value); if (v !== null && v > 0) { state.settings.increments[el.dataset.equip] = v; }
      });
      state.settings.unit = document.getElementById('in-unit').value;
      var r = num(document.getElementById('in-round').value); if (r > 0) { state.settings.rounding = r; }
      var bw = num(document.getElementById('in-bw').value); if (bw !== null) { state.settings.bodyweight = bw; }
      var m = num(document.getElementById('in-maint').value); if (m !== null) { state.settings.maintenance = m; }
      var su = num(document.getElementById('in-surplus').value); if (su !== null) { state.settings.surplus = su; }
      save(); render(); toast('Saved');
    } else if (a === 'apply-tm') {
      var lname = btn.dataset.lift, tm = Number(btn.dataset.tm);
      if (btn.dataset.k !== undefined) {
        state.trackerBase[btn.dataset.k] = Number(btn.dataset.base);
        // Remember the reps the new TM came from. When they were pre-filled from
        // the Today log rather than typed into the tracker, nothing else stored
        // them, and the Climb had no result to draw for a wave that was applied.
        if (btn.dataset.reps !== undefined && btn.dataset.reps !== '') { state.tracker[btn.dataset.k] = Number(btn.dataset.reps); }
      }
      state.lifts.forEach(function (l) { if (l.name === lname) { l.tm = tm; } });
      save(); render(); toast(lname + ' TM → ' + fmt(tm));
    } else if (a === 'export') {
      state.backupThrough = maxLoggedWeek();
      state.lastExportAt = new Date().toISOString().slice(0, 10);
      save();
      download(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }),
        'juggernaut-v2-' + state.lastExportAt + '.json');
      render(); toast('Backup exported');
    } else if (a === 'dismiss-backup') {
      state.backupDismissedThrough = unbackedRealization();
      save(); render();
    } else if (a === 'fold-support') {
      foldSupport(btn.dataset);
      save(); render(); toast(btn.dataset.lift + ' TM → ' + fmt(Number(btn.dataset.tm)) + ', support back to ' + fmt(Number(btn.dataset.base) * 100) + '%');
    } else if (a === 'export-csv') {
      exportCSV();
    } else if (a === 'import') {
      document.getElementById('import-file').click();
    } else if (a === 'reset') {
      if (confirm('Reset everything to the programme defaults?')) { state = defaultState(); save(); render(); }
    }
  });

  function trackerInput(el) {
    var k = el.dataset.k, v = num(el.value);
    if (v === null) { delete state.tracker[k]; } else { state.tracker[k] = v; }
    save();
    var parts = k.split('|'), name = parts[1];
    var lift = E.tracked(name, state.lifts);
    var wave = P0.waveSlots[Number(parts[0])];
    var base = state.trackerBase[k] === undefined ? lift.tm : state.trackerBase[k];
    var nt = E.nextTM(base, v, E.standardReps(wave), lift.inc);
    var row = el.closest('tr');
    row.querySelector('.new-tm').innerHTML = '<b>' + (nt === null ? '–' : fmt(nt)) + '</b>';
    row.querySelector('.apply-cell').innerHTML = nt === null ? ''
      : (state.trackerBase[k] !== undefined && lift.tm === nt ? '<span class="hint">applied ✓</span>'
        : '<button type="button" class="small" data-action="apply-tm" data-lift="' + esc(name) + '" data-tm="' + nt + '" data-k="' + esc(k) + '" data-base="' + base + '" data-reps="' + v + '">Apply</button>');
  }

  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('tr-reps')) { trackerInput(e.target); }
    else if (e.target.classList && e.target.classList.contains('lib-inc')) { libIncInput(e.target); }
    else if (e.target.closest && e.target.closest('.editor')) {
      refreshCell(e.target.closest('.card.slot'), e.target.closest('.editor').dataset.i);
    }
  });

  // Patched in place rather than re-rendered: a re-render on every keystroke
  // would take the focus out of the box you are typing in.
  function libIncInput(el) {
    var name = el.dataset.movement;
    var v = num(el.value);
    if (v === null || v <= 0) { delete state.movementIncrements[name]; }
    else { state.movementIncrements[name] = v; }
    save();
    var src = el.parentNode.querySelector('.inc-src');
    if (src) { src.textContent = incSourceLabel(name); }
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.closest && t.closest('.editor')) { persistSession(); return; }
    if (t.classList.contains('lib-equip')) {
      var lname = t.dataset.movement;
      var baseM = P0.movements.concat(state.customMovements || []).filter(function (m) { return m.name === lname; })[0];
      if (baseM && t.value === baseM.equip) { delete state.equipOverrides[lname]; }
      else { state.equipOverrides[lname] = t.value; }
      save(); render();
    }
    else if (t.classList.contains('swap-select')) {
      var addBox = t.closest('.swap-panel').querySelector('.swap-add');
      if (addBox) { addBox.hidden = t.value !== '__add__'; }
    }
    else if (t.id === 'block-week') { readSlotEdits(); state.ui.blockWeek = Number(t.value); save(); render(); }
    else if (t.classList.contains('s-group')) {
      readSlotEdits();
      var card = t.closest('.slotedit');
      var first = movementsIn(t.value)[0];
      if (first) {
        setOverride(state.ui.blockWeek, state.programme.days[state.ui.blockDay].name, card.dataset.slot, { movement: first.name });
      }
      save(); render();
    }
    else if (t.classList.contains('s-move') && t.value === '__add__') {
      var card2 = t.closest('.slotedit');
      var grp = card2.querySelector('.s-group') ? card2.querySelector('.s-group').value : P0.groups[0];
      var name = (window.prompt('Add a movement to ' + pretty(grp)) || '').trim();
      // Every exercise needs an equipment type, so ask for one before it exists.
      if (name && !movementInfo(name)) {
        var eqAns = (window.prompt('Equipment for ' + name + ': ' + P0.equipment.join(', '), 'machine') || '').trim().toLowerCase();
        if (P0.equipment.indexOf(eqAns) === -1) { toast('Not added — equipment must be one of: ' + P0.equipment.join(', '), 5000); name = ''; }
        else { state.customMovements.push({ name: name, group: grp, kit: '', equip: eqAns, note: '' }); }
      }
      if (name) {
        setOverride(state.ui.blockWeek, state.programme.days[state.ui.blockDay].name, card2.dataset.slot, { movement: name });
      }
      save(); render();
    }
    else if (t.classList.contains('s-move') || t.classList.contains('s-loadkind') ||
      t.classList.contains('s-loadlift') || t.classList.contains('s-equip')) {
      readSlotEdits(); save(); render();
    }
    else if (t.id === 'import-file') {
      var f = t.files[0];
      if (f) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            if (!parsed || !parsed.lifts || !parsed.programme) { throw new Error('bad'); }
            state = upgrade(parsed); save(); render(); toast('Imported');
          } catch (err) { toast('Import failed'); }
        };
        reader.readAsText(f);
      }
      t.value = '';
    }
  });

  render();
})();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
